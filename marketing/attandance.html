<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Attendance - Realtime</title>
    
    <meta name="theme-color" content="#0b111a">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Added html2canvas for Image Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* Hide all scrollbars completely but keep scroll functionality */
        ::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
        * { scrollbar-width: none !important; -ms-overflow-style: none !important; }

        /* Shared Core Theme */
        :root {
            --bg-color: #0b111a; 
            --surface-color: #131b26; 
            --surface-hover: #1b2636;
            --text-color: #ffffff;
            --text-secondary: #94a3b8;
            --meena-red: #ef4444; 
            --accent-color: #0d9488; 
            --success-color: #10b981; 
            --warning-color: #f59e0b;
            --nav-bg: rgba(19, 27, 38, 0.85); 
            --input-border: #334155;
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        html, body { height: 100%; margin: 0; padding: 0; width: 100%; overflow-x: hidden; background-color: var(--bg-color); color: var(--text-color); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        *, *::before, *::after { box-sizing: border-box; }
        .no-select { user-select: none; -webkit-user-select: none; }

        /* Header */
        header { background-color: #212121; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: 16px 20px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 500; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .back-btn { background: none; border: none; color: white; cursor: pointer; display: flex; padding: 8px; border-radius: 50%; transition: 0.2s; margin-left: -8px;}
        .back-btn:hover { background: rgba(255,255,255,0.1); }
        header h1 { margin: 0; margin-right: auto; font-size: 1.25em; font-weight: 600; letter-spacing: -0.01em; }
        .action-btn { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1); color: white; cursor: pointer; display: flex; padding: 8px; border-radius: 50%; transition: all 0.2s ease; }
        .action-btn:active { transform: scale(0.95); }

        /* Views */
        .view-section { display: none; padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; animation: fadeIn 0.3s ease; padding-bottom: 120px; }
        .view-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Top Bar & Animated Search (Replaces Bottom Summary) */
        .home-top-bar { display: flex; align-items: center; justify-content: space-between; background: var(--surface-color); border: 1px solid var(--input-border); padding: 10px 20px; border-radius: 16px; margin-bottom: 20px; position: relative; height: 56px; overflow: hidden; }
        .inline-summary { display: flex; gap: 15px; align-items: center; width: 100%; transition: opacity 0.4s ease, transform 0.4s ease; transform: translateX(0); opacity: 1; justify-content: space-between; padding-right: 15px;}
        .inline-summary.dispersed { opacity: 0; transform: translateX(-30px); pointer-events: none; position: absolute; }
        .inline-sum-block { display: flex; align-items: center; gap: 6px; }
        .inline-sum-label { font-size: 0.85em; color: var(--text-secondary); font-weight: 700; text-transform: uppercase; }
        .inline-sum-val { font-size: 1.2em; font-weight: 800; }
        
        .animated-search-bar { position: absolute; left: 20px; right: 50px; background: transparent; border: none; color: white; font-size: 1em; outline: none; height: 100%; transform: translateX(100%); opacity: 0; pointer-events: none; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); width: calc(100% - 70px); }
        .animated-search-bar.active { transform: translateX(0); opacity: 1; pointer-events: auto; }
        
        .search-icon-btn { background: none; border: none; color: var(--text-secondary); padding: 5px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; transition: color 0.2s; margin-left: auto; }
        .search-icon-btn:hover { color: white; }

        /* Standard Search Bar (used in other views) */
        .search-bar { width: 100%; background: var(--surface-color); border: 1px solid var(--input-border); padding: 14px 20px; border-radius: 16px; color: white; font-size: 1em; margin-bottom: 20px; outline: none; }
        .search-bar:focus { border-color: var(--accent-color); }

        /* Cards */
        .emp-card { background: var(--surface-color); border: 1px solid var(--input-border); border-radius: 20px; padding: 20px; box-shadow: var(--shadow-lg); margin-bottom: 15px; display: flex; flex-direction: column; gap: 15px; }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; }
        .emp-name { font-size: 1.2em; font-weight: 700; margin-bottom: 5px; word-wrap: break-word; transition: 0.3s; }
        .emp-role { font-size: 0.8em; font-weight: 600; color: var(--accent-color); background: rgba(13, 148, 136, 0.1); padding: 4px 10px; border-radius: 8px; border: 1px solid rgba(13, 148, 136, 0.2); transition: 0.3s;}
        .emp-wage { font-weight: 700; color: white; background: rgba(255,255,255,0.05); padding: 6px 12px; border-radius: 10px; font-size: 0.9em; transition: 0.3s; white-space: nowrap;}
        
        /* Attendance Buttons */
        .att-btn-group { display: flex; gap: 10px; width: 100%; }
        .att-btn { flex: 1; padding: 12px 0; border: 1px solid var(--input-border); border-radius: 12px; background: rgba(255,255,255,0.03); color: var(--text-secondary); font-weight: 600; font-size: 0.9em; cursor: pointer; transition: 0.2s; }
        .att-btn.present { border-color: var(--success-color); color: var(--success-color); background: rgba(16, 185, 129, 0.1); }
        .att-btn.present.active { background: var(--success-color); color: white; }
        .att-btn.half { border-color: var(--warning-color); color: var(--warning-color); background: rgba(245, 158, 11, 0.1); }
        .att-btn.half.active { background: var(--warning-color); color: white; }
        .att-btn.absent { border-color: var(--meena-red); color: var(--meena-red); background: rgba(239, 68, 68, 0.1); }
        .att-btn.absent.active { background: var(--meena-red); color: white; }

        /* Report Table */
        .table-container { overflow-x: auto; background: var(--surface-color); border-radius: 16px; border: 1px solid var(--input-border); }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); border-right: 1px solid rgba(255,255,255,0.05); font-size: 0.85em; }
        th { background: rgba(255,255,255,0.02); color: var(--text-secondary); font-weight: 600; white-space: nowrap; }
        .sticky-col { position: sticky; left: 0; background: var(--surface-color); z-index: 10; text-align: left; border-right: 1px solid var(--input-border); font-weight: 600; white-space: nowrap; }
        .dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; }
        .dot.P { background-color: var(--success-color); }
        .dot.H { background-color: var(--warning-color); }
        .dot.A { background-color: var(--meena-red); }
        .total-wage { font-weight: 800; color: #a855f7; font-size: 1.1em; white-space: nowrap; }

        /* Admin Numpad */
        .pin-dots { display: flex; justify-content: center; gap: 15px; margin: 40px 0; }
        .pin-dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--text-secondary); }
        .pin-dot.filled { background: white; border-color: white; }
        .numpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; max-width: 300px; margin: 0 auto; }
        .num-btn { background: var(--surface-color); border: 1px solid var(--input-border); color: white; font-size: 1.5em; width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto; cursor: pointer; }
        .num-btn:active { background: rgba(255,255,255,0.1); }

        /* Custom Modal & Overlays */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .overlay.active { display: flex; }
        .modal-card { background: var(--surface-color); border: 1px solid var(--input-border); border-radius: 20px; padding: 25px; width: 100%; max-width: 400px; text-align: center; }
        .modal-card h3 { margin-top: 0; font-size: 1.2em; }
        .modal-card input { width: 100%; background: rgba(0,0,0,0.2); border: 1px solid var(--input-border); padding: 12px; border-radius: 10px; color: white; margin-bottom: 15px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .modal-btn { flex: 1; padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer; border: none; }
        .btn-cancel { background: rgba(255,255,255,0.1); color: white; }
        .btn-confirm { background: var(--success-color); color: white; }
        .btn-confirm:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-danger { background: var(--meena-red); color: white; }
        .load-more { width: 100%; padding: 15px; background: transparent; border: 1px dashed var(--text-secondary); color: var(--text-secondary); border-radius: 12px; cursor: pointer; margin-top: 10px;}
        .loading-text { text-align: center; padding: 20px; color: var(--text-secondary); }

        /* Floating Date Picker Pill */
        .fab-date {
            position: fixed;
            bottom: 30px;
            right: 20px;
            background: var(--accent-color);
            color: white;
            border-radius: 30px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(13, 148, 136, 0.4);
            cursor: pointer;
            z-index: 400;
            transition: transform 0.2s, background 0.3s;
            font-weight: 600;
            font-size: 0.9em;
        }
        .fab-date:active { transform: scale(0.95); }
        .fab-date input[type="date"] {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer;
            -webkit-appearance: none;
        }

        /* Skeleton Animations */
        .skeleton { background: #1e293b; background-image: linear-gradient(90deg, rgba(255,255,255,0) 0px, rgba(255,255,255,0.06) 40px, rgba(255,255,255,0) 80px); background-size: 200% 100%; animation: shimmer 1.5s infinite linear; border-radius: 6px; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

        /* Utilities */
        .hidden { display: none !important; }
        .text-center { text-align: center; }
    </style>
</head>
<body>

    <!-- Main Header -->
    <header class="no-select">
        <button id="backBtn" class="back-btn" onclick="app.goBack()">
            <svg class="material-symbols-outlined" width="24" height="24" viewBox="0 -960 960 960" fill="currentColor"><path d="m313-440 224 224-57 56-320-320 320-320 57 56-224 224h487v80H313Z"/></svg>
        </button>
        <h1 id="headerTitle">Attendance</h1>
        
        <button id="btnAdmin" class="action-btn" onclick="app.navigate('admin-lock')">
            <svg class="material-symbols-outlined" width="20" height="20" viewBox="0 -960 960 960" fill="currentColor"><path d="M240-80q-33 0-56.5-23.5T160-160v-400q0-33 23.5-56.5T240-640h40v-80q0-83 58.5-141.5T480-920q83 0 141.5 58.5T680-720v80h40q33 0 56.5 23.5T800-560v400q0 33-23.5 56.5T720-80H240Zm240-200q33 0 56.5-23.5T560-360q0-33-23.5-56.5T480-440q-33 0-56.5 23.5T400-360q0 33 23.5 56.5T480-280ZM360-640h240v-80q0-50-35-85t-85-35q-50 0-85 35t-35 85v80Z"/></svg>
        </button>
        <button id="btnReport" class="action-btn" onclick="app.navigate('report')">
            <svg class="material-symbols-outlined" width="20" height="20" viewBox="0 -960 960 960" fill="currentColor"><path d="M200-80q-33 0-56.5-23.5T120-160v-640q0-33 23.5-56.5T200-880h320l240 240v480q0 33-23.5 56.5T720-80H200Zm280-520v-200H200v640h520v-440H480ZM240-240h480v-80H240v80Zm0-120h480v-80H240v80Zm0-120h200v-80H240v80ZM200-800v200-200 640-640Z"/></svg>
        </button>
        <button id="btnEmployees" class="action-btn" onclick="app.navigate('employees')">
            <svg class="material-symbols-outlined" width="20" height="20" viewBox="0 -960 960 960" fill="currentColor"><path d="M0-240v-63q0-43 44-70t116-27q13 0 25 .5t23 2.5q-14 21-21 44t-7 48v65H0Zm240 0v-65q0-32 17.5-58.5T307-410q32-20 76.5-30t96.5-10q53 0 97.5 10t76.5 30q32 20 49 46.5t17 58.5v65H240Zm540 0H600v-65q0-25-7-48t-21-44q11-2 23-2.5t25-.5q72 0 116 27t44 70v63ZM160-440q-50 0-85-35t-35-85q0-51 35-85.5t85-34.5q51 0 85.5 34.5T280-560q0 50-34.5 85T160-440Zm480 0q-51 0-85.5-35T520-560q0-51 34.5-85.5T640-680q50 0 85 34.5T760-560q0 50-35 85t-85 35Z"/></svg>
        </button>
        <button id="btnAddEmp" class="action-btn hidden" onclick="app.openEmpForm()">
            <svg class="material-symbols-outlined" width="20" height="20" viewBox="0 -960 960 960" fill="currentColor"><path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z"/></svg>
        </button>
    </header>

    <!-- View: Home (Daily Attendance) -->
    <div id="view-home" class="view-section active">
        
        <!-- New Animated Top Bar for Summary & Search -->
        <div class="home-top-bar">
            <div class="inline-summary" id="inlineSummary">
                <div class="inline-sum-block"><div class="inline-sum-label">P:</div><div id="sum-p" class="inline-sum-val" style="color: var(--success-color);">0</div></div>
                <div class="inline-sum-block"><div class="inline-sum-label">H:</div><div id="sum-h" class="inline-sum-val" style="color: var(--warning-color);">0</div></div>
                <div class="inline-sum-block"><div class="inline-sum-label">A:</div><div id="sum-a" class="inline-sum-val" style="color: var(--meena-red);">0</div></div>
            </div>
            <input type="text" id="searchHome" class="animated-search-bar" placeholder="Search employee...">
            <button class="search-icon-btn" id="toggleSearchBtn" onclick="app.toggleSearch()">
                <svg class="material-symbols-outlined" id="searchIconSvg" width="24" height="24" viewBox="0 -960 960 960" fill="currentColor">
                    <path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/>
                </svg>
            </button>
        </div>

        <div id="homeList"></div>
        <button id="loadMoreHome" class="load-more hidden" onclick="app.loadEmployees('home')">Load More Employees</button>
    </div>

    <!-- Floating Pill Date Picker (Moved outside the view to prevent CSS Transform jumping) -->
    <div class="fab-date hidden" id="fabDateBtn">
        <svg class="material-symbols-outlined" width="20" height="20" viewBox="0 -960 960 960" fill="currentColor"><path d="M200-80q-33 0-56.5-23.5T120-160v-560q0-33 23.5-56.5T200-800h40v-80h80v80h320v-80h80v80h40q33 0 56.5 23.5T840-720v560q0 33-23.5 56.5T760-80H200Zm0-80h560v-400H200v400Zm0-480h560v-80H200v80Zm0 0v-80 80Zm280 240q-17 0-28.5-11.5T440-440q0-17 11.5-28.5T480-480q17 0 28.5 11.5T520-440q0 17-11.5 28.5T480-400Zm-160 0q-17 0-28.5-11.5T280-440q0-17 11.5-28.5T320-480q17 0 28.5 11.5T360-440q0 17-11.5 28.5T320-400Zm320 0q-17 0-28.5-11.5T600-440q0-17 11.5-28.5T640-480q17 0 28.5 11.5T680-440q0 17-11.5 28.5T640-400Z"/></svg>
        <span id="fabDateText">Today</span>
        <input type="date" id="homeDatePicker" onchange="app.changeHomeDate(this.value)">
    </div>

    <!-- View: Employees Management -->
    <div id="view-employees" class="view-section">
        <input type="text" id="searchEmp" class="search-bar" placeholder="Search to edit/delete...">
        <div id="empList"></div>
        <button id="loadMoreEmp" class="load-more hidden" onclick="app.loadEmployees('manage')">Load More Employees</button>
    </div>

    <!-- View: Reports -->
    <div id="view-report" class="view-section">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
            <input type="month" id="reportMonth" class="search-bar" style="width: auto; margin-bottom: 0;">
            <button class="action-btn" onclick="app.openAdvReportModal()" title="Advanced Image Report">
                <svg class="material-symbols-outlined" width="24" height="24" viewBox="0 -960 960 960" fill="currentColor"><path d="M260-160q-91 0-155.5-63T40-377q0-78 47-139t123-78q25-92 100-149t170-57q117 0 198.5 81.5T760-520q69 8 114.5 59.5T920-340q0 75-52.5 127.5T740-160H260Zm220-160 160-160-56-56-64 64v-168h-80v168l-64-64-56 56 160 160Z"/></svg>
            </button>
        </div>
        <div class="table-container">
            <table id="reportTable">
                <thead><tr id="reportHead"></tr></thead>
                <tbody id="reportBody"></tbody>
            </table>
        </div>
    </div>

    <!-- View: Admin Lock -->
    <div id="view-admin-lock" class="view-section">
        <h2 class="text-center" style="margin-top: 50px;">Enter Admin PIN</h2>
        <div class="pin-dots">
            <div class="pin-dot" id="dot1"></div>
            <div class="pin-dot" id="dot2"></div>
            <div class="pin-dot" id="dot3"></div>
            <div class="pin-dot" id="dot4"></div>
        </div>
        <div class="numpad">
            <div class="num-btn" onclick="app.pin('1')">1</div>
            <div class="num-btn" onclick="app.pin('2')">2</div>
            <div class="num-btn" onclick="app.pin('3')">3</div>
            <div class="num-btn" onclick="app.pin('4')">4</div>
            <div class="num-btn" onclick="app.pin('5')">5</div>
            <div class="num-btn" onclick="app.pin('6')">6</div>
            <div class="num-btn" onclick="app.pin('7')">7</div>
            <div class="num-btn" onclick="app.pin('8')">8</div>
            <div class="num-btn" onclick="app.pin('9')">9</div>
            <div></div>
            <div class="num-btn" onclick="app.pin('0')">0</div>
            <div class="num-btn" onclick="app.pin('back')" style="background: rgba(239, 68, 68, 0.1); color: var(--meena-red);">
                <svg class="material-symbols-outlined" width="24" height="24" viewBox="0 -960 960 960" fill="currentColor"><path d="M360-200q-20 0-37.5-9T294-234L120-480l174-246q11-16 28.5-25t37.5-9h400q33 0 56.5 23.5T840-680v400q0 33-23.5 56.5T760-200H360Zm400-80v-400H360L218-480l142 200h400Zm-96-40L536-448l-128 128-56-56 128-128-128-128 56-56 128 128 128-128 56 56-128 128 128 128-56 56ZM360-280v-400 400Z"/></svg>
            </div>
        </div>
    </div>

    <!-- View: Admin Dashboard -->
    <div id="view-admin" class="view-section">
        <div class="emp-card text-center" style="margin-top: 20px;">
            <svg class="material-symbols-outlined" style="font-size: 48px; color: var(--text-secondary); margin: 0 auto;" viewBox="0 -960 960 960" fill="currentColor"><path d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-520H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-640v520-520Z"/></svg>
            <h2 style="margin: 10px 0;">Garbage Collection</h2>
            <p id="garbageText" style="color: var(--text-secondary); font-size: 0.9em;">Calculating old documents...</p>
            <button id="btnGarbage" class="modal-btn btn-danger hidden" onclick="app.clearGarbage()" style="margin-top: 20px;">Delete Old Records</button>
        </div>
    </div>

    <!-- Modal: Confirmation -->
    <div id="modal-confirm" class="overlay">
        <div class="modal-card">
            <h3 id="confirmTitle">Confirm</h3>
            <p id="confirmMsg" style="color: var(--text-secondary); font-size: 0.9em; margin-bottom: 20px;">Are you sure?</p>
            <div class="modal-actions">
                <button class="modal-btn btn-cancel" onclick="history.back()">Cancel</button>
                <button class="modal-btn btn-danger" id="confirmActionBtn">Confirm</button>
            </div>
        </div>
    </div>
    
    <!-- Modal: Custom Alert (Replaces browser popup) -->
    <div id="modal-alert" class="overlay">
        <div class="modal-card">
            <h3 id="alertTitle">Notice</h3>
            <p id="alertMsg" style="color: var(--text-secondary); font-size: 0.9em; margin-bottom: 20px;"></p>
            <div class="modal-actions">
                <button class="modal-btn btn-confirm" onclick="history.back()">OK</button>
            </div>
        </div>
    </div>

    <!-- Modal: Add/Edit Employee -->
    <div id="modal-employee" class="overlay">
        <div class="modal-card">
            <h3 id="empFormTitle">New Employee</h3>
            <input type="hidden" id="empId">
            <input type="text" id="empName" placeholder="Full Name" required>
            <input type="text" id="empRole" placeholder="Role (e.g., Sales)" required>
            <!-- Changed placeholder to reflect Monthly Salary context -->
            <input type="number" id="empWage" placeholder="Monthly Salary (₹)" required>
            <div class="modal-actions">
                <button class="modal-btn btn-cancel" onclick="history.back()">Cancel</button>
                <button class="modal-btn btn-confirm" id="saveEmpBtn" onclick="app.saveEmployee()">Save</button>
            </div>
        </div>
    </div>

    <!-- Modal: Advanced Report (Image & CSV Export) -->
    <div id="modal-adv-report" class="overlay">
        <div class="modal-card" style="max-width: 500px; max-height: 85vh; display: flex; flex-direction: column; padding: 20px;">
            <h3 style="margin-bottom: 20px;">Advanced Export</h3>
            
            <div style="display:flex; gap: 10px; margin-bottom: 15px; text-align: left;">
                <div style="flex:1;">
                    <label style="font-size:0.8em; color:var(--text-secondary); font-weight: 600;">From Date</label>
                    <input type="date" id="advFrom" style="width:100%; margin-top: 5px;">
                </div>
                <div style="flex:1;">
                    <label style="font-size:0.8em; color:var(--text-secondary); font-weight: 600;">To Date</label>
                    <input type="date" id="advTo" style="width:100%; margin-top: 5px;">
                </div>
            </div>
            
            <div style="display:flex; gap: 10px; margin-bottom: 15px;">
                <button class="modal-btn btn-confirm" onclick="app.downloadAdvReport(event, 'ALL', null, null, null, 'img')" style="flex: 1; padding: 14px;">Image Report</button>
                <button class="modal-btn" onclick="app.downloadAdvReport(event, 'ALL', null, null, null, 'csv')" style="flex: 1; padding: 14px; background: #0ea5e9; color: white; border: none;">CSV Data</button>
            </div>
            
            <hr style="border: none; border-top: 1px solid rgba(255,255,255,0.05); width: 100%; margin-bottom: 15px;">
            
            <input type="text" id="searchAdv" class="search-bar" placeholder="Search specific employee..." style="margin-bottom: 15px;">
            
            <div id="advList" style="flex: 1; overflow-y: auto; text-align: left;"></div>
            <button id="loadMoreAdv" class="load-more hidden" onclick="app.loadEmployees('adv')">Load More</button>
            
            <div class="modal-actions" style="margin-top: 15px;">
                <button class="modal-btn btn-cancel" onclick="history.back()">Close</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs & External Config -->
    <script type="module">
        // Import your existing configured database directly from your config file
        import { db } from './config.js';
        
        // Import the required Firestore functions
        import { collection, doc, setDoc, getDoc, updateDoc, addDoc, query, where, orderBy, limit, startAfter, getDocs, deleteDoc, writeBatch, FieldPath } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

        const app = {
            view: 'home',
            cursors: { home: null, manage: null, adv: null },
            searchTimers: { home: null, manage: null, adv: null },
            currentPin: '',
            garbageDocs: [],
            selectedDate: null, // Tracks currently selected home page date
            
            // Central RAM Cache (Eliminates excessive DB Reads for edits/attendance/UI updates)
            ramCache: {
                monthDoc: null,
                monthStr: ''
            },

            // --- Robust Time Utilities (Strict IST) ---
            getISTDateString() {
                const formatter = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata', year: 'numeric', month: '2-digit', day: '2-digit' });
                return formatter.format(new Date()); 
            },
            getISTMonthString() {
                const dateStr = this.getISTDateString();
                return dateStr.substring(0, 7); 
            },

            // --- Dynamic Daily Wage Calculator (Exact Paisa, No Rounding) ---
            getDailyWage(monthlySalary, monthStr) {
                const [y, m] = monthStr.split('-').map(Number);
                const daysInMonth = new Date(y, m, 0).getDate();
                return monthlySalary / daysInMonth; 
            },

            // --- Floating Date Picker Handler ---
            changeHomeDate(dateStr) {
                if (!dateStr) dateStr = this.getISTDateString();
                this.selectedDate = dateStr;
                
                const picker = document.getElementById('homeDatePicker');
                const text = document.getElementById('fabDateText');
                if (picker) picker.value = dateStr;
                
                if (dateStr === this.getISTDateString()) {
                    text.innerText = "Today";
                } else {
                    const d = new Date(dateStr);
                    text.innerText = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
                }
                
                // Clear the cache trigger if they selected a date from a different month
                const selectedMonth = dateStr.substring(0, 7);
                if (this.ramCache.monthStr !== selectedMonth) {
                    this.ramCache.monthDoc = null; 
                }
                
                if(navigator.vibrate) navigator.vibrate(15);
                
                // Reload home view with new selected date
                if(this.view === 'home') {
                    this.loadEmployees('home', true);
                }
            },

            // --- Top Bar Animated UI Actions ---
            toggleSearch() {
                const searchBar = document.getElementById('searchHome');
                const summary = document.getElementById('inlineSummary');
                const btnSvg = document.getElementById('searchIconSvg');
                
                if(navigator.vibrate) navigator.vibrate(15);

                if (searchBar.classList.contains('active')) {
                    searchBar.classList.remove('active');
                    summary.classList.remove('dispersed');
                    searchBar.value = '';
                    clearTimeout(app.searchTimers.home);
                    app.loadEmployees('home', true, '');
                    btnSvg.innerHTML = '<path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/>';
                } else {
                    searchBar.classList.add('active');
                    summary.classList.add('dispersed');
                    searchBar.focus();
                    btnSvg.innerHTML = '<path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/>';
                }
            },
            
            // --- Daily Summary Update Function ---
            updateDailySummary() {
                if (!app.ramCache.monthDoc) return;
                const targetDate = this.selectedDate || this.getISTDateString();
                let p = 0, h = 0, a = 0;
                
                Object.values(app.ramCache.monthDoc).forEach(empRec => {
                    if (empRec[targetDate] === 'present') p++;
                    if (empRec[targetDate] === 'half') h++;
                    if (empRec[targetDate] === 'absent') a++;
                });
                
                const pEl = document.getElementById('sum-p');
                const hEl = document.getElementById('sum-h');
                const aEl = document.getElementById('sum-a');
                
                if (pEl) pEl.innerText = p;
                if (hEl) hEl.innerText = h;
                if (aEl) aEl.innerText = a;
            },

            // --- Advanced Report Utilities ---
            getMonthsBetween(fromStr, toStr) {
                const result = [];
                const [y1, m1] = fromStr.split('-').map(Number);
                const [y2, m2] = toStr.split('-').map(Number);
                let curY = y1, curM = m1;
                while(curY < y2 || (curY === y2 && curM <= m2)) {
                    result.push(`${curY}-${String(curM).padStart(2, '0')}`);
                    curM++;
                    if(curM > 12) { curM = 1; curY++; }
                }
                return result;
            },
            getDatesBetween(fromStr, toStr) {
                const result = [];
                let current = new Date(fromStr);
                const end = new Date(toStr);
                while(current <= end) {
                    const y = current.getFullYear();
                    const m = String(current.getMonth() + 1).padStart(2, '0');
                    const d = String(current.getDate()).padStart(2, '0');
                    result.push(`${y}-${m}-${d}`);
                    current.setDate(current.getDate() + 1);
                }
                return result;
            },

            // --- Routing & Modals ---
            navigate(viewId, push = true) {
                if(navigator.vibrate) navigator.vibrate(15);
                
                document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
                
                document.getElementById('backBtn').classList.remove('hidden'); 
                document.getElementById('btnAdmin').classList.add('hidden');
                document.getElementById('btnReport').classList.add('hidden');
                document.getElementById('btnEmployees').classList.add('hidden');
                document.getElementById('btnAddEmp').classList.add('hidden');
                document.getElementById('fabDateBtn').classList.add('hidden'); // Hide FAB initially on navigation

                if (viewId === 'home') {
                    document.getElementById('view-home').classList.add('active');
                    document.getElementById('headerTitle').innerText = 'Attendance';
                    document.getElementById('btnAdmin').classList.remove('hidden');
                    document.getElementById('btnReport').classList.remove('hidden');
                    document.getElementById('btnEmployees').classList.remove('hidden');
                    document.getElementById('fabDateBtn').classList.remove('hidden'); // Show FAB only on Home
                    if(this.cursors.home === null) this.loadEmployees('home', true);
                } else if (viewId === 'employees') {
                    document.getElementById('view-employees').classList.add('active');
                    document.getElementById('headerTitle').innerText = 'Manage Staff';
                    document.getElementById('btnAddEmp').classList.remove('hidden');
                    if(this.cursors.manage === null) this.loadEmployees('manage', true);
                } else if (viewId === 'report') {
                    document.getElementById('view-report').classList.add('active');
                    document.getElementById('headerTitle').innerText = 'Reports';
                    this.loadReport();
                } else if (viewId === 'admin-lock') {
                    document.getElementById('view-admin-lock').classList.add('active');
                    document.getElementById('headerTitle').innerText = 'Admin Access';
                    this.currentPin = '';
                    this.updatePinUI();
                } else if (viewId === 'admin') {
                    document.getElementById('view-admin').classList.add('active');
                    document.getElementById('headerTitle').innerText = 'Admin Dashboard';
                    this.checkGarbage();
                }

                if (push) history.pushState({ view: viewId }, '', `#${viewId}`);
                this.view = viewId;
            },

            goBack() {
                if(navigator.vibrate) navigator.vibrate(15);
                
                if (document.querySelectorAll('.overlay.active').length > 0) {
                    history.back();
                    return;
                }
                if (this.view === 'home') {
                    window.history.go(-1);
                } else {
                    history.back(); 
                }
            },

            openModal(modalId) {
                if(navigator.vibrate) navigator.vibrate(15);
                history.pushState({ modal: modalId }, '', `#${modalId}`);
                document.getElementById(modalId).classList.add('active');
            },
            closeModals() {
                document.querySelectorAll('.overlay').forEach(m => m.classList.remove('active'));
            },

            confirm(title, msg, onConfirm) {
                document.getElementById('confirmTitle').innerText = title;
                document.getElementById('confirmMsg').innerText = msg;
                const btn = document.getElementById('confirmActionBtn');
                btn.onclick = () => { 
                    if(navigator.vibrate) navigator.vibrate(20);
                    onConfirm(); 
                    history.back(); 
                };
                this.openModal('modal-confirm');
            },
            
            showAlert(title, msg) {
                document.getElementById('alertTitle').innerText = title;
                document.getElementById('alertMsg').innerText = msg;
                this.openModal('modal-alert');
            },
            
            openAdvReportModal() {
                const todayStr = this.getISTDateString();
                document.getElementById('advTo').value = todayStr;
                document.getElementById('advFrom').value = todayStr.substring(0, 8) + '01'; // Default: 1st of month
                
                this.loadEmployees('adv', true);
                this.openModal('modal-adv-report');
            },

            // --- Employee Management ---
            async loadEmployees(context, reset = false, searchTerm = "") {
                const listIds = { home: 'homeList', manage: 'empList', adv: 'advList' };
                const btnIds = { home: 'loadMoreHome', manage: 'loadMoreEmp', adv: 'loadMoreAdv' };
                const searchInputIds = { home: 'searchHome', manage: 'searchEmp', adv: 'searchAdv' };
                
                const listEl = document.getElementById(listIds[context]);
                const loadBtn = document.getElementById(btnIds[context]);
                
                if (reset) { 
                    const skeletonHTML = `
                        <div class="emp-card">
                            <div class="card-header">
                                <div style="width: 60%;"><div class="skeleton" style="height: 22px; width: 80%; margin-bottom: 8px;"></div><div class="skeleton" style="height: 16px; width: 50%; border-radius: 8px;"></div></div>
                                <div class="skeleton" style="height: 26px; width: 60px; border-radius: 10px;"></div>
                            </div>
                            <div class="att-btn-group">
                                <div class="skeleton att-btn" style="height: 40px; border: none;"></div>
                                <div class="skeleton att-btn" style="height: 40px; border: none;"></div>
                                <div class="skeleton att-btn" style="height: 40px; border: none;"></div>
                            </div>
                        </div>
                    `.repeat(3);
                    listEl.innerHTML = skeletonHTML; 
                    this.cursors[context] = null; 
                    loadBtn.classList.add('hidden');
                }

                // FIX: Fallback to the active search value from DOM if pagination trigger occurs
                const activeSearch = (searchTerm !== undefined && searchTerm !== null && searchTerm !== "") 
                    ? searchTerm 
                    : (document.getElementById(searchInputIds[context])?.value.trim() || "");

                let qArgs = [collection(db, "employees"), orderBy("nameLower"), limit(10)];
                
                if (activeSearch.length > 0) {
                    const searchLower = activeSearch.toLowerCase();
                    const end = searchLower.replace(/.$/, c => String.fromCharCode(c.charCodeAt(0) + 1));
                    qArgs = [collection(db, "employees"), where("nameLower", ">=", searchLower), where("nameLower", "<", end), orderBy("nameLower"), limit(10)];
                } 
                
                // Keep Pagination Intact specifically when Load More is clicked
                if (!reset && this.cursors[context]) {
                    qArgs.push(startAfter(this.cursors[context]));
                }

                try {
                    const snap = await getDocs(query(...qArgs));
                    
                    if (reset && context !== 'home') listEl.innerHTML = '';
                    
                    if (snap.empty && reset) {
                        listEl.innerHTML = '<div class="loading-text">No employees found.</div>';
                        return;
                    }
                    if (snap.empty && !reset) return; 
                    
                    if (snap.docs.length > 0) this.cursors[context] = snap.docs[snap.docs.length - 1];

                    if (snap.docs.length === 10) {
                        loadBtn.classList.remove('hidden');
                    } else {
                        loadBtn.classList.add('hidden');
                    }

                    // Network call for current month attendance efficiently cached
                    let currentAtt = {};
                    const targetDate = this.selectedDate || this.getISTDateString();
                    
                    if (context === 'home') {
                        const selectedMonth = targetDate.substring(0, 7);
                        if (!app.ramCache.monthDoc || app.ramCache.monthStr !== selectedMonth) {
                            const monthDoc = await getDoc(doc(db, 'attendance', selectedMonth));
                            app.ramCache.monthDoc = monthDoc.exists() ? monthDoc.data().records || {} : {};
                            app.ramCache.monthStr = selectedMonth;
                        }
                        currentAtt = app.ramCache.monthDoc;
                        
                        if (reset) listEl.innerHTML = '';
                        this.updateDailySummary();
                    }

                    snap.docs.forEach(d => {
                        const data = d.data();
                        const id = d.id;
                        
                        // Prevent Apostrophe bug from breaking JS
                        const safeName = data.name.replace(/'/g, "\\'");
                        const safeRole = data.role.replace(/'/g, "\\'");
                        
                        let html = '';

                        if (context === 'home') {
                            const monthStr = targetDate.substring(0, 7);
                            const dailyWage = app.getDailyWage(data.wage, monthStr);
                            const displayWage = parseFloat(dailyWage.toFixed(2)); // Display cleaner but keep precision background
                            const status = currentAtt[id] ? currentAtt[id][targetDate] : null;
                            html = `
                                <div class="emp-card" id="card-home-${id}">
                                    <div class="card-header">
                                        <div><div class="emp-name emp-name-${id}">${data.name}</div><div class="emp-role emp-role-${id}">${data.role}</div></div>
                                        <div class="emp-wage emp-wage-${id}">₹${displayWage}/d</div>
                                    </div>
                                    <div class="att-btn-group att-btn-group-${id}">
                                        <button class="att-btn present ${status==='present'?'active':''}" onclick="app.mark('${id}', 'present', ${data.wage})">Present</button>
                                        <button class="att-btn half ${status==='half'?'active':''}" onclick="app.mark('${id}', 'half', ${data.wage})">Half Day</button>
                                        <button class="att-btn absent ${status==='absent'?'active':''}" onclick="app.mark('${id}', 'absent', ${data.wage})">Absent</button>
                                    </div>
                                </div>
                            `;
                        } else if (context === 'manage') {
                            html = `
                                <div class="emp-card" id="card-manage-${id}">
                                    <div class="card-header">
                                        <div><div class="emp-name emp-name-${id}">${data.name}</div><div class="emp-role emp-role-${id}">${data.role}</div></div>
                                        <div class="emp-wage emp-wage-${id}">₹${data.wage.toLocaleString()}/mo</div>
                                    </div>
                                    <div class="att-btn-group">
                                        <button class="att-btn" style="color:var(--text-color)" onclick="app.editEmp('${id}', '${safeName}', '${safeRole}', ${data.wage})">Edit</button>
                                        <button class="att-btn absent" onclick="app.delEmp('${id}')">Delete</button>
                                    </div>
                                </div>
                            `;
                        } else if (context === 'adv') {
                            html = `
                                <div class="emp-card" id="card-adv-${id}" style="padding: 15px;">
                                    <div class="card-header">
                                        <div><div class="emp-name emp-name-${id}" style="font-size:1em;">${data.name}</div><div class="emp-role emp-role-${id}" style="font-size:0.7em;">${data.role}</div></div>
                                        <div class="emp-wage emp-wage-${id}" style="font-size:0.8em;">₹${data.wage.toLocaleString()}/mo</div>
                                    </div>
                                    <div style="display:flex; gap:10px; margin-top: 10px;">
                                        <button class="modal-btn btn-confirm" style="padding: 8px; flex:1;" onclick="app.downloadAdvReport(event, '${id}', '${safeName}', ${data.wage}, '${safeRole}', 'img')">Image</button>
                                        <button class="modal-btn" style="padding: 8px; flex:1; background: #0ea5e9; color: white; border: none;" onclick="app.downloadAdvReport(event, '${id}', '${safeName}', ${data.wage}, '${safeRole}', 'csv')">CSV</button>
                                    </div>
                                </div>
                            `;
                        }
                        listEl.insertAdjacentHTML('beforeend', html);
                    });

                } catch(e) { 
                    console.error("Error loading:", e); 
                    if(reset) listEl.innerHTML = '<div class="loading-text" style="color:var(--meena-red);">Connection Error. Please Check your Firebase Config and Security Rules.</div>';
                }
            },

            // --- Realtime Attendance Writes ---
            async mark(empId, status, wage) {
                // Instantly update DOM correctly using class targeting
                const btns = document.querySelectorAll(`.att-btn-group-${empId} .att-btn`);
                btns.forEach(b => b.classList.remove('active'));
                document.querySelector(`.att-btn-group-${empId} .att-btn.${status}`).classList.add('active');
                
                // Detailed Haptic Feedback distinct per status
                if(navigator.vibrate) {
                    if(status === 'present') {
                        navigator.vibrate(30);
                    } else if (status === 'half') {
                        navigator.vibrate([40, 40, 40]);
                    } else if (status === 'absent') {
                        navigator.vibrate([80, 50, 80]);
                    }
                }

                const targetDate = this.selectedDate || this.getISTDateString();
                const month = targetDate.substring(0, 7);
                const docRef = doc(db, 'attendance', month);
                
                // Keep RAM cache fully updated instantly
                if (!app.ramCache.monthDoc) app.ramCache.monthDoc = {};
                if (!app.ramCache.monthDoc[empId]) app.ramCache.monthDoc[empId] = {};
                app.ramCache.monthDoc[empId][targetDate] = status;
                this.updateDailySummary();

                try {
                    await updateDoc(docRef, { [`records.${empId}.${targetDate}`]: status });
                } catch(e) {
                    if (e.code === 'not-found') {
                        await setDoc(docRef, { records: { [empId]: { [targetDate]: status } } });
                    } else {
                        app.showAlert("Security Error", "Database write blocked. Check your Firestore Security Rules.");
                    }
                }
            },

            // --- Employee Form Actions ---
            openEmpForm() {
                document.getElementById('empId').value = '';
                document.getElementById('empName').value = '';
                document.getElementById('empRole').value = '';
                document.getElementById('empWage').value = '';
                document.getElementById('empFormTitle').innerText = 'New Employee';
                this.openModal('modal-employee');
            },
            editEmp(id, name, role, wage) {
                document.getElementById('empId').value = id;
                document.getElementById('empName').value = name;
                document.getElementById('empRole').value = role;
                document.getElementById('empWage').value = wage;
                document.getElementById('empFormTitle').innerText = 'Edit Employee';
                this.openModal('modal-employee');
            },
            async saveEmployee() {
                const id = document.getElementById('empId').value;
                const name = document.getElementById('empName').value.trim();
                const role = document.getElementById('empRole').value.trim();
                const wage = Number(document.getElementById('empWage').value);
                
                if (!name || !role || !wage) {
                    app.showAlert("Missing Data", "Please fill out all fields.");
                    return;
                }
                
                if(navigator.vibrate) navigator.vibrate(20);

                const saveBtn = document.getElementById('saveEmpBtn');
                const originalText = saveBtn.innerText;
                saveBtn.innerText = "Saving...";
                saveBtn.disabled = true;

                const data = { name, role, wage, nameLower: name.toLowerCase() };
                
                // Prevent Apostrophe bug from breaking inline JS
                const safeName = name.replace(/'/g, "\\'");
                const safeRole = role.replace(/'/g, "\\'");
                
                try {
                    if (id) {
                        await updateDoc(doc(db, "employees", id), data);
                        // Instant DOM Update via RAM without doing network reload
                        document.querySelectorAll(`.emp-name-${id}`).forEach(el => el.innerText = name);
                        document.querySelectorAll(`.emp-role-${id}`).forEach(el => el.innerText = role);
                        
                        // Dynamically update the specific wage display based on the context
                        const targetDate = this.selectedDate || this.getISTDateString();
                        const daily = app.getDailyWage(wage, targetDate.substring(0, 7));
                        const displayWage = parseFloat(daily.toFixed(2));
                        
                        const homeWageEl = document.querySelector(`#card-home-${id} .emp-wage`);
                        if (homeWageEl) homeWageEl.innerText = '₹' + displayWage + '/d';
                        
                        const manageWageEl = document.querySelector(`#card-manage-${id} .emp-wage`);
                        if (manageWageEl) manageWageEl.innerText = '₹' + wage.toLocaleString() + '/mo';
                        
                        const advWageEl = document.querySelector(`#card-adv-${id} .emp-wage`);
                        if (advWageEl) advWageEl.innerText = '₹' + wage.toLocaleString() + '/mo';

                        // IMPORTANT FIX: Update the code inside the edit button so it uses fresh data next time
                        const editBtn = document.querySelector(`#card-manage-${id} .att-btn:first-child`);
                        if (editBtn) editBtn.setAttribute('onclick', `app.editEmp('${id}', '${safeName}', '${safeRole}', ${wage})`);
                        
                        const imgBtn = document.querySelector(`#card-adv-${id} .btn-confirm`);
                        const csvBtn = document.querySelector(`#card-adv-${id} .modal-btn:not(.btn-confirm)`);
                        if(imgBtn) imgBtn.setAttribute('onclick', `app.downloadAdvReport(event, '${id}', '${safeName}', ${wage}, '${safeRole}', 'img')`);
                        if(csvBtn) csvBtn.setAttribute('onclick', `app.downloadAdvReport(event, '${id}', '${safeName}', ${wage}, '${safeRole}', 'csv')`);

                    } else {
                        data.createdAt = new Date();
                        await addDoc(collection(db, "employees"), data);
                        // Force network reload only on newly added staff to preserve sorting
                        this.cursors.manage = null; 
                        setTimeout(() => { this.loadEmployees('manage', true); }, 200);
                    }
                    
                    if(history.state && history.state.modal) history.back();
                    else this.closeModals();

                } catch(e) { 
                    console.error("Save error:", e); 
                    app.showAlert("Permission Denied", "Error saving data. Make sure your Firestore Security Rules are set to True.");
                } finally {
                    saveBtn.innerText = originalText;
                    saveBtn.disabled = false;
                }
            },
            delEmp(id) {
                this.confirm("Delete Employee", "This removes them from the active roster.", async () => {
                    await deleteDoc(doc(db, "employees", id));
                    // Instant DOM Update removing UI cards without network reloads
                    document.querySelectorAll(`#card-home-${id}, #card-manage-${id}, #card-adv-${id}`).forEach(el => el.remove());
                });
            },

            // --- Report Logic ---
            async loadReport() {
                const input = document.getElementById('reportMonth');
                if(!input.value) input.value = this.getISTMonthString();
                const targetMonth = input.value;
                
                const thead = document.getElementById('reportHead');
                const tbody = document.getElementById('reportBody');
                thead.innerHTML = '<th class="sticky-col">Employee</th>';
                
                tbody.innerHTML = `<tr><td colspan="35"><div class="skeleton" style="height: 30px; width: 100%;"></div></td></tr><tr><td colspan="35"><div class="skeleton" style="height: 30px; width: 100%;"></div></td></tr>`;

                const [yyyy, mm] = targetMonth.split('-');
                // Dynamic days calculation based on specific month and year
                const daysInMonth = new Date(yyyy, mm, 0).getDate();
                
                for(let i=1; i<=daysInMonth; i++) {
                    thead.innerHTML += `<th>${i}</th>`;
                }
                thead.innerHTML += '<th>Present</th><th>Half</th><th>Absent</th><th>Total Wage</th>';

                try {
                    const empSnap = await getDocs(query(collection(db, "employees"), orderBy("nameLower")));
                    const attSnap = await getDoc(doc(db, 'attendance', targetMonth));
                    const records = attSnap.exists() ? (attSnap.data().records || {}) : {};

                    tbody.innerHTML = '';
                    if(empSnap.empty) {
                        tbody.innerHTML = `<tr><td colspan="${daysInMonth + 4}" class="loading-text">No employees found.</td></tr>`;
                        return;
                    }

                    empSnap.forEach(eDoc => {
                        const emp = eDoc.data();
                        const empId = eDoc.id;
                        const empRec = records[empId] || {};
                        const dailyWage = app.getDailyWage(emp.wage, targetMonth);
                        
                        let row = `<tr><td class="sticky-col"><div><b>${emp.name}</b></div><div style="font-size:0.8em;color:var(--text-secondary)">₹${emp.wage.toLocaleString('en-IN')}</div></td>`;
                        
                        let p = 0, h = 0, a = 0;
                        for(let i=1; i<=daysInMonth; i++) {
                            const dateStr = `${targetMonth}-${String(i).padStart(2, '0')}`;
                            const status = empRec[dateStr];
                            if(status === 'present') { p++; row += `<td><span class="dot P"></span></td>`; }
                            else if(status === 'half') { h++; row += `<td><span class="dot H"></span></td>`; }
                            else if(status === 'absent') { a++; row += `<td><span class="dot A"></span></td>`; }
                            else { row += `<td>-</td>`; }
                        }

                        // Exact decimal math preserving paisa
                        const total = (p * dailyWage) + (h * (dailyWage / 2));
                        
                        row += `
                            <td>${p}</td><td>${h}</td><td>${a}</td>
                            <td class="total-wage">₹${total.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                        </tr>`;
                        tbody.insertAdjacentHTML('beforeend', row);
                    });
                } catch(e) { 
                    console.error(e); 
                    tbody.innerHTML = `<tr><td colspan="35" class="loading-text" style="color:var(--meena-red);">Error loading report. Check database rules.</td></tr>`;
                }
            },
            
            async downloadAdvReport(event, empId, empName = null, empWage = null, empRole = null, format = 'img') {
                const btn = event.target;
                const originalText = btn.innerText;
                btn.innerText = format === 'csv' ? "Generating CSV..." : "Generating Image...";
                btn.disabled = true;

                try {
                    const fromStr = document.getElementById('advFrom').value;
                    const toStr = document.getElementById('advTo').value;
                    
                    if (!fromStr || !toStr) {
                        app.showAlert("Missing Dates", "Please select both dates.");
                        return;
                    }
                    
                    // Date Time-Travel Validation
                    const fromD = new Date(fromStr);
                    const toD = new Date(toStr);
                    if (fromD > toD) {
                        app.showAlert("Invalid Range", "The 'From' date cannot be after the 'To' date.");
                        return;
                    }

                    const monthsToFetch = this.getMonthsBetween(fromStr, toStr);
                    const attData = {};
                    
                    // High-speed parallel promise fetching
                    const fetchPromises = monthsToFetch.map(m => getDoc(doc(db, 'attendance', m)));
                    const snaps = await Promise.all(fetchPromises);
                    
                    snaps.forEach((snap, index) => {
                        if(snap.exists()) {
                            attData[monthsToFetch[index]] = snap.data().records || {};
                        }
                    });

                    let employees = [];
                    if (empId === 'ALL') {
                        const snap = await getDocs(query(collection(db, "employees"), orderBy("nameLower")));
                        snap.forEach(d => { employees.push({id: d.id, ...d.data()}); });
                    } else {
                        employees.push({ id: empId, name: empName, wage: empWage, role: empRole });
                    }

                    const exactDates = this.getDatesBetween(fromStr, toStr);
                    const totalDaysInRange = exactDates.length; // Strict "Days Between" math model
                    
                    const reportRows = employees.map(emp => {
                        let p = 0, h = 0, a = 0;
                        let totalWage = 0; // Floating point precision math
                        const customDailyWage = emp.wage / totalDaysInRange; // Custom base salary cap math
                        
                        exactDates.forEach(date => {
                            const month = date.substring(0, 7);
                            const status = attData[month]?.[emp.id]?.[date];
                            
                            if(status === 'present') { 
                                p++; 
                                totalWage += customDailyWage; 
                            } else if(status === 'half') { 
                                h++; 
                                totalWage += (customDailyWage / 2); 
                            } else if(status === 'absent') { 
                                a++; 
                            }
                        });
                        return { ...emp, p, h, a, totalWage };
                    });

                    // --- Handle CSV Export ---
                    if (format === 'csv') {
                        let csvContent = "\uFEFF"; // BOM for excel utf8
                        if (empId === 'ALL') {
                            csvContent += "Employee Name,Role,Monthly Base Salary,Present,Half-Day,Absent,Total Salary Earned," + exactDates.join(",") + "\n";
                            reportRows.forEach(r => {
                                let rowData = `"${r.name}","${r.role}",${r.wage},${r.p},${r.h},${r.a},${r.totalWage.toFixed(2)}`;
                                exactDates.forEach(date => {
                                    const month = date.substring(0, 7);
                                    const status = attData[month]?.[r.id]?.[date] || '-';
                                    rowData += `,${status}`;
                                });
                                csvContent += rowData + "\n";
                            });
                        } else {
                            csvContent += `Employee: ${empName}, Base Salary: Rs. ${empWage.toLocaleString('en-IN')}/mo\n\n`;
                            csvContent += "Date,Status,Earned\n";
                            const emp = reportRows[0];
                            const customDailyWage = emp.wage / totalDaysInRange; // Match the days between logic
                            exactDates.forEach(date => {
                                const month = date.substring(0, 7);
                                const status = attData[month]?.[emp.id]?.[date] || 'Not Marked';
                                let earned = 0;
                                if(status === 'present') earned = customDailyWage;
                                else if(status === 'half') earned = (customDailyWage / 2);
                                csvContent += `${date},${status},${earned.toFixed(2)}\n`;
                            });
                            csvContent += `\nTotal,,,${emp.totalWage.toFixed(2)}\n`;
                        }
                        
                        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                        const url = URL.createObjectURL(blob);
                        const link = document.createElement('a');
                        link.href = url;
                        link.download = `MeenaGroups_${empId === 'ALL' ? 'Full_Roster' : empName.replace(/ /g, '_')}_${fromStr}_to_${toStr}.csv`;
                        link.click();
                        return; // Done with CSV
                    }

                    // --- Handle Image Export ---
                    const hiddenDiv = document.createElement('div');
                    hiddenDiv.style.position = 'absolute';
                    hiddenDiv.style.left = '-9999px';
                    hiddenDiv.style.top = '0';
                    hiddenDiv.style.width = '800px'; 
                    hiddenDiv.style.height = 'max-content'; // Prevents html2canvas cropping
                    hiddenDiv.style.overflow = 'visible';
                    hiddenDiv.style.zIndex = '-9999';
                    hiddenDiv.style.background = 'linear-gradient(145deg, #18191a, #242526)'; // Meta Dark Theme
                    hiddenDiv.style.color = '#e4e6eb';
                    hiddenDiv.style.fontFamily = 'Inter, sans-serif';
                    hiddenDiv.style.padding = '40px';
                    hiddenDiv.style.borderRadius = '16px';
                    
                    let innerContent = `
                        <div style="text-align:center; margin-bottom: 40px;">
                            <h1 style="color:#0d9488; margin:0; font-size:38px; font-weight:800; letter-spacing:-1px;">Meena Groups</h1>
                            <h2 style="margin:8px 0 0 0; font-size:20px; font-weight:600;">${empId === 'ALL' ? 'Attendance & Payroll Full Roster' : `Attendance Report: ${empName}`}</h2>
                            <p style="color:#94a3b8; font-size:14px; margin-top:8px;">Period: ${fromStr} to ${toStr}</p>
                        </div>
                    `;

                    reportRows.forEach(r => {
                        // Dynamic Font Sizing strictly for large salary output mapped with precise decimals
                        const totStr = r.totalWage.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                        let dynFontSize = '22px';
                        if (totStr.length > 10) dynFontSize = '15px'; // longer length including commas and decimals
                        else if (totStr.length > 7) dynFontSize = '18px';

                        innerContent += `
                            <div style="background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 25px; margin-bottom: 30px;">
                                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.05);">
                                    <div style="text-align:left;">
                                        <h3 style="margin:0; font-size:22px; font-weight:700; color:#ffffff;">${r.name}</h3>
                                        <div style="color:#0d9488; font-size:13px; font-weight:600; margin-top:4px;">${r.role} &nbsp;•&nbsp; ₹${r.wage.toLocaleString('en-IN')}/mo base</div>
                                    </div>
                                    <div style="display:flex; gap: 20px; text-align:center;">
                                        <div><div style="font-size:11px; color:#94a3b8; text-transform:uppercase; font-weight:600;">Present</div><div style="font-size:22px; font-weight:800; color:#10b981;">${r.p}</div></div>
                                        <div><div style="font-size:11px; color:#94a3b8; text-transform:uppercase; font-weight:600;">Half-Day</div><div style="font-size:22px; font-weight:800; color:#f59e0b;">${r.h}</div></div>
                                        <div><div style="font-size:11px; color:#94a3b8; text-transform:uppercase; font-weight:600;">Absent</div><div style="font-size:22px; font-weight:800; color:#ef4444;">${r.a}</div></div>
                                        <div style="padding-left:15px; border-left: 1px solid rgba(255,255,255,0.1);">
                                            <div style="font-size:11px; color:#94a3b8; text-transform:uppercase; font-weight:600;">Total Salary</div>
                                            <div style="font-size:${dynFontSize}; font-weight:800; color:#a855f7; white-space:nowrap;">₹${totStr}</div>
                                        </div>
                                    </div>
                                </div>
                        `;

                        monthsToFetch.forEach(month => {
                            const [y, m] = month.split('-');
                            const dateObj = new Date(parseInt(y), parseInt(m)-1, 1);
                            const monthName = dateObj.toLocaleString('en-US', { month: 'long', year: 'numeric' });
                            const startDay = dateObj.getDay();
                            const daysInMonth = new Date(parseInt(y), parseInt(m), 0).getDate();

                            let grid = `<div style="margin-bottom: 20px;">
                                <h4 style="text-align: left; margin: 0 0 10px 0; color: #e4e6eb; font-weight:600; font-size:15px;">${monthName}</h4>
                                <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center;">
                                    <div style="font-weight: 600; color: #a8b3cf; padding: 4px; font-size:12px;">Sun</div>
                                    <div style="font-weight: 600; color: #a8b3cf; padding: 4px; font-size:12px;">Mon</div>
                                    <div style="font-weight: 600; color: #a8b3cf; padding: 4px; font-size:12px;">Tue</div>
                                    <div style="font-weight: 600; color: #a8b3cf; padding: 4px; font-size:12px;">Wed</div>
                                    <div style="font-weight: 600; color: #a8b3cf; padding: 4px; font-size:12px;">Thu</div>
                                    <div style="font-weight: 600; color: #a8b3cf; padding: 4px; font-size:12px;">Fri</div>
                                    <div style="font-weight: 600; color: #a8b3cf; padding: 4px; font-size:12px;">Sat</div>
                            `;
                            
                            for(let i=0; i<startDay; i++) { grid += `<div></div>`; }
                            
                            for(let d=1; d<=daysInMonth; d++) {
                                const dateStr = `${y}-${m}-${String(d).padStart(2, '0')}`;
                                if(exactDates.includes(dateStr)) {
                                    const status = attData[month]?.[r.id]?.[dateStr];
                                    let bg = '#3a3b3c', col = '#e4e6eb', brd = 'rgba(255,255,255,0.05)';
                                    if(status === 'present') { bg = 'rgba(16, 185, 129, 0.15)'; col = '#10b981'; brd = 'rgba(16, 185, 129, 0.3)'; }
                                    else if(status === 'half') { bg = 'rgba(245, 158, 11, 0.15)'; col = '#f59e0b'; brd = 'rgba(245, 158, 11, 0.3)'; }
                                    else if(status === 'absent') { bg = 'rgba(239, 68, 68, 0.15)'; col = '#ef4444'; brd = 'rgba(239, 68, 68, 0.3)'; }

                                    grid += `<div style="background: ${bg}; color: ${col}; padding: 10px 5px; border-radius: 8px; font-weight: 700; border: 1px solid ${brd}; display:flex; flex-direction:column; justify-content:center; align-items:center;">
                                                <span style="font-size:14px;">${d}</span>
                                            </div>`;
                                } else {
                                    grid += `<div style="color: rgba(255,255,255,0.1); padding: 10px 5px; font-size:14px;">${d}</div>`;
                                }
                            }
                            grid += `</div></div>`;
                            innerContent += grid;
                        });

                        innerContent += `</div>`; // Close employee card
                    });

                    innerContent += `
                        <div style="text-align:right; margin-top:30px; font-size:12px; color:#a8b3cf; font-weight:500;">
                            Generated automatically by Meena Groups Hub • ${app.getISTDateString()}
                        </div>
                    `;

                    hiddenDiv.innerHTML = innerContent;
                    document.body.appendChild(hiddenDiv);

                    // Pause allows browser to completely render the off-screen layout
                    await new Promise(r => setTimeout(r, 600));
                    
                    // Render image natively without cutoffs using scrollHeight
                    const canvas = await html2canvas(hiddenDiv, { 
                        backgroundColor: '#18191a', 
                        scale: 2,
                        windowWidth: hiddenDiv.scrollWidth,
                        windowHeight: hiddenDiv.scrollHeight
                    });
                    const imgData = canvas.toDataURL('image/png');
                    
                    const link = document.createElement('a');
                    link.download = `MeenaGroups_${empId === 'ALL' ? 'Full_Roster' : empName.replace(/ /g, '_')}_${fromStr}_to_${toStr}.png`;
                    link.href = imgData;
                    link.click();

                    document.body.removeChild(hiddenDiv);

                } catch(e) {
                    console.error("Export Error:", e);
                    app.showAlert("Export Failed", "Failed to generate report. Check network connection.");
                } finally {
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            },

            // --- Admin & Garbage Collection ---
            pin(val) {
                if(navigator.vibrate) navigator.vibrate(10);
                if(val === 'back') {
                    this.currentPin = this.currentPin.slice(0, -1);
                } else if(this.currentPin.length < 4) {
                    this.currentPin += val;
                }
                this.updatePinUI();
                
                if(this.currentPin.length === 4) {
                    if(this.currentPin === '2502') {
                        setTimeout(() => this.navigate('admin'), 200);
                    } else {
                        const dots = document.querySelector('.pin-dots');
                        dots.style.transform = 'translateX(10px)';
                        setTimeout(() => dots.style.transform = 'translateX(-10px)', 50);
                        setTimeout(() => dots.style.transform = 'translateX(10px)', 100);
                        setTimeout(() => { dots.style.transform = 'translateX(0)'; this.currentPin = ''; this.updatePinUI(); }, 150);
                        if(navigator.vibrate) navigator.vibrate([50, 50, 50]);
                    }
                }
            },
            updatePinUI() {
                for(let i=1; i<=4; i++) {
                    const dot = document.getElementById(`dot${i}`);
                    if(i <= this.currentPin.length) dot.classList.add('filled');
                    else dot.classList.remove('filled');
                }
            },
            async checkGarbage() {
                const d = new Date();
                d.setDate(1); // FIX: Prevent month rollover bugs on the 31st
                d.setMonth(d.getMonth() - 2);
                const formatter = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Kolkata', year: 'numeric', month: '2-digit' });
                const cutoff = formatter.format(d).substring(0, 7);

                try {
                    const q = query(collection(db, 'attendance'), where(FieldPath.documentId(), '<', cutoff));
                    const snap = await getDocs(q);
                    this.garbageDocs = snap.docs;
                    
                    const text = document.getElementById('garbageText');
                    const btn = document.getElementById('btnGarbage');
                    
                    if(this.garbageDocs.length > 0) {
                        text.innerHTML = `Found <b style="color:white">${this.garbageDocs.length}</b> old attendance record(s) from before ${cutoff}.`;
                        btn.classList.remove('hidden');
                    } else {
                        text.innerHTML = `System is clean. No garbage data found before ${cutoff}.`;
                        btn.classList.add('hidden');
                    }
                } catch(e) { console.error(e); }
            },
            clearGarbage() {
                this.confirm("Clear Garbage", `Delete ${this.garbageDocs.length} old monthly records permanently?`, async () => {
                    try {
                        const chunks = [];
                        // Break into chunks of 460 to stay well under Firestore's 500 batch limit
                        for(let i=0; i<this.garbageDocs.length; i+=460) {
                            chunks.push(this.garbageDocs.slice(i, i+460));
                        }
                        
                        for(let chunk of chunks) {
                            const batch = writeBatch(db);
                            chunk.forEach(d => batch.delete(d.ref));
                            await batch.commit();
                        }
                        
                        this.checkGarbage();
                    } catch(e) {
                        console.error("Garbage Collection Error:", e);
                        app.showAlert("Deletion Failed", "Failed to delete some records. Check network constraints.");
                    }
                });
            }
        };
        window.app = app;

        document.getElementById('searchHome').addEventListener('input', (e) => {
            clearTimeout(app.searchTimers.home);
            app.searchTimers.home = setTimeout(() => {
                app.loadEmployees('home', true, e.target.value.trim());
            }, 400);
        });
        document.getElementById('searchEmp').addEventListener('input', (e) => {
            clearTimeout(app.searchTimers.manage);
            app.searchTimers.manage = setTimeout(() => {
                app.loadEmployees('manage', true, e.target.value.trim());
            }, 400);
        });
        document.getElementById('searchAdv').addEventListener('input', (e) => {
            clearTimeout(app.searchTimers.adv);
            app.searchTimers.adv = setTimeout(() => {
                app.loadEmployees('adv', true, e.target.value.trim());
            }, 400);
        });
        document.getElementById('reportMonth').addEventListener('change', () => app.loadReport());

        window.addEventListener('popstate', (e) => {
            app.closeModals(); 
            const state = e.state;
            if (state && state.view) {
                app.navigate(state.view, false);
            } else if (!state || !state.modal) {
                app.navigate('home', false);
            }
        });

        // Initialize the app with today's date configured
        app.changeHomeDate(app.getISTDateString());
        history.replaceState({ view: 'home' }, '', '#home');
        app.navigate('home', false);

    </script>
