<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- PWA & Viewport fixes for mobile keyboard and scaling -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Meena AI Assistant - Meena Marketing</title>
    
    <!-- Seamless Toolbar Color matching the Header -->
    <meta name="theme-color" content="#0f1724">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- External Libraries: Three.js for 3D Engine & Marked for Markdown -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #070b11; 
            --surface-color: #0f1724; 
            --surface-card: #141f30;
            --surface-hover: #1c2b42;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --meena-red: #ef4444; 
            --marketing-white: #ffffff;
            --accent-color: #0d9488; 
            --accent-glow: rgba(13, 148, 136, 0.35);
            --success-color: #10b981; 
            --success-glow: rgba(16, 185, 129, 0.4);
            --warning-color: #f59e0b;
            --input-bg: #121c2c;
            --input-border: #1e2e46;
            --shadow-glow: 0 0 20px rgba(13, 148, 136, 0.25);
            --cyan: #06b6d4;
            --app-height: 100dvh;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        /* Strict Viewport Lock & Overscroll Prevention */
        html { 
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            height: 100%; 
            height: var(--app-height, 100dvh); 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            overflow: hidden; 
            background-color: var(--bg-color); 
            overscroll-behavior: none;
        }
        body { 
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            height: 100%; 
            height: var(--app-height, 100dvh); 
            width: 100%; 
            margin: 0; 
            padding: 0;
            font-family: 'Inter', sans-serif; 
            color: var(--text-color); 
            display: flex; 
            flex-direction: column; 
            user-select: none;
            background-color: var(--bg-color);
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: manipulation;
        }

        /* --- MAIN APP CONTAINER STRUCTURE --- */
        .main-container {
            position: relative;
            width: 100%;
            height: 100%;
            height: var(--app-height, 100dvh);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- GLU 3D FLUID & THREE.JS CANVAS BACKGROUND --- */
        .ambient-bg { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100vw; 
            height: 100vh;
            height: 100dvh; 
            z-index: 0; 
            overflow: hidden; 
            background: transparent; 
            perspective: 1000px;
            transform-style: preserve-3d;
            transition: all 0.5s ease;
            pointer-events: none;
        }
        #bg3dCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
            opacity: 0.85;
        }
        .bg-orb { 
            position: absolute; 
            border-radius: 50%; 
            filter: blur(80px); 
            mix-blend-mode: screen; 
            opacity: 0.45; 
            animation: floatOrb 22s infinite alternate cubic-bezier(0.4, 0, 0.2, 1); 
            pointer-events: none;
            transition: all 1s ease-in-out;
            will-change: transform;
            z-index: 0;
        }
        .bg-orb-1 { width: 60vw; height: 60vw; background: rgba(13, 148, 136, 0.7); top: -10%; left: -10%; } 
        .bg-orb-2 { width: 70vw; height: 70vw; background: rgba(79, 70, 229, 0.6); bottom: -10%; right: -10%; animation-delay: -7s; } 
        .bg-orb-3 { width: 50vw; height: 50vw; background: rgba(6, 182, 212, 0.6); top: 30%; left: 30%; animation-delay: -12s; } 
        
        /* Accelerated state for processing/typing */
        .ambient-bg.accelerated .bg-orb {
            animation-duration: 4s;
            filter: blur(50px);
            opacity: 0.8;
        }
        
        @keyframes floatOrb { 
            0% { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); } 
            50% { transform: translate3d(6vw, 8vh, 60px) scale(1.15) rotate(45deg); }
            100% { transform: translate3d(-6vw, 12vh, -60px) scale(1.25) rotate(-45deg); } 
        }

        /* --- PREMIUM FROSTED TOP BAR HEADER (MATCHING INDEX) --- */
        header, .top-bar { 
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: calc(60px + env(safe-area-inset-top)); 
            background: rgba(15, 23, 36, 0.75); 
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: env(safe-area-inset-top) 20px 0 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            z-index: 1000; 
            border-bottom: 1px solid var(--input-border); 
            width: 100%;
            box-shadow: 0 4px 30px var(--accent-glow);
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
            flex-shrink: 0;
            transition: box-shadow 0.8s ease;
        }
        .brand-container { display: flex; align-items: center; gap: 14px; }
        
        .back-btn { 
            font-size: 26px; 
            color: var(--marketing-white); 
            cursor: pointer; 
            transition: transform 0.2s; 
            padding: 10px 10px 10px 0; 
        }
        .back-btn:active { transform: scale(0.85); }
        
        .brand-text { display: flex; flex-direction: column; line-height: 1.15; cursor: pointer; }
        .brand-title { font-size: 1.05em; font-weight: 800; letter-spacing: -0.02em; }
        .meena { color: var(--meena-red); }
        .marketing { color: var(--marketing-white); }
        .goorac { font-size: 0.72em; color: var(--accent-color); font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }

        .header-action-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--input-border);
            border-radius: 50%;
            width: 40px; 
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .header-action-btn:active { transform: scale(0.9); }
        .header-action-btn .material-symbols-outlined { font-size: 22px; transition: color 0.3s; }

        /* View Containers */
        .view-container { 
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: none; 
            flex-direction: column; 
            overflow: hidden; 
            z-index: 10; 
        }
        .view-container.active { display: flex; }

        /* --- CHAT VIEW & INDEPENDENT SCROLLING --- */
        .chat-history { 
            flex: 1; 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            padding: calc(76px + env(safe-area-inset-top)) 18px calc(100px + env(safe-area-inset-bottom)) 18px; 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
            scroll-behavior: smooth; 
            user-select: text;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }
        .msg-bubble { 
            max-width: 88%; 
            padding: 14px 18px; 
            border-radius: 20px; 
            font-size: 0.96em; 
            line-height: 1.55; 
            word-wrap: break-word; 
            animation: fadeIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); 
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            position: relative;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        
        .msg-user { 
            align-self: flex-end; 
            background: linear-gradient(135deg, var(--accent-color), #0f766e); 
            color: #ffffff; 
            border-bottom-right-radius: 6px; 
        }
        .msg-ai { 
            align-self: flex-start; 
            background: rgba(20, 31, 48, 0.85); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--input-border); 
            color: var(--text-color); 
            border-bottom-left-radius: 6px; 
        }
        .msg-error { 
            align-self: flex-start; 
            background: rgba(239, 68, 68, 0.15); 
            border: 1px solid rgba(239, 68, 68, 0.4); 
            color: #fca5a5; 
            border-bottom-left-radius: 6px; 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 0.85em; 
        }

        /* --- ADVANCED MARKDOWN & ACTIONS STYLING --- */
        .msg-content { width: 100%; overflow-x: auto; }
        .msg-content p { margin: 0 0 10px 0; }
        .msg-content p:last-child { margin: 0; }
        .msg-content strong { color: var(--accent-color); font-weight: 700; text-shadow: 0 0 10px rgba(13, 148, 136, 0.3); }
        .msg-content ul, .msg-content ol { margin: 10px 0; padding-left: 24px; }
        .msg-content li { margin-bottom: 6px; }
        
        .msg-content code { 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 0.85em; 
            background: rgba(0, 0, 0, 0.3); 
            color: #fbbf24; 
            padding: 3px 6px; 
            border-radius: 6px; 
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .code-wrapper {
            background: #0a0e14; 
            border: 1px solid var(--input-border); 
            border-radius: 12px; 
            margin: 16px 0; 
            overflow: hidden; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }
        .code-header {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--input-border);
        }
        .code-lang {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75em;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .code-wrapper pre { 
            margin: 0;
            padding: 16px; 
            background: transparent; 
            border: none; 
            overflow-x: auto; 
        }
        .code-wrapper pre code { 
            background: transparent; 
            padding: 0; 
            color: #e2e8f0; 
            font-size: 0.85em; 
            border: none;
            box-shadow: none;
        }
        
        .copy-code-btn { 
            background: rgba(255,255,255,0.05); 
            border: 1px solid rgba(255,255,255,0.1); 
            color: var(--text-secondary); 
            padding: 4px 10px; 
            border-radius: 6px; 
            font-size: 0.75em; 
            cursor: pointer; 
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1); 
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .copy-code-btn:hover { color: white; background: var(--accent-color); border-color: var(--accent-color); }
        .copy-code-btn .material-symbols-outlined { font-size: 14px; }

        .msg-content blockquote {
            border-left: 4px solid var(--accent-color);
            margin: 12px 0;
            padding: 8px 16px;
            background: rgba(13, 148, 136, 0.05);
            border-radius: 0 8px 8px 0;
            color: var(--text-secondary);
            font-style: italic;
        }

        .msg-content table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 0.9em; border-radius: 8px; overflow: hidden; }
        .msg-content th, .msg-content td { border: 1px solid var(--input-border); padding: 10px 12px; text-align: left; }
        .msg-content th { background: rgba(255,255,255,0.05); font-weight: 600; color: var(--marketing-white); }
        .msg-content tr:nth-child(even) { background: rgba(255,255,255,0.02); }

        .msg-actions { 
            display: flex; 
            gap: 16px; 
            margin-top: 12px; 
            padding-top: 12px; 
            border-top: 1px solid rgba(255,255,255,0.05); 
        }
        .action-icon { 
            font-size: 20px; 
            color: var(--text-secondary); 
            cursor: pointer; 
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1); 
            display: flex;
            align-items: center;
            padding: 4px;
            border-radius: 50%;
        }
        .action-icon:hover { color: var(--marketing-white); transform: scale(1.1); background: rgba(255,255,255,0.05);}

        .thinking-bubble {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(20, 31, 48, 0.5) !important;
            border: 1px solid var(--input-border) !important;
            color: var(--text-secondary) !important;
            font-style: italic;
            box-shadow: none !important;
        }
        .sparkle-icon {
            color: var(--accent-color);
            animation: pulseGlow 1.5s infinite alternate;
        }
        @keyframes pulseGlow {
            0% { transform: scale(0.9); opacity: 0.7; }
            100% { transform: scale(1.1); opacity: 1; text-shadow: 0 0 10px var(--accent-color); }
        }

        /* --- PROFESSIONAL FROSTED INPUT CONTAINER (MATCHING INDEX) --- */
        .chat-input-area { 
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: transparent; 
            padding: 12px 16px; 
            padding-bottom: calc(12px + env(safe-area-inset-bottom)); 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            z-index: 1000;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            flex-shrink: 0;
            transform: translateZ(0);
            -webkit-transform: translateZ(0);
        }
        .chat-input-wrapper { 
            width: 100%;
            background: rgba(18, 28, 44, 0.85); 
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--input-border); 
            border-radius: 24px; 
            padding: 8px 12px 8px 18px; 
            display: flex; 
            align-items: flex-end; 
            gap: 10px;
            margin-bottom: 5px; /* Updated gap from 15px to 5px */
            box-shadow: 0 0 20px var(--accent-glow), inset 0 0 10px rgba(255,255,255,0.02);
            transition: border-color 0.25s, box-shadow 0.25s, transform 0.2s; 
        }
        .chat-input-wrapper:focus-within { 
            border-color: var(--accent-color); 
            box-shadow: 0 0 30px var(--accent-glow), inset 0 0 10px rgba(255,255,255,0.05); 
            transform: translateY(-2px);
        }
        .chat-input-wrapper textarea { 
            flex: 1; 
            background: transparent; 
            border: none; 
            color: #ffffff; 
            font-family: 'Inter', sans-serif; 
            font-size: 0.95em; 
            outline: none; 
            resize: none; 
            max-height: 120px; 
            padding: 10px 0; 
            line-height: 1.45;
            user-select: text;
            overscroll-behavior-y: contain;
        }
        .chat-input-wrapper textarea::placeholder { color: var(--text-secondary); }
        
        .btn-send { 
            background: var(--marketing-white); 
            color: var(--bg-color); 
            width: 40px; 
            height: 40px; 
            border-radius: 50%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            border: none; 
            cursor: pointer; 
            transition: transform 0.15s, background 0.2s; 
            flex-shrink: 0; 
            box-shadow: 0 4px 12px rgba(255,255,255,0.15);
            margin-bottom: 2px;
        }
        .btn-send:active { transform: scale(0.92); }
        .btn-send:disabled { background: var(--input-border); color: var(--text-secondary); cursor: not-allowed; box-shadow: none; }
        .btn-send .material-symbols-outlined { font-size: 20px; font-weight: 600; margin-left: 2px;}

        /* --- REDESIGNED PROFESSIONAL VOICE CALL VIEW --- */
        .call-wrapper { 
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between; 
            padding: calc(80px + env(safe-area-inset-top)) 24px calc(34px + env(safe-area-inset-bottom)) 24px; 
            text-align: center; 
            position: relative; 
        }
        
        .voice-top-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            width: 100%;
        }

        .voice-container { 
            width: 250px; 
            height: 250px; 
            position: relative; 
            margin-bottom: 40px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        
        .v-ring { 
            position: absolute; 
            border-radius: 50%; 
            mix-blend-mode: screen; 
            filter: blur(15px); 
            transition: all 0.5s ease; 
            opacity: 0;
            pointer-events: none;
        }
        
        .voice-container.active .v-ring { opacity: 0.6; }
        .voice-container.active .v-ring:nth-child(1) { width: 180px; height: 180px; background: var(--accent-color); animation: vSpin 4s infinite linear; }
        .voice-container.active .v-ring:nth-child(2) { width: 200px; height: 160px; background: var(--success-color); animation: vSpin 3s infinite linear reverse; }
        .voice-container.active .v-ring:nth-child(3) { width: 160px; height: 200px; background: var(--cyan); animation: vPulse 2s infinite alternate; }
        
        .voice-container.processing .v-ring { filter: blur(25px); opacity: 0.85; }
        .voice-container.processing .v-ring:nth-child(1) { background: #8b5cf6; width: 190px; height: 190px; animation: vSpin 1.5s infinite linear; }
        .voice-container.processing .v-ring:nth-child(2) { background: var(--meena-red); width: 170px; height: 170px; animation: vSpin 1.5s infinite linear reverse; }
        .voice-container.processing .v-ring:nth-child(3) { background: var(--accent-color); width: 150px; height: 150px; animation: vPulse 1s infinite alternate; }
        
        .voice-container.speaking .v-ring { filter: blur(12px); opacity: 1; }
        .voice-container.speaking .v-ring:nth-child(1) { background: var(--cyan); width: 220px; height: 220px; animation: vSpeakPulse 0.4s infinite alternate; }
        .voice-container.speaking .v-ring:nth-child(2) { background: var(--success-color); width: 210px; height: 210px; animation: vSpeakPulse 0.6s infinite alternate-reverse; }
        .voice-container.speaking .v-ring:nth-child(3) { display: none; }

        @keyframes vSpin { 100% { transform: rotate(360deg); } }
        @keyframes vPulse { 100% { transform: scale(1.15); } }
        @keyframes vSpeakPulse { 0% { transform: scale(0.9); } 100% { transform: scale(1.25); } }

        .ai-avatar { 
            width: 140px; 
            height: 140px; 
            border-radius: 50%; 
            background: var(--surface-card); 
            border: 2px solid rgba(255,255,255,0.1); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            z-index: 10; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 2px 10px rgba(255,255,255,0.1); 
            transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1); 
        }
        .voice-container.active .ai-avatar { border-color: rgba(16, 185, 129, 0.5); transform: scale(1.04); }
        .voice-container.processing .ai-avatar { border-color: rgba(13, 148, 136, 0.5); }
        .voice-container.speaking .ai-avatar { border-color: rgba(6, 182, 212, 0.5); transform: scale(1.08); }

        .ai-avatar .material-symbols-outlined { 
            font-size: 64px; 
            color: var(--text-secondary); 
            transition: color 0.3s; 
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .voice-container.active .ai-avatar .material-symbols-outlined { color: var(--success-color); text-shadow: 0 0 20px var(--success-color); }
        .voice-container.processing .ai-avatar .material-symbols-outlined { color: var(--accent-color); text-shadow: 0 0 20px var(--accent-color); }
        .voice-container.speaking .ai-avatar .material-symbols-outlined { color: var(--cyan); text-shadow: 0 0 20px var(--cyan); }
        
        .call-status { 
            font-size: 1.3em; 
            font-weight: 700; 
            margin-bottom: 8px; 
            color: #ffffff; 
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .call-sub-status { 
            font-size: 0.9em; 
            color: var(--text-secondary); 
            min-height: 24px;
            max-width: 320px;
            line-height: 1.4;
            margin-bottom: 24px;
        }

        .live-caption-box { 
            background: rgba(20, 31, 48, 0.8); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--input-border); 
            padding: 16px 24px; 
            border-radius: 20px; 
            width: 100%; 
            max-width: 400px; 
            min-height: 80px; 
            max-height: 120px; 
            overflow-y: auto; 
            font-size: 0.95em; 
            line-height: 1.6; 
            color: var(--text-main); 
            text-align: left; 
            display: none; 
            flex-direction: column; 
            gap: 8px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 2px 10px rgba(0,0,0,0.2);
        }
        .live-caption-box.active { display: flex; }
        .caption-ai { color: var(--success-color); font-weight: 500; }
        .caption-user { color: #ffffff; opacity: 0.9; }
        .caption-interim { color: var(--text-secondary); font-style: italic; }

        .orb { 
            width: 12px; 
            height: 12px; 
            border-radius: 50%; 
            background: var(--success-color); 
            display: inline-block; 
            box-shadow: 0 0 12px var(--success-color); 
            animation: pulseOrb 1.6s infinite ease-in-out; 
        }
        @keyframes pulseOrb { 
            0% { transform: scale(0.9); opacity: 0.8; } 
            50% { transform: scale(1.2); opacity: 1; } 
            100% { transform: scale(0.9); opacity: 0.8; } 
        }
        .orb.processing { background: var(--accent-color); box-shadow: 0 0 12px var(--accent-color); }
        .orb.speaking { background: var(--cyan); box-shadow: 0 0 12px var(--cyan); animation: pulseOrb 0.8s infinite ease-in-out; }
        .orb.error { background: var(--meena-red); box-shadow: 0 0 12px var(--meena-red); animation: none; }

        .call-controls {

</head>
<body>

    <div class="main-container">
        <!-- GLU 3D Animated Fluid & WebGL Canvas Background -->
        <div class="ambient-bg" id="ambientBg">
            <canvas id="bg3dCanvas"></canvas>
            <div class="bg-orb bg-orb-1"></div>

        <header class="top-bar">

                <div class="brand-text" onclick="triggerHaptic([20]); window.location.href='inventory_2.html'">
                    <span class="brand-title"><span class="meena">Meena</span> <span class="marketing">Marketing</span></span>
                    <span class="goorac">AI Voice & Stock Engine</span>

            <div class="header-action-btn" id="headerBtn" onclick="toggleMode()">
                <span class="material-symbols-outlined" id="headerIcon" style="color: var(--accent-color);">headphones</span>

        </header>

        <!-- CHAT INTERFACE -->
        <div class="view-container active" id="viewChat">

                    <textarea id="chatInput" rows="1" placeholder="Message Meena AI..." oninput="autoResize(this); if(window.trigger3dTypingColor) window.trigger3dTypingColor();"></textarea>
                    <button class="btn-send" id="btnSend" onclick="sendChatMessage()">
                        <span class="material-symbols-outlined">arrow_upward</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- REDESIGNED PURE VOICE CALL INTERFACE -->
        <div class="view-container" id="viewCall">
            <div class="call-wrapper">
                <div class="voice-top-stage">
                    <div class="voice-container" id="voiceContainer">
                        <div class="v-ring"></div>
                        <div class="v-ring"></div>
                        <div class="v-ring"></div>
                        <div class="ai-avatar" id="aiAvatar">
                            <span class="material-symbols-outlined" id="avatarIcon">graphic_eq</span>
                        </div>
                    </div>
                    
                    <div class="call-status" id="callStatus">Ready to Connect</div>

                        <span class="material-symbols-outlined">call_end</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // MOBILE VIRTUAL KEYBOARD VIEWPORT LOCK
        // ==========================================
        function lockViewport() {
            window.scrollTo(0, 0);
            document.body.scrollTop = 0;
        }

        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', () => {
                const vh = window.visualViewport.height;
                document.documentElement.style.setProperty('--app-height', `${vh}px`);
                lockViewport();
            });
            window.visualViewport.addEventListener('scroll', lockViewport);
        }

        window.addEventListener('scroll', lockViewport);

        // ==========================================
        // THREE.JS 3D RANDOM MORPHING BLOB ENGINE
        // ==========================================
        (function init3D() {
            const canvas = document.getElementById('bg3dCanvas');
            if (!canvas || typeof THREE === 'undefined') return;

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 4.5;

            const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // Small, perfect icosahedron mesh
            const geometry = new THREE.IcosahedronGeometry(1.0, 32);
            const pos = geometry.attributes.position;
            const originalPositions = pos.array.slice();

            // Dynamic metallic material
            const material = new THREE.MeshPhongMaterial({
                color: 0x0d9488,
                emissive: 0x070b11,
                shininess: 90,
                transparent: true,
                opacity: 0.65,
                wireframe: false
            });

            const mesh = new THREE.Mesh(geometry, material);
            scene.add(mesh);

            // Lighting setup
            const light1 = new THREE.DirectionalLight(0x06b6d4, 1.2);
            light1.position.set(5, 5, 5);
            scene.add(light1);

            const light2 = new THREE.PointLight(0xef4444, 1.5, 10);
            light2.position.set(-5, -5, 2);
            scene.add(light2);

            const ambientLight = new THREE.AmbientLight(0x141f30, 1.2);
            scene.add(ambientLight);

            // Dynamic Color Palettes for Typing (Orange, Blue, Green, Yellow in gradients)
            const colorPalettes = [
                { main: new THREE.Color(0xf97316), l1: new THREE.Color(0x3b82f6), l2: new THREE.Color(0xeab308) }, // Orange base, Blue light, Yellow accent
                { main: new THREE.Color(0x3b82f6), l1: new THREE.Color(0x10b981), l2: new THREE.Color(0xf97316) }, // Blue base, Green light, Orange accent
                { main: new THREE.Color(0x10b981), l1: new THREE.Color(0xeab308), l2: new THREE.Color(0x3b82f6) }, // Green base, Yellow light, Blue accent
                { main: new THREE.Color(0xeab308), l1: new THREE.Color(0xf97316), l2: new THREE.Color(0x10b981) }  // Yellow base, Orange light, Green accent
            ];

            const defaultPalette = {
                main: new THREE.Color(0x0d9488),
                l1: new THREE.Color(0x06b6d4),
                l2: new THREE.Color(0xef4444)
            };

            let paletteIndex = 0;
            let targetMain = defaultPalette.main.clone();
            let targetL1 = defaultPalette.l1.clone();
            let targetL2 = defaultPalette.l2.clone();
            let typingTimer = null;

            window.trigger3dTypingColor = function() {
                paletteIndex = (paletteIndex + 1) % colorPalettes.length;
                const p = colorPalettes[paletteIndex];
                targetMain.copy(p.main);
                targetL1.copy(p.l1);
                targetL2.copy(p.l2);

                clearTimeout(typingTimer);
                typingTimer = setTimeout(() => {
                    targetMain.copy(defaultPalette.main);
                    targetL1.copy(defaultPalette.l1);
                    targetL2.copy(defaultPalette.l2);
                }, 1500);
            };

            // Smooth random procedural vertex morphing logic
            let time = 0;
            let speed = 0.006;
            const seedX = Math.random() * 100;
            const seedY = Math.random() * 100;

            function animate() {
                requestAnimationFrame(animate);
                time += speed;

                mesh.rotation.x += 0.002;
                mesh.rotation.y += 0.004;

                // Smoothly lerp colors when typing triggers changes
                material.color.lerp(targetMain, 0.05);
                light1.color.lerp(targetL1, 0.05);
                light2.color.lerp(targetL2, 0.05);

                const count = pos.count;
                for (let i = 0; i < count; i++) {
                    const u = originalPositions[i * 3];
                    const v = originalPositions[i * 3 + 1];
                    const w = originalPositions[i * 3 + 2];

                    // Smooth trigonometric noise distortion
                    const dist = Math.sin(u * 2.5 + time + seedX) * 0.12 + 
                                 Math.cos(v * 2.5 + time * 1.3 + seedY) * 0.12 +
                                 Math.sin(w * 2.5 + time * 0.9) * 0.08;

                    const norm = Math.sqrt(u * u + v * v + w * w);
                    pos.setXYZ(i, u + (u / norm) * dist, v + (v / norm) * dist, w + (w / norm) * dist);
                }
                pos.needsUpdate = true;
                geometry.computeVertexNormals();

                renderer.render(scene, camera);
            }

            animate();

            let lastWidth = window.innerWidth;
            window.addEventListener('resize', () => {
                // Ignore height-only resizes caused by virtual keyboard opening/closing to prevent background shrink/growth
                if (window.innerWidth !== lastWidth) {
                    lastWidth = window.innerWidth;
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                }
            });
        })();

        // BACKEND CONFIGURATION
        const BACKEND_URL = 'https://shiva757-meenaai.hf.space';
        
        // CONVERSATION MEMORY: Retain 100 max, but send only 20 to the backend
        let conversationHistory = [];
        const MAX_HISTORY = 100;

        // UI ELEMENTS
        const ambientBg = document.getElementById('ambientBg');
        const viewChat = document.getElementById('viewChat');
        const viewCall = document.getElementById('viewCall');
        
        const chatHistoryEl = document.getElementById('chatHistory');
        const chatInput = document.getElementById('chatInput');
        const btnSend = document.getElementById('btnSend');

        const voiceContainer = document.getElementById('voiceContainer');
        const callStatus = document.getElementById('callStatus');
        const callSubStatus = document.getElementById('callSubStatus');
        const liveCaptionBox = document.getElementById('liveCaptionBox');
        const liveCaptionContent = document.getElementById('liveCaptionContent');
        const avatarIcon = document.getElementById('avatarIcon');
        const btnStartCall = document.getElementById('btnStartCall');
        const btnEndCall = document.getElementById('btnEndCall');
        const headerIcon = document.getElementById('headerIcon');

        let currentMode = 'chat';

        // ==========================================
        // WEB SPEECH API (STT & TTS) STATE
        // ==========================================
        let recognition = null;
        let synth = window.speechSynthesis;
        let voiceState = 'idle'; // idle, listening, processing, speaking
        let isVoiceModeActive = false;

        // THINKING ANIMATION: 20 Array Texts
        let thinkingInterval;
        const thinkingPhrases = [
            "Thinking...", 
            "Analyzing query...", 
            "Checking inventory...", 
            "Scanning database...", 
            "Crunching numbers...", 
            "Reviewing stock levels...", 
            "Verifying prices...", 
            "Formulating response...", 
            "Fetching details...", 
            "Looking up models...", 
            "Calculating totals...", 
            "Processing request...", 
            "Consulting knowledge base...", 
            "Gathering data...", 
            "Evaluating options...", 
            "Synthesizing answer...", 
            "Retrieving records...", 
            "Cross-referencing items...", 
            "Preparing output...", 
            "Almost ready..."
        ];

        // ==========================================
        // HAPTIC FEEDBACK (VIBRATE ENGINE)
        // ==========================================
        function triggerHaptic(pattern = [30]) {
            if (navigator.vibrate) {
                try { navigator.vibrate(pattern); } catch(e) {}
            }
        }

        // ==========================================
        // 1. UI & NAVIGATION MANAGEMENT
        // ==========================================
        function toggleMode() {
            if (currentMode === 'chat') {
                triggerHaptic([40, 50, 40, 50, 40]); // Vibrate 3 times
                enterVoiceMode();
            } else {
                exitVoiceMode();
            }
        }

        function enterVoiceMode() {
            currentMode = 'voice';
            viewChat.classList.remove('active');
            viewCall.classList.add('active');
            
            headerIcon.innerText = 'close';
            headerIcon.style.color = 'var(--meena-red)';
            history.pushState({ view: 'voice' }, '', '#voice');

            // Prime TTS Engine on user interaction to bypass mobile restrictions
            let primer = new SpeechSynthesisUtterance('');
            primer.volume = 0;
            synth.speak(primer);

            startCall();
        }

        function exitVoiceMode() {
            triggerHaptic([30, 40]);
            currentMode = 'chat';
            
            stopCall();
            
            viewCall.classList.remove('active');
            viewChat.classList.add('active');
            
            headerIcon.innerText = 'headphones';
            headerIcon.style.color = 'var(--accent-color)';
            
            if (window.location.hash === '#voice') {
                history.back();
            }
        }

        window.addEventListener('popstate', (e) => {
            if (currentMode === 'voice') exitVoiceMode();
        });

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = (textarea.scrollHeight < 120 ? textarea.scrollHeight : 120) + 'px';
        }

        chatInput.addEventListener('focus', () => {
            setTimeout(lockViewport, 100);
            setTimeout(lockViewport, 300);
        });

        chatInput.addEventListener('blur', () => {
            setTimeout(lockViewport, 100);
        });

        // Markdown Stripper for TTS (Removes *, #, _, ` but keeps ₹ and text)
        function stripMarkdownForTTS(rawText) {
            let cleanText = rawText;
            cleanText = cleanText.replace(/[*_#`~>|-]/g, '');
            return cleanText;
        }

        // Advanced Chat Rendering with Markdown & Gemini Actions (Instantly Appends)
        function appendMessageToUI(role, text, isError = false) {
            if(!text) return;
            const div = document.createElement('div');
            
            if (isError) {
                div.className = 'msg-bubble msg-error';
                div.innerText = text;
                chatHistoryEl.appendChild(div);
                chatHistoryEl.scrollTop = chatHistoryEl.scrollHeight;
            } else if (role === 'user') {
                div.className = 'msg-bubble msg-user';
                div.innerText = text; // Raw text for user
                chatHistoryEl.appendChild(div);
                chatHistoryEl.scrollTop = chatHistoryEl.scrollHeight;
            } else {
                div.className = 'msg-bubble msg-ai';
                
                // Content Wrapper for Markdown
                const contentDiv = document.createElement('div');
                contentDiv.className = 'msg-content';
                
                // Parse markdown to HTML and insert instantly
                contentDiv.innerHTML = marked.parse(text);
                
                // Fix Code Blocks by wrapping them safely to prevent horizontal scroll bleeding
                contentDiv.querySelectorAll('pre').forEach(pre => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'code-wrapper';
                    
                    const header = document.createElement('div');
                    header.className = 'code-header';
                    
                    // Detect language if possible, else default to CODE
                    let lang = "CODE";
                    const codeEl = pre.querySelector('code');
                    if (codeEl && codeEl.className) {
                        const match = codeEl.className.match(/language-(\w+)/);
                        if (match) lang = match[1];
                    }
                    header.innerHTML = `<span class="code-lang"><span class="material-symbols-outlined" style="font-size: 16px;">code</span> ${lang}</span>`;
                    
                    const copyBtn = document.createElement('button');
                    copyBtn.className = 'copy-code-btn';
                    copyBtn.innerHTML = '<span class="material-symbols-outlined">content_copy</span> Copy';
                    copyBtn.onclick = () => {
                        triggerHaptic([20]);
                        const codeText = pre.querySelector('code').innerText;
                        navigator.clipboard.writeText(codeText);
                        copyBtn.innerHTML = '<span class="material-symbols-outlined">check</span> Copied!';
                        setTimeout(() => copyBtn.innerHTML = '<span class="material-symbols-outlined">content_copy</span> Copy', 2000);
                    };
                    
                    header.appendChild(copyBtn);
                    pre.parentNode.insertBefore(wrapper, pre);
                    wrapper.appendChild(header);
                    wrapper.appendChild(pre);
                });

                // Bottom Actions (Gemini-Style: Copy & Speak)
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'msg-actions';
                
                const speakBtn = document.createElement('span');
                speakBtn.className = 'material-symbols-outlined action-icon';
                speakBtn.innerText = 'volume_up';
                speakBtn.title = 'Speak text';
                speakBtn.onclick = () => {
                    triggerHaptic([20]);
                    playTTSResponse(text, true); // Play manually
                };

                const copyBtn = document.createElement('span');
                copyBtn.className = 'material-symbols-outlined action-icon';
                copyBtn.innerText = 'content_copy';
                copyBtn.title = 'Copy text';
                copyBtn.onclick = () => {
                    triggerHaptic([20]);
                    navigator.clipboard.writeText(text);
                    copyBtn.style.color = 'var(--success-color)';
                    setTimeout(() => copyBtn.style.color = 'var(--text-secondary)', 2000);
                };

                actionsDiv.appendChild(speakBtn);
                actionsDiv.appendChild(copyBtn);
                
                div.appendChild(contentDiv);
                div.appendChild(actionsDiv);
                chatHistoryEl.appendChild(div);
                chatHistoryEl.scrollTop = chatHistoryEl.scrollHeight;
            }
        }

        function saveToHistory(role, text) {
            if(!text) return;
            conversationHistory.push({ role, parts: [{ text }] });
            if (conversationHistory.length > MAX_HISTORY) {
                conversationHistory.shift();
            }
        }

        // Initialize first message dynamically
        function initChat() {
            chatHistoryEl.innerHTML = '';
            appendMessageToUI('model', 'வணக்கம்! நான் **மீனா மார்க்கெட்டிங் AI**. கடையில என்ன ஸ்டாக் இருக்குன்னு பாக்கணுமா?');
        }
        window.onload = initChat;

        // ==========================================
        // 2. TEXT CHAT MODE (REST API & LOADING UI)
        // ==========================================
        function showThinkingBubble() {
            ambientBg.classList.add('accelerated'); // Accelerate 3D background

            const div = document.createElement('div');
            div.id = "activeThinkingBubble";
            div.className = "msg-bubble msg-ai thinking-bubble";
            div.innerHTML = `<span class="material-symbols-outlined sparkle-icon">auto_awesome</span> <span id="thinkText">Thinking...</span>`;
            chatHistoryEl.appendChild(div);
            chatHistoryEl.scrollTop = chatHistoryEl.scrollHeight;
            
            let i = 0;
            thinkingInterval = setInterval(() => {
                i = (i + 1) % thinkingPhrases.length;
                const txt = document.getElementById('thinkText');
                if (txt) txt.innerText = thinkingPhrases[i];
            }, 800);
        }

        function hideThinkingBubble() {
            ambientBg.classList.remove('accelerated'); // Slow down 3D background
            clearInterval(thinkingInterval);
            const bubble = document.getElementById('activeThinkingBubble');
            if (bubble) bubble.remove();
        }

        async function sendChatMessage(overrideText = null) {
            const text = overrideText !== null ? overrideText : chatInput.value.trim();
            if (!text) return;

            if (overrideText === null) triggerHaptic([35]);

            appendMessageToUI('user', text);
            saveToHistory('user', text);
            
            chatInput.value = '';
            chatInput.style.height = 'auto';
            btnSend.disabled = true;

            showThinkingBubble();

            try {
                // Core Rule: Send ONLY the last 20 messages as context to backend
                const recentHistory = conversationHistory.slice(-21, -1);

                const payload = {
                    message: text,
                    history: recentHistory
                };

                const response = await fetch(`${BACKEND_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                hideThinkingBubble();

                if (!response.ok || data.error) {
                    let errMsg = data.error?.message || data.error || "API error occurred.";
                    appendMessageToUI('model', `Server Error: ${errMsg}`, true);
                    return null;
                }
                
                const aiText = data.candidates[0].content.parts[0].text;
                appendMessageToUI('model', aiText);
                saveToHistory('model', aiText);
                return aiText;

            } catch (err) {
                hideThinkingBubble();
                appendMessageToUI('model', `Network Error: ${err.message}`, true);
                return null;
            } finally {
                btnSend.disabled = false;
            }
        }

        chatInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendChatMessage();
            }
        });

        // ==========================================
        // 3. VOICE CALL ENGINE (STT -> REST -> TTS Loop)
        // ==========================================
        function updateVoiceUI() {
            voiceContainer.className = 'voice-container';
            let statusHtml = '';
            let subStatusText = '';

            if (voiceState === 'listening') {
                voiceContainer.classList.add('active');
                avatarIcon.innerText = 'mic';
                statusHtml = "<span class='orb'></span> Listening...";
                subStatusText = "Speak naturally. I'm listening.";
                ambientBg.classList.remove('accelerated');
            } else if (voiceState === 'processing') {
                voiceContainer.classList.add('processing');
                avatarIcon.innerText = 'auto_awesome';
                statusHtml = "<span class='orb processing'></span> Processing";
                subStatusText = "Working on your request...";
                ambientBg.classList.add('accelerated');
            } else if (voiceState === 'speaking') {
                voiceContainer.classList.add('speaking');
                avatarIcon.innerText = 'graphic_eq';
                statusHtml = "<span class='orb speaking'></span> Speaking";
                subStatusText = "AI is responding.";
                ambientBg.classList.remove('accelerated');
            } else {
                avatarIcon.innerText = 'mic_off';
                statusHtml = "Call Ended";
                subStatusText = "Tap the cross to exit.";
                ambientBg.classList.remove('accelerated');
            }

            callStatus.innerHTML = statusHtml;
            callSubStatus.innerText = subStatusText;
        }

        function updateCaption(role, text, isInterim = false) {
            if (role === "Meena") {
                // Strip markdown for clean captions
                const cleanCap = stripMarkdownForTTS(text);
                liveCaptionContent.innerHTML = `<span class="caption-ai">${cleanCap}</span>`;
            } else if (role === "User") {
                const colorClass = isInterim ? "caption-interim" : "caption-user";
                liveCaptionContent.innerHTML = `<span class="${colorClass}">${text}</span>`;
            }
            liveCaptionBox.scrollTop = liveCaptionBox.scrollHeight;
        }

        function startCall() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                callStatus.innerHTML = "<span class='orb error'></span> Not Supported";
                callSubStatus.innerText = "Voice chat is not supported on this browser.";
                return;
            }

            isVoiceModeActive = true;
            liveCaptionBox.classList.add('active');
            liveCaptionContent.innerHTML = "";
            btnStartCall.style.display = 'none';
            btnEndCall.style.display = 'flex';

            recognition = new SpeechRecognition();
            recognition.continuous = false; // Stop automatically when user pauses
            recognition.interimResults = true;
            recognition.lang = 'ta-IN'; // Tamil/Tanglish processing

            recognition.onstart = () => {
                if(!isVoiceModeActive) return;
                voiceState = 'listening';
                updateVoiceUI();
                updateCaption("User", "Listening...", true);
            };

            recognition.onresult = (event) => {
                if(!isVoiceModeActive) return;
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                if (interimTranscript) {
                    updateCaption("User", interimTranscript, true);
                }
                if (finalTranscript) {
                    updateCaption("User", finalTranscript, false);
                    recognition.stop();
                    processVoiceTurn(finalTranscript);
                }
            };

            recognition.onend = () => {
                // If it ended automatically (due to silence) and we aren't doing anything else, restart it
                if (isVoiceModeActive && voiceState === 'listening') {
                    try { recognition.start(); } catch(e) {}
                }
            };

            recognition.onerror = (event) => {
                if (event.error === 'no-speech') return; // Ignore silent timeouts
                console.error("Speech Recognition Error:", event.error);
                if (event.error === 'not-allowed') {
                    callStatus.innerHTML = "<span class='orb error'></span> Mic Denied";
                    callSubStatus.innerText = "Please grant microphone permissions.";
                    stopCall();
                }
            };

            try { recognition.start(); } catch(e) {}
        }

        async function processVoiceTurn(userText) {
            if(!isVoiceModeActive) return;
            voiceState = 'processing';
            updateVoiceUI(); // This also accelerates the 3D background
            
            // Loop through 20 thinking phrases in the caption box
            let i = 0;
            liveCaptionContent.innerHTML = `<span style="color:var(--accent-color)">${thinkingPhrases[i]}</span>`;
            const thinkingCycle = setInterval(() => {
                i = (i + 1) % thinkingPhrases.length;
                liveCaptionContent.innerHTML = `<span style="color:var(--accent-color); font-style:italic;">${thinkingPhrases[i]}</span>`;
            }, 600);

            // Fetch the response using the exact same Chat logic
            const aiResponse = await sendChatMessage(userText);
            
            clearInterval(thinkingCycle);

            if (!aiResponse) {
                updateCaption("Meena", "Sorry, network error.", false);
                setTimeout(() => {
                    if (isVoiceModeActive) {
                        voiceState = 'listening';
                        try { recognition.start(); } catch(e) {}
                    }
                }, 2000);
                return;
            }

            playTTSResponse(aiResponse, false);
        }

        function playTTSResponse(text, isManual = false) {
            if(!isVoiceModeActive && !isManual) return;
            
            if(!isManual) {
                voiceState = 'speaking';
                updateVoiceUI();
                updateCaption("Meena", text, false);
            }

            synth.cancel(); // Clear any queued speech

            // Strip Markdown formatting (*, #, `) before speaking, keeping words and ₹
            const cleanText = stripMarkdownForTTS(text);
            const utterance = new SpeechSynthesisUtterance(cleanText);
            
            utterance.lang = 'ta-IN'; // Ensure Tamil/Tanglish pronunciation
            utterance.rate = 1.15; // Slightly faster for natural conversation

            if(!isManual) {
                utterance.onend = () => {
                    if (isVoiceModeActive) {
                        voiceState = 'listening';
                        try { recognition.start(); } catch(e) {}
                    }
                };

                utterance.onerror = () => {
                    if (isVoiceModeActive) {
                        voiceState = 'listening';
                        try { recognition.start(); } catch(e) {}
                    }
                };
            }

            synth.speak(utterance);
        }

        function stopCall() {
            isVoiceModeActive = false;
            voiceState = 'idle';
            ambientBg.classList.remove('accelerated');
            
            if (recognition) {
                recognition.onend = null; // Prevent restart loops
                recognition.stop();
            }
            synth.cancel(); // Stop talking instantly
            
            voiceContainer.classList.remove('active', 'processing', 'speaking');
            liveCaptionBox.classList.remove('active');
            
            btnStartCall.style.display = 'flex';
            btnEndCall.style.display = 'none';
        }
    </script>
</body>
</html>
