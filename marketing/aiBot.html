<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Meena AI Assistant - Meena Marketing</title>
    
    <meta name="theme-color" content="#0b111a">
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Meena Marketing Core Theme */
        :root {
            --bg-color: #0b111a; 
            --surface-color: #131b26; 
            --surface-hover: #1b2636;
            --text-color: #ffffff;
            --text-secondary: #94a3b8;
            --meena-red: #ef4444; 
            --marketing-white: #ffffff;
            --accent-color: #0d9488; 
            --success-color: #10b981; 
            --warning-color: #f59e0b;
            --input-bg: #1e293b;
            --input-border: #334155;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-glow: 0 0 15px rgba(13, 148, 136, 0.3);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; margin: 0; padding: 0; width: 100%; overflow: hidden; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; }

        header { background-color: #212121; backdrop-filter: blur(12px); padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 500; border-bottom: 1px solid rgba(255,255,255,0.05); flex-shrink: 0; }
        .brand-container { display: flex; align-items: center; gap: 14px; }
        .logo-img { width: 38px; height: 38px; border-radius: 10px; }
        .brand-text { display: flex; flex-direction: column; line-height: 1.15; }
        .brand-title { font-size: 1em; font-weight: 700; letter-spacing: -0.02em;}
        .meena { color: var(--meena-red); }
        .marketing { color: var(--marketing-white); }
        .goorac { font-size: 0.75em; color: var(--accent-color); font-weight: 600; }

        /* Mode Switcher */
        .mode-switcher { display: flex; background: var(--surface-color); padding: 6px; border-radius: 12px; margin: 15px 20px; border: 1px solid var(--input-border); flex-shrink: 0; }
        .mode-btn { flex: 1; padding: 10px; text-align: center; font-weight: 600; font-size: 0.9em; color: var(--text-secondary); border-radius: 8px; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; border: none; background: transparent; font-family: inherit;}
        .mode-btn.active { background: var(--accent-color); color: white; box-shadow: var(--shadow-sm); }
        .mode-btn .material-symbols-outlined { font-size: 20px; }

        /* View Containers */
        .view-container { flex-grow: 1; display: none; flex-direction: column; overflow: hidden; position: relative; }
        .view-container.active { display: flex; }

        /* --- CHAT VIEW --- */
        .chat-history { flex-grow: 1; overflow-y: auto; padding: 0 20px 20px 20px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
        .msg-bubble { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 0.95em; line-height: 1.5; word-wrap: break-word; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .msg-user { align-self: flex-end; background: var(--accent-color); color: white; border-bottom-right-radius: 4px; box-shadow: 0 4px 10px rgba(13, 148, 136, 0.2); }
        .msg-ai { align-self: flex-start; background: var(--surface-color); border: 1px solid var(--input-border); color: var(--text-color); border-bottom-left-radius: 4px; }
        .msg-error { align-self: flex-start; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; border-bottom-left-radius: 4px; font-family: monospace; font-size: 0.85em; }
        
        .chat-input-area { background: var(--surface-color); padding: 15px 20px 25px 20px; border-top: 1px solid var(--input-border); display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0; }
        .chat-input-wrapper { flex-grow: 1; background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 20px; padding: 2px 15px; display: flex; align-items: center; transition: 0.3s; }
        .chat-input-wrapper:focus-within { border-color: var(--accent-color); box-shadow: var(--shadow-glow); }
        .chat-input-wrapper textarea { width: 100%; background: transparent; border: none; color: white; font-family: 'Inter', sans-serif; font-size: 0.95em; outline: none; resize: none; max-height: 100px; padding: 12px 0; }
        .chat-input-wrapper textarea::placeholder { color: var(--text-secondary); }
        
        .btn-send { background: var(--accent-color); color: white; width: 44px; height: 44px; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: none; cursor: pointer; transition: 0.2s; flex-shrink: 0; }
        .btn-send:hover { transform: scale(1.05); }
        .btn-send:active { transform: scale(0.95); }
        .btn-send:disabled { background: var(--input-border); color: var(--text-secondary); cursor: not-allowed; transform: none; }

        /* --- PURE VOICE CALL VIEW --- */
        .call-wrapper { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 40px 20px; text-align: center; position: relative; }
        
        .voice-top-section { display: flex; flex-direction: column; align-items: center; width: 100%; }
        
        .voice-container { width: 180px; height: 180px; border-radius: 50%; position: relative; margin-bottom: 30px; display: flex; justify-content: center; align-items: center; }
        
        /* Hardware visualizer rings */
        .ring { position: absolute; border-radius: 50%; border: 2px solid var(--success-color); opacity: 0; transition: 0.3s; }
        .voice-container.active .ring:nth-child(1) { width: 100%; height: 100%; animation: ripple 2s infinite linear; }
        .voice-container.active .ring:nth-child(2) { width: 100%; height: 100%; animation: ripple 2s infinite linear 0.6s; }
        .voice-container.active .ring:nth-child(3) { width: 100%; height: 100%; animation: ripple 2s infinite linear 1.2s; }
        
        @keyframes ripple { 0% { transform: scale(0.8); opacity: 0.8; border-color: var(--success-color); } 100% { transform: scale(1.8); opacity: 0; border-color: var(--accent-color); } }

        .ai-avatar { width: 140px; height: 140px; border-radius: 50%; background: var(--surface-color); border: 2px solid var(--input-border); display: flex; align-items: center; justify-content: center; z-index: 10; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: 0.3s; }
        .voice-container.active .ai-avatar { border-color: var(--success-color); box-shadow: 0 0 30px rgba(16, 185, 129, 0.3); background: rgba(16, 185, 129, 0.1); }
        .ai-avatar .material-symbols-outlined { font-size: 56px; color: var(--text-secondary); transition: 0.3s; }
        .voice-container.active .ai-avatar .material-symbols-outlined { color: var(--success-color); }
        
        .call-status { font-size: 1.1em; font-weight: 600; margin-bottom: 8px; color: white; }
        .call-sub-status { font-size: 0.85em; color: var(--text-secondary); min-height: 40px; display: flex; align-items: center; justify-content: center; padding: 0 15px;}

        /* Live Caption Box */
        .live-caption-box { background: rgba(19, 27, 38, 0.8); border: 1px solid var(--input-border); padding: 15px 20px; border-radius: 16px; width: 100%; max-width: 400px; min-height: 80px; max-height: 120px; overflow-y: auto; font-size: 0.95em; line-height: 1.5; color: var(--text-main); margin-bottom: 20px; text-align: left; display: none; flex-direction: column; gap: 8px; box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);}
        .live-caption-box.active { display: flex; }
        .caption-ai { color: var(--emerald); font-weight: 500; }
        .caption-error { color: var(--meena-red); font-weight: 500; font-family: monospace; font-size: 0.9em; }

        .orb { width: 12px; height: 12px; border-radius: 50%; background: var(--success-color); display: inline-block; margin-right: 8px; box-shadow: 0 0 10px var(--success-color); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
        .orb.error { background: var(--meena-red); box-shadow: 0 0 10px var(--meena-red); animation: none; }

        .call-controls { display: flex; gap: 20px; justify-content: center; width: 100%; padding-bottom: 20px; }
        .btn-call { width: 64px; height: 64px; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: none; cursor: pointer; transition: 0.3s; color: white; box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
        .btn-call:active { transform: scale(0.9); }
        .btn-call.start { background: linear-gradient(135deg, var(--success-color), #059669); }
        .btn-call.end { background: linear-gradient(135deg, var(--meena-red), #b91c1c); display: none; }
        .btn-call .material-symbols-outlined { font-size: 28px; }

    </style>
</head>
<body>

    <header>
        <div class="brand-container" onclick="window.location.href='inventory_2.html'" style="cursor: pointer;">
            <img src="icon.png" alt="Icon" class="logo-img" onerror="this.style.display='none'">
            <div class="brand-text">
                <span class="brand-title"><span class="meena">Meena</span> <span class="marketing">Marketing</span></span>
                <span class="goorac">AI Voice Engine</span>
            </div>
        </div>
        <span class="material-symbols-outlined" style="color: var(--text-secondary); cursor: pointer; transition: 0.2s;" onclick="clearHistory()" onmouseover="this.style.color='var(--meena-red)'" onmouseout="this.style.color='var(--text-secondary)'">delete_sweep</span>
    </header>

    <div class="mode-switcher">
        <button class="mode-btn active" id="btnModeChat" onclick="switchMode('chat')">
            <span class="material-symbols-outlined">forum</span> Text Chat
        </button>
        <button class="mode-btn" id="btnModeCall" onclick="switchMode('call')">
            <span class="material-symbols-outlined">mic</span> Voice Call
        </button>
    </div>

    <!-- CHAT INTERFACE -->
    <div class="view-container active" id="viewChat">
        <div class="chat-history" id="chatHistory">
            <div class="msg-bubble msg-ai">வணக்கம்! நான் மீனா மார்க்கெட்டிங் AI. கடையில என்ன ஸ்டாக் இருக்குன்னு பாக்கணுமா?</div>
        </div>
        <div class="chat-input-area">
            <div class="chat-input-wrapper">
                <textarea id="chatInput" rows="1" placeholder="Ask about inventory..." oninput="autoResize(this)"></textarea>
            </div>
            <button class="btn-send" id="btnSend" onclick="sendChatMessage()">
                <span class="material-symbols-outlined">send</span>
            </button>
        </div>
    </div>

    <!-- PURE VOICE CALL INTERFACE -->
    <div class="view-container" id="viewCall">
        <div class="call-wrapper">
            
            <div class="voice-top-section">
                <div class="voice-container" id="voiceContainer">
                    <div class="ring"></div>
                    <div class="ring"></div>
                    <div class="ring"></div>
                    <div class="ai-avatar" id="aiAvatar">
                        <span class="material-symbols-outlined">graphic_eq</span>
                    </div>
                </div>
                
                <div class="call-status" id="callStatus">Ready to Connect</div>
                <div class="call-sub-status" id="callSubStatus">Tap to start a voice call.</div>

                <div class="live-caption-box" id="liveCaptionBox">
                    <!-- Captions and errors append here during call -->
                </div>
            </div>

            <div class="call-controls">
                <button class="btn-call start" id="btnStartCall" onclick="startCall()">
                    <span class="material-symbols-outlined">call</span>
                </button>
                <button class="btn-call end" id="btnEndCall" onclick="stopCall()">
                    <span class="material-symbols-outlined">call_end</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURATION
        const BACKEND_URL = 'https://shiva757-meenaai.hf.space';
        const WS_URL = 'wss://shiva757-meenaai.hf.space/voice';
        
        // SHARED STATE
        let conversationHistory = [];
        const MAX_HISTORY = 100;

        // UI ELEMENTS
        const viewChat = document.getElementById('viewChat');
        const viewCall = document.getElementById('viewCall');
        const btnModeChat = document.getElementById('btnModeChat');
        const btnModeCall = document.getElementById('btnModeCall');
        
        // CHAT ELEMENTS
        const chatHistoryEl = document.getElementById('chatHistory');
        const chatInput = document.getElementById('chatInput');
        const btnSend = document.getElementById('btnSend');

        // CALL ELEMENTS
        const voiceContainer = document.getElementById('voiceContainer');
        const callStatus = document.getElementById('callStatus');
        const callSubStatus = document.getElementById('callSubStatus');
        const liveCaptionBox = document.getElementById('liveCaptionBox');
        const btnStartCall = document.getElementById('btnStartCall');
        const btnEndCall = document.getElementById('btnEndCall');

        // CALL STATE
        let ws;
        let localStream;
        let audioContext;
        let playbackContext;
        let processor;
        let nextPlaybackTime = 0;

        // ==========================================
        // 1. UI & SHARED LOGIC
        // ==========================================

        function switchMode(mode) {
            if (mode === 'chat') {
                btnModeChat.classList.add('active');
                btnModeCall.classList.remove('active');
                viewChat.classList.add('active');
                viewCall.classList.remove('active');
                if(ws && ws.readyState === WebSocket.OPEN) stopCall();
            } else {
                btnModeCall.classList.add('active');
                btnModeChat.classList.remove('active');
                viewCall.classList.add('active');
                viewChat.classList.remove('active');
            }
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = (textarea.scrollHeight < 100 ? textarea.scrollHeight : 100) + 'px';
        }

        function appendMessageToUI(role, text, isError = false) {
            if(!text) return;
            const div = document.createElement('div');
            
            if (isError) {
                div.className = 'msg-bubble msg-error';
            } else {
                div.className = `msg-bubble ${role === 'user' ? 'msg-user' : 'msg-ai'}`;
            }
            
            div.innerText = text;
            chatHistoryEl.appendChild(div);
            chatHistoryEl.scrollTop = chatHistoryEl.scrollHeight;
        }

        function appendCaption(text, type = "normal") {
            const div = document.createElement('div');
            if (type === "error") {
                div.className = "caption-error";
                div.innerText = `⚠️ ${text}`;
            } else {
                div.className = "caption-ai";
                div.innerText = text;
            }
            liveCaptionBox.appendChild(div);
            liveCaptionBox.scrollTop = liveCaptionBox.scrollHeight;
        }

        function saveToHistory(role, text) {
            if(!text) return;
            conversationHistory.push({ role, parts: [{ text }] });
            if (conversationHistory.length > MAX_HISTORY) {
                conversationHistory.shift();
            }
        }

        function clearHistory() {
            if(confirm("Clear conversation history?")) {
                conversationHistory = [];
                chatHistoryEl.innerHTML = '<div class="msg-bubble msg-ai">வணக்கம்! நான் மீனா மார்க்கெட்டிங் AI. கடையில என்ன ஸ்டாக் இருக்குன்னு பாக்கணுமா?</div>';
            }
        }

        // ==========================================
        // 2. TEXT CHAT MODE (REST API - FIXED ERROR PARSING)
        // ==========================================

        async function sendChatMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            // Update UI & State
            appendMessageToUI('user', text);
            saveToHistory('user', text);
            
            chatInput.value = '';
            chatInput.style.height = 'auto';
            btnSend.disabled = true;

            try {
                const payload = {
                    message: text,
                    history: conversationHistory.slice(0, -1) 
                };

                const response = await fetch(`${BACKEND_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                // Advanced Error Catching
                if (!response.ok || data.error) {
                    let errorMessage = "Unknown API error.";
                    
                    if (data.error && data.error.message) {
                        errorMessage = data.error.message;
                    } else if (typeof data.error === 'string') {
                        errorMessage = data.error;
                    } else if (response.statusText) {
                        errorMessage = `HTTP ${response.status}: ${response.statusText}`;
                    }

                    appendMessageToUI('model', `Server Error: ${errorMessage}`, true);
                    return;
                }
                
                // Successful Parsing
                let aiText = "";
                try {
                    aiText = data.candidates[0].content.parts[0].text;
                } catch(parseError) {
                    // Failsafe if structure changes but HTTP was 200 OK
                    appendMessageToUI('model', `Format Error: Received malformed JSON from API.\nPayload: ${JSON.stringify(data).substring(0, 100)}...`, true);
                    return;
                }

                appendMessageToUI('model', aiText);
                saveToHistory('model', aiText);

            } catch (err) {
                console.error("Chat Request Failed:", err);
                appendMessageToUI('model', `Network Error: ${err.message}. Backend might be asleep or unreachable.`, true);
            } finally {
                btnSend.disabled = false;
            }
        }

        chatInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendChatMessage();
            }
        });

        // ==========================================
        // 3. PURE VOICE CALL MODE (NO WEBCAM)
        // ==========================================

        async function startCall() {
            try {
                callStatus.innerText = "Requesting microphone...";
                callSubStatus.innerText = "";
                liveCaptionBox.innerHTML = "";
                liveCaptionBox.classList.remove('active');
                
                // Get Audio Only
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                
                callStatus.innerText = "Connecting to Gateway...";
                
                ws = new WebSocket(WS_URL);

                ws.onopen = () => {
                    callStatus.innerHTML = "<span class='orb'></span> Connection Live";
                    callSubStatus.innerText = "AI is listening. Speak naturally.";
                    voiceContainer.classList.add('active');
                    liveCaptionBox.classList.add('active');
                    
                    btnStartCall.style.display = 'none';
                    btnEndCall.style.display = 'flex';

                    ws.send(JSON.stringify({
                        type: 'init',
                        history: conversationHistory.slice(-15)
                    }));

                    startAudioCapture();
                };

                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        
                        // 1. Catch Google API Errors sent over the WebSocket
                        if (data.error) {
                            console.error("Gemini WebSocket Error:", data.error);
                            const errMsg = data.error.message || 'Server Overloaded';
                            callStatus.innerHTML = "<span class='orb error'></span> Server Overloaded";
                            callSubStatus.innerText = "Google AI is at capacity. Try again.";
                            appendCaption(`API Error: ${errMsg}`, "error");
                            
                            // Automatically cleanly close the connection after showing error
                            setTimeout(() => { stopCall(); }, 2000);
                            return;
                        }
                        
                        // 2. Process Audio and Text Transcripts
                        if (data.serverContent?.modelTurn?.parts) {
                            for (const part of data.serverContent.modelTurn.parts) {
                                if (part.inlineData && part.inlineData.mimeType.startsWith("audio/pcm")) {
                                    playAudio(part.inlineData.data);
                                }
                                if (part.text) {
                                    saveToHistory('model', part.text);
                                    appendMessageToUI('model', part.text); // Sync to text chat
                                    appendCaption(part.text, "normal"); // Show in live call view
                                }
                            }
                        }
                    } catch(e) { 
                        // Ignore non-JSON wrapper frames 
                    }
                };

                ws.onclose = (event) => {
                    if (event.code !== 1000 && event.code !== 1005) {
                        appendCaption(`Socket closed abruptly (Code: ${event.code})`, "error");
                    }
                    stopCall();
                };
                
                ws.onerror = (err) => {
                    console.error("WebSocket network error:", err);
                    callStatus.innerHTML = "<span class='orb error'></span> Connection Error";
                    callSubStatus.innerText = "Failed to route to backend.";
                    appendCaption("Network route to Hugging Face dropped.", "error");
                    stopCall();
                };

            } catch (err) {
                console.error("Mic access denied or error:", err);
                callStatus.innerHTML = "<span class='orb error'></span> Hardware Error";
                callSubStatus.innerText = "Could not access microphone.";
                liveCaptionBox.classList.add('active');
                appendCaption(err.message, "error");
            }
        }

        function startAudioCapture() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
            const source = audioContext.createMediaStreamSource(localStream);
            processor = audioContext.createScriptProcessor(4096, 1, 1);

            processor.onaudioprocess = (e) => {
                if (!ws || ws.readyState !== WebSocket.OPEN) return;

                const inputData = e.inputBuffer.getChannelData(0);
                const pcm16 = new Int16Array(inputData.length);
                for (let i = 0; i < inputData.length; i++) {
                    let s = Math.max(-1, Math.min(1, inputData[i]));
                    pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                }
                
                const bytes = new Uint8Array(pcm16.buffer);
                let binary = '';
                for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
                const base64 = btoa(binary);

                ws.send(JSON.stringify({
                    realtimeInput: { mediaChunks: [{ mimeType: "audio/pcm;rate=16000", data: base64 }] }
                }));
            };

            source.connect(processor);
            processor.connect(audioContext.destination);
        }

        function playAudio(base64Data) {
            if (!playbackContext) {
                playbackContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
            }

            const binaryString = atob(base64Data);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
            
            const int16Array = new Int16Array(bytes.buffer);
            const float32Array = new Float32Array(int16Array.length);
            for (let i = 0; i < int16Array.length; i++) {
                float32Array[i] = int16Array[i] / 32768.0;
            }

            const buffer = playbackContext.createBuffer(1, float32Array.length, 24000);
            buffer.getChannelData(0).set(float32Array);

            const source = playbackContext.createBufferSource();
            source.buffer = buffer;
            source.connect(playbackContext.destination);

            if (nextPlaybackTime < playbackContext.currentTime) {
                nextPlaybackTime = playbackContext.currentTime;
            }
            
            source.start(nextPlaybackTime);
            nextPlaybackTime += buffer.duration;
        }

        function stopCall() {
            if (ws) {
                if(ws.readyState === WebSocket.OPEN) {
                    try {
                        ws.send(JSON.stringify({ clientContent: { turnComplete: true } }));
                    } catch(e) {}
                    ws.close();
                }
            }
            if (processor) processor.disconnect();
            if (audioContext) audioContext.close();
            if (localStream) localStream.getTracks().forEach(track => track.stop());
            
            btnStartCall.style.display = 'flex';
            btnEndCall.style.display = 'none';
            
            // Only overwrite status if it wasn't an error state
            if (!callStatus.innerHTML.includes('error')) {
                callStatus.innerText = "Call Ended";
                callSubStatus.innerText = "Tap to reconnect.";
            }
            
            voiceContainer.classList.remove('active');
        }
    </script>
</body>
</html>
