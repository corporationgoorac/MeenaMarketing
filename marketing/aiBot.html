<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Meena AI Assistant - Meena Marketing</title>
    
    <meta name="theme-color" content="#0b111a">
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #070b11; 
            --surface-color: #0f1724; 
            --surface-card: #141f30;
            --surface-hover: #1c2b42;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --meena-red: #ef4444; 
            --marketing-white: #ffffff;
            --accent-color: #0d9488; 
            --accent-glow: rgba(13, 148, 136, 0.35);
            --success-color: #10b981; 
            --success-glow: rgba(16, 185, 129, 0.4);
            --warning-color: #f59e0b;
            --input-bg: #121c2c;
            --input-border: #1e2e46;
            --shadow-glow: 0 0 20px rgba(13, 148, 136, 0.25);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        /* Fixed height using dvh to prevent mobile keyboard from pushing header out of view */
        html, body { height: 100dvh; min-height: 100dvh; max-height: 100dvh; margin: 0; padding: 0; width: 100%; overflow: hidden; background-color: var(--bg-color); }
        body { 
            font-family: 'Inter', sans-serif; 
            color: var(--text-color); 
            display: flex; 
            flex-direction: column; 
            user-select: none;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(13, 148, 136, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 50% 100%, rgba(239, 68, 68, 0.05) 0%, transparent 50%);
        }

        /* Top Header */
        header { 
            background: rgba(15, 23, 36, 0.85); 
            backdrop-filter: blur(14px); 
            padding: 14px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: relative; 
            z-index: 500; 
            border-bottom: 1px solid var(--input-border); 
            flex-shrink: 0; 
        }
        .brand-container { display: flex; align-items: center; gap: 14px; cursor: pointer; }
        .logo-img { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--input-border); }
        .brand-text { display: flex; flex-direction: column; line-height: 1.15; }
        .brand-title { font-size: 1.05em; font-weight: 800; letter-spacing: -0.02em; }
        .meena { color: var(--meena-red); }
        .marketing { color: var(--marketing-white); }
        .goorac { font-size: 0.72em; color: var(--accent-color); font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }

        /* Dynamic Header Action Button (Headphones / Close) */
        .header-action-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--input-border);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .header-action-btn:active { transform: scale(0.9); }
        .header-action-btn .material-symbols-outlined { font-size: 24px; transition: color 0.3s; }

        /* View Containers */
        .view-container { flex-grow: 1; display: none; flex-direction: column; overflow: hidden; position: relative; }
        .view-container.active { display: flex; }

        /* --- CHAT VIEW --- */
        .chat-history { 
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 14px 18px; 
            display: flex; 
            flex-direction: column; 
            gap: 14px; 
            scroll-behavior: smooth; 
            user-select: text;
        }
        .msg-bubble { 
            max-width: 85%; 
            padding: 12px 16px; 
            border-radius: 18px; 
            font-size: 0.94em; 
            line-height: 1.5; 
            word-wrap: break-word; 
            animation: fadeIn 0.25s ease-out; 
            box-shadow: 0 4px 14px rgba(0,0,0,0.25);
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        .msg-user { 
            align-self: flex-end; 
            background: linear-gradient(135deg, var(--accent-color), #0f766e); 
            color: #ffffff; 
            border-bottom-right-radius: 4px; 
        }
        .msg-ai { 
            align-self: flex-start; 
            background: var(--surface-card); 
            border: 1px solid var(--input-border); 
            color: var(--text-color); 
            border-bottom-left-radius: 4px; 
        }
        .msg-error { 
            align-self: flex-start; 
            background: rgba(239, 68, 68, 0.12); 
            border: 1px solid rgba(239, 68, 68, 0.35); 
            color: #fca5a5; 
            border-bottom-left-radius: 4px; 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 0.85em; 
        }

        /* Thinking Animation Indicator */
        .thinking-bubble {
            display: flex;
            align-items: center;
            gap: 10px;
            background: transparent !important;
            border: 1px solid var(--input-border) !important;
            color: var(--text-secondary) !important;
            font-style: italic;
            box-shadow: none !important;
        }
        .sparkle-icon {
            color: var(--accent-color);
            animation: pulseGlow 1.5s infinite alternate;
        }
        @keyframes pulseGlow {
            0% { transform: scale(0.9); opacity: 0.7; }
            100% { transform: scale(1.1); opacity: 1; text-shadow: 0 0 10px var(--accent-color); }
        }
        
        .chat-input-area { 
            background: var(--surface-color); 
            padding: 12px 16px 20px 16px; 
            border-top: 1px solid var(--input-border); 
            display: flex; 
            gap: 10px; 
            align-items: flex-end; 
            flex-shrink: 0; 
        }
        .chat-input-wrapper { 
            flex-grow: 1; 
            background: var(--input-bg); 
            border: 1px solid var(--input-border); 
            border-radius: 22px; 
            padding: 4px 16px; 
            display: flex; 
            align-items: center; 
            transition: border-color 0.25s, box-shadow 0.25s; 
        }
        .chat-input-wrapper:focus-within { 
            border-color: var(--accent-color); 
            box-shadow: var(--shadow-glow); 
        }
        .chat-input-wrapper textarea { 
            width: 100%; 
            background: transparent; 
            border: none; 
            color: #ffffff; 
            font-family: 'Inter', sans-serif; 
            font-size: 0.95em; 
            outline: none; 
            resize: none; 
            max-height: 100px; 
            padding: 10px 0; 
            line-height: 1.4;
            user-select: text;
        }
        .chat-input-wrapper textarea::placeholder { color: var(--text-secondary); }
        
        .btn-send { 
            background: var(--accent-color); 
            color: #ffffff; 
            width: 44px; 
            height: 44px; 
            border-radius: 50%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            border: none; 
            cursor: pointer; 
            transition: transform 0.15s, background 0.2s; 
            flex-shrink: 0; 
            box-shadow: 0 4px 12px var(--accent-glow);
        }
        .btn-send:active { transform: scale(0.92); }
        .btn-send:disabled { background: var(--input-border); color: var(--text-secondary); cursor: not-allowed; box-shadow: none; }

        /* --- PURE VOICE CALL VIEW --- */
        .call-wrapper { 
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between; 
            padding: 40px 24px 34px 24px; 
            text-align: center; 
            position: relative; 
        }
        
        .voice-top-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            width: 100%;
        }

        .voice-container { 
            width: 200px; 
            height: 200px; 
            border-radius: 50%; 
            position: relative; 
            margin-bottom: 34px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        
        /* Dynamic Hardware Visualizer Rings */
        .ring { 
            position: absolute; 
            border-radius: 50%; 
            border: 2px solid var(--success-color); 
            opacity: 0; 
            pointer-events: none;
        }
        .voice-container.active .ring:nth-child(1) { width: 100%; height: 100%; animation: ripple 2.2s infinite cubic-bezier(0.1, 0.8, 0.3, 1); }
        .voice-container.active .ring:nth-child(2) { width: 100%; height: 100%; animation: ripple 2.2s infinite cubic-bezier(0.1, 0.8, 0.3, 1) 0.7s; }
        .voice-container.active .ring:nth-child(3) { width: 100%; height: 100%; animation: ripple 2.2s infinite cubic-bezier(0.1, 0.8, 0.3, 1) 1.4s; }
        
        @keyframes ripple { 
            0% { transform: scale(0.75); opacity: 0.9; border-color: var(--success-color); } 
            100% { transform: scale(1.85); opacity: 0; border-color: var(--accent-color); } 
        }

        .ai-avatar { 
            width: 140px; 
            height: 140px; 
            border-radius: 50%; 
            background: var(--surface-card); 
            border: 2px solid var(--input-border); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            z-index: 10; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1); 
        }
        .voice-container.active .ai-avatar { 
            border-color: var(--success-color); 
            box-shadow: 0 0 35px var(--success-glow); 
            background: rgba(16, 185, 129, 0.12); 
            transform: scale(1.04);
        }
        .ai-avatar .material-symbols-outlined { 
            font-size: 58px; 
            color: var(--text-secondary); 
            transition: color 0.3s; 
        }
        .voice-container.active .ai-avatar .material-symbols-outlined { 
            color: var(--success-color); 
        }
        
        .call-status { 
            font-size: 1.25em; 
            font-weight: 700; 
            margin-bottom: 8px; 
            color: #ffffff; 
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .call-sub-status { 
            font-size: 0.9em; 
            color: var(--text-secondary); 
            min-height: 24px;
            max-width: 320px;
            line-height: 1.4;
        }

        .orb { 
            width: 10px; 
            height: 10px; 
            border-radius: 50%; 
            background: var(--success-color); 
            display: inline-block; 
            box-shadow: 0 0 12px var(--success-color); 
            animation: pulseOrb 1.6s infinite ease-in-out; 
        }
        @keyframes pulseOrb { 
            0% { transform: scale(0.9); opacity: 0.8; } 
            50% { transform: scale(1.2); opacity: 1; } 
            100% { transform: scale(0.9); opacity: 0.8; } 
        }
        .orb.error { background: var(--meena-red); box-shadow: 0 0 12px var(--meena-red); animation: none; }

        .call-controls { 
            display: flex; 
            gap: 24px; 
            justify-content: center; 
            width: 100%; 
            padding-bottom: 10px;
        }
        .btn-call { 
            width: 68px; 
            height: 68px; 
            border-radius: 50%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            border: none; 
            cursor: pointer; 
            transition: transform 0.15s, box-shadow 0.2s; 
            color: #ffffff; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.4); 
        }
        .btn-call:active { transform: scale(0.92); }
        .btn-call.start { 
            background: linear-gradient(135deg, var(--success-color), #059669); 
            box-shadow: 0 8px 25px var(--success-glow); 
            display: none; /* Auto-start removes need for this initially */
        }
        .btn-call.end { 
            background: linear-gradient(135deg, var(--meena-red), #b91c1c); 
            box-shadow: 0 8px 25px rgba(239, 68, 68, 0.4); 
        }
        .btn-call .material-symbols-outlined { font-size: 32px; }

    </style>
</head>
<body>

    <header>
        <div class="brand-container" onclick="triggerHaptic([20]); window.location.href='inventory_2.html'">
            <img src="icon.png" alt="Icon" class="logo-img" onerror="this.style.display='none'">
            <div class="brand-text">
                <span class="brand-title"><span class="meena">Meena</span> <span class="marketing">Marketing</span></span>
                <span class="goorac">AI Voice & Stock Engine</span>
            </div>
        </div>
        
        <!-- Dynamic Header Button: Headphone to call, Cross to close -->
        <div class="header-action-btn" id="headerBtn" onclick="toggleMode()">
            <span class="material-symbols-outlined" id="headerIcon" style="color: var(--accent-color);">headphones</span>
        </div>
    </header>

    <!-- CHAT INTERFACE (Default) -->
    <div class="view-container active" id="viewChat">
        <div class="chat-history" id="chatHistory">
            <div class="msg-bubble msg-ai">வணக்கம்! நான் மீனா மார்க்கெட்டிங் AI. கடையில என்ன ஸ்டாக் இருக்குன்னு பாக்கணுமா?</div>
        </div>
        <div class="chat-input-area">
            <div class="chat-input-wrapper">
                <textarea id="chatInput" rows="1" placeholder="Ask stock or product query..." oninput="autoResize(this)"></textarea>
            </div>
            <button class="btn-send" id="btnSend" onclick="sendChatMessage()">
                <span class="material-symbols-outlined">send</span>
            </button>
        </div>
    </div>

    <!-- PURE VOICE CALL INTERFACE -->
    <div class="view-container" id="viewCall">
        <div class="call-wrapper">
            <div class="voice-top-stage">
                <div class="voice-container" id="voiceContainer">
                    <div class="ring"></div>
                    <div class="ring"></div>
                    <div class="ring"></div>
                    <div class="ai-avatar" id="aiAvatar">
                        <span class="material-symbols-outlined">graphic_eq</span>
                    </div>
                </div>
                
                <div class="call-status" id="callStatus">Ready to Connect</div>
                <div class="call-sub-status" id="callSubStatus">Initializing secure line...</div>
            </div>

            <div class="call-controls">
                <button class="btn-call start" id="btnStartCall" onclick="startCall()">
                    <span class="material-symbols-outlined">call</span>
                </button>
                <button class="btn-call end" id="btnEndCall" onclick="exitVoiceMode()">
                    <span class="material-symbols-outlined">call_end</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // BACKEND CONFIGURATION
        const BACKEND_URL = 'https://shiva757-meenaai.hf.space';
        const WS_URL = 'wss://shiva757-meenaai.hf.space/voice';
        
        // SHARED CONVERSATION MEMORY
        let conversationHistory = [];
        const MAX_HISTORY = 100;

        // UI ELEMENTS
        const viewChat = document.getElementById('viewChat');
        const viewCall = document.getElementById('viewCall');
        
        // CHAT ELEMENTS
        const chatHistoryEl = document.getElementById('chatHistory');
        const chatInput = document.getElementById('chatInput');
        const btnSend = document.getElementById('btnSend');

        // CALL ELEMENTS
        const voiceContainer = document.getElementById('voiceContainer');
        const callStatus = document.getElementById('callStatus');
        const callSubStatus = document.getElementById('callSubStatus');
        const btnStartCall = document.getElementById('btnStartCall');
        const btnEndCall = document.getElementById('btnEndCall');
        
        // HEADER ELEMENTS
        const headerIcon = document.getElementById('headerIcon');

        // AUDIO CONTEXT & STREAM PIPELINE
        let ws;
        let localStream;
        let audioContext;
        let playbackContext;
        let processor;
        let micMuteGain;
        let nextPlaybackTime = 0;
        let currentMode = 'chat';

        // GLOBAL SPEAKER ROUTING HACK FOR MOBILE
        let speakerAudio = new Audio();
        speakerAudio.autoplay = true;
        speakerAudio.playsInline = true; 
        let playbackDest;

        // THINKING ANIMATION STATE
        let thinkingInterval;
        const thinkingPhrases = [
            "Thinking...", 
            "Checking database...", 
            "Scanning inventory...", 
            "Analyzing models...", 
            "Just a moment..."
        ];

        // ==========================================
        // HAPTIC FEEDBACK (VIBRATE ENGINE)
        // ==========================================
        function triggerHaptic(pattern = [30]) {
            if (navigator.vibrate) {
                try {
                    navigator.vibrate(pattern);
                } catch(e) {}
            }
        }

        // ==========================================
        // 1. UI & NAVIGATION MANAGEMENT
        // ==========================================

        function toggleMode() {
            if (currentMode === 'chat') {
                // Vibrate 3 times as requested
                triggerHaptic([40, 50, 40, 50, 40]);
                enterVoiceMode();
            } else {
                exitVoiceMode();
            }
        }

        function enterVoiceMode() {
            currentMode = 'voice';
            
            // Switch Views
            viewChat.classList.remove('active');
            viewCall.classList.add('active');
            
            // Update Header Icon to Cross
            headerIcon.innerText = 'close';
            headerIcon.style.color = 'var(--meena-red)';
            
            // Push browser history state for mobile back button compatibility
            history.pushState({ view: 'voice' }, '', '#voice');

            // Automatically start the call
            startCall();
        }

        function exitVoiceMode() {
            triggerHaptic([30, 40]);
            currentMode = 'chat';
            
            // Stop active call
            stopCall();
            
            // Switch Views
            viewCall.classList.remove('active');
            viewChat.classList.add('active');
            
            // Update Header Icon to Headphones
            headerIcon.innerText = 'headphones';
            headerIcon.style.color = 'var(--accent-color)';
            
            // Clean up URL hash if user clicked the cross icon instead of using hardware back
            if (window.location.hash === '#voice') {
                history.back();
            }
        }

        // Mobile Hardware Back Button Handler
        window.addEventListener('popstate', (e) => {
            if (currentMode === 'voice') {
                // User pressed physical back button while in voice call
                exitVoiceMode();
            }
        });

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = (textarea.scrollHeight < 100 ? textarea.scrollHeight : 100) + 'px';
        }

        function appendMessageToUI(role, text, isError = false) {
            if(!text) return;
            const div = document.createElement('div');
            
            if (isError) {
                div.className = 'msg-bubble msg-error';
            } else {
                div.className = `msg-bubble ${role === 'user' ? 'msg-user' : 'msg-ai'}`;
            }
            
            div.innerText = text;
            chatHistoryEl.appendChild(div);
            chatHistoryEl.scrollTop = chatHistoryEl.scrollHeight;
        }

        function saveToHistory(role, text) {
            if(!text) return;
            conversationHistory.push({ role, parts: [{ text }] });
            if (conversationHistory.length > MAX_HISTORY) {
                conversationHistory.shift();
            }
        }

        // ==========================================
        // 2. TEXT CHAT MODE (REST API & LOADING UI)
        // ==========================================

        function showThinkingBubble() {
            const div = document.createElement('div');
            div.id = "activeThinkingBubble";
            div.className = "msg-bubble msg-ai thinking-bubble";
            div.innerHTML = `<span class="material-symbols-outlined sparkle-icon">auto_awesome</span> <span id="thinkText">Thinking...</span>`;
            
            chatHistoryEl.appendChild(div);
            chatHistoryEl.scrollTop = chatHistoryEl.scrollHeight;
            
            let i = 0;
            thinkingInterval = setInterval(() => {
                i = (i + 1) % thinkingPhrases.length;
                const txt = document.getElementById('thinkText');
                if (txt) txt.innerText = thinkingPhrases[i];
            }, 800);
        }

        function hideThinkingBubble() {
            clearInterval(thinkingInterval);
            const bubble = document.getElementById('activeThinkingBubble');
            if (bubble) bubble.remove();
        }

        async function sendChatMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            triggerHaptic([35]);

            appendMessageToUI('user', text);
            saveToHistory('user', text);
            
            chatInput.value = '';
            chatInput.style.height = 'auto';
            btnSend.disabled = true;

            // Show Gemini-style thinking animation
            showThinkingBubble();

            try {
                // Send strictly the last 15 messages of conversation history to keep latency low
                const recentHistory = conversationHistory.slice(-16, -1);

                const payload = {
                    message: text,
                    history: recentHistory
                };

                const response = await fetch(`${BACKEND_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                hideThinkingBubble();

                if (!response.ok || data.error) {
                    let errorMessage = "API error occurred.";
                    if (data.error && data.error.message) errorMessage = data.error.message;
                    else if (typeof data.error === 'string') errorMessage = data.error;
                    appendMessageToUI('model', `Server Error: ${errorMessage}`, true);
                    triggerHaptic([60, 40, 60]);
                    return;
                }
                
                let aiText = "";
                try {
                    aiText = data.candidates[0].content.parts[0].text;
                } catch(parseError) {
                    appendMessageToUI('model', `Format Error: Invalid structure from model.`, true);
                    return;
                }

                appendMessageToUI('model', aiText);
                saveToHistory('model', aiText);
                triggerHaptic([20]);

            } catch (err) {
                hideThinkingBubble();
                console.error("Chat Request Failed:", err);
                appendMessageToUI('model', `Network Error: ${err.message}. Backend may be warming up.`, true);
                triggerHaptic([80, 50, 80]);
            } finally {
                btnSend.disabled = false;
            }
        }

        chatInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendChatMessage();
            }
        });

        // ==========================================
        // 3. MULTIMODAL LIVE VOICE CALL ENGINE
        // ==========================================

        async function startCall() {
            try {
                callStatus.innerText = "Requesting mic...";
                callSubStatus.innerText = "Please allow microphone permissions.";
                btnStartCall.style.display = 'none';
                btnEndCall.style.display = 'flex';
                
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                audioContext = new AudioCtx({ sampleRate: 16000 });
                playbackContext = new AudioCtx({ sampleRate: 24000 });
                
                await audioContext.resume();
                await playbackContext.resume();

                // FORCE AUDIO TO MAIN SPEAKER (MediaStream API hack for mobile)
                playbackDest = playbackContext.createMediaStreamDestination();
                speakerAudio.srcObject = playbackDest.stream;
                try { await speakerAudio.play(); } catch(e) { console.log("Speaker routing warm-up pending."); }

                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        channelCount: 1,
                        sampleRate: 16000,
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    },
                    video: false
                });

                callStatus.innerText = "Connecting to Gateway...";
                callSubStatus.innerText = "Initializing live bidirectional stream...";

                ws = new WebSocket(WS_URL);

                ws.onopen = () => {
                    triggerHaptic([30, 40, 30]);
                    callStatus.innerHTML = "<span class='orb'></span> Connection Live";
                    callSubStatus.innerText = "AI is listening. Speak naturally.";
                    voiceContainer.classList.add('active');

                    // Send setup init with conversation history (last 15 messages)
                    ws.send(JSON.stringify({
                        type: 'init',
                        history: conversationHistory.slice(-15)
                    }));

                    startAudioCapture();
                };

                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        
                        if (data.error) {
                            console.error("Gemini Live Error:", data.error);
                            callStatus.innerHTML = "<span class='orb error'></span> Server Overloaded";
                            callSubStatus.innerText = "Google API capacity reached. Please retry in a moment.";
                            triggerHaptic([100, 50, 100]);
                            setTimeout(() => { if(currentMode === 'voice') exitVoiceMode(); }, 3000);
                            return;
                        }

                        if (data.serverContent?.modelTurn?.parts) {
                            for (const part of data.serverContent.modelTurn.parts) {
                                if (part.inlineData && part.inlineData.mimeType.startsWith("audio/pcm")) {
                                    playAudio(part.inlineData.data);
                                }
                                if (part.text) {
                                    saveToHistory('model', part.text);
                                }
                            }
                        }
                    } catch(e) {}
                };

                ws.onclose = () => { if(currentMode === 'voice') stopCallStateOnly(); };
                
                ws.onerror = (err) => {
                    console.error("Live WebSocket Error:", err);
                    callStatus.innerHTML = "<span class='orb error'></span> Connection Error";
                    callSubStatus.innerText = "Could not maintain connection to server.";
                    triggerHaptic([100, 50, 100]);
                    setTimeout(() => { if(currentMode === 'voice') exitVoiceMode(); }, 2500);
                };

            } catch (err) {
                console.error("Mic Access Error:", err);
                callStatus.innerHTML = "<span class='orb error'></span> Hardware Error";
                callSubStatus.innerText = err.message || "Could not access microphone.";
                triggerHaptic([120, 80, 120]);
                setTimeout(() => { if(currentMode === 'voice') exitVoiceMode(); }, 3500);
            }
        }

        function startAudioCapture() {
            if (!audioContext || !localStream) return;

            const source = audioContext.createMediaStreamSource(localStream);
            processor = audioContext.createScriptProcessor(2048, 1, 1);

            micMuteGain = audioContext.createGain();
            micMuteGain.gain.value = 0.0;

            processor.onaudioprocess = (e) => {
                if (!ws || ws.readyState !== WebSocket.OPEN) return;

                const inputData = e.inputBuffer.getChannelData(0);
                const pcm16 = new Int16Array(inputData.length);
                
                for (let i = 0; i < inputData.length; i++) {
                    let s = Math.max(-1, Math.min(1, inputData[i]));
                    pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                }
                
                const bytes = new Uint8Array(pcm16.buffer);
                let binary = '';
                for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
                const base64 = btoa(binary);

                ws.send(JSON.stringify({
                    realtimeInput: { mediaChunks: [{ mimeType: "audio/pcm;rate=16000", data: base64 }] }
                }));
            };

            source.connect(processor);
            processor.connect(micMuteGain);
            micMuteGain.connect(audioContext.destination);
        }

        function playAudio(base64Data) {
            if (!playbackContext) {
                playbackContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
                playbackDest = playbackContext.createMediaStreamDestination();
                speakerAudio.srcObject = playbackDest.stream;
                speakerAudio.play().catch(e => {});
            }
            if (playbackContext.state === 'suspended') {
                playbackContext.resume();
            }

            const binaryString = atob(base64Data);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
            
            const int16Array = new Int16Array(bytes.buffer);
            const float32Array = new Float32Array(int16Array.length);
            for (let i = 0; i < int16Array.length; i++) {
                float32Array[i] = int16Array[i] / 32768.0;
            }

            const buffer = playbackContext.createBuffer(1, float32Array.length, 24000);
            buffer.getChannelData(0).set(float32Array);

            const source = playbackContext.createBufferSource();
            source.buffer = buffer;
            
            // Connect to our speaker-forced MediaStream API destination instead of default earpiece context
            source.connect(playbackDest);

            if (nextPlaybackTime < playbackContext.currentTime) {
                nextPlaybackTime = playbackContext.currentTime;
            }
            
            source.start(nextPlaybackTime);
            nextPlaybackTime += buffer.duration;
        }

        // Just kills audio engines without altering UI mode
        function stopCallStateOnly() {
            if (ws) {
                if (ws.readyState === WebSocket.OPEN) {
                    try { ws.send(JSON.stringify({ clientContent: { turnComplete: true } })); } catch(e) {}
                    ws.close();
                }
                ws = null;
            }
            if (processor) { processor.disconnect(); processor = null; }
            if (micMuteGain) { micMuteGain.disconnect(); micMuteGain = null; }
            if (audioContext) { audioContext.close(); audioContext = null; }
            
            if (speakerAudio) { speakerAudio.pause(); speakerAudio.srcObject = null; }
            if (playbackDest) { playbackDest.disconnect(); playbackDest = null; }
            if (playbackContext) { playbackContext.close(); playbackContext = null; }
            
            if (localStream) { localStream.getTracks().forEach(track => track.stop()); localStream = null; }
            
            nextPlaybackTime = 0;
            voiceContainer.classList.remove('active');
            
            if (!callStatus.innerHTML.includes('error')) {
                callStatus.innerText = "Call Ended";
                callSubStatus.innerText = "Tap the green button to reconnect.";
            }
            
            btnStartCall.style.display = 'flex';
            btnEndCall.style.display = 'none';
        }

        function stopCall() {
            stopCallStateOnly();
        }
    </script>
</body>
