<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Meena AI Assistant - Meena Marketing</title>
    
    <meta name="theme-color" content="#0b111a">
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Meena Marketing Core Theme */
        :root {
            --bg-color: #0b111a; 
            --surface-color: #131b26; 
            --surface-hover: #1b2636;
            --text-color: #ffffff;
            --text-secondary: #94a3b8;
            --meena-red: #ef4444; 
            --marketing-white: #ffffff;
            --accent-color: #0d9488; 
            --success-color: #10b981; 
            --warning-color: #f59e0b;
            --info-color: #3b82f6;
            --input-bg: #1e293b;
            --input-border: #334155;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-glow: 0 0 15px rgba(13, 148, 136, 0.3);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; margin: 0; padding: 0; width: 100%; overflow: hidden; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; }

        header { background-color: #212121; backdrop-filter: blur(12px); padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 500; border-bottom: 1px solid rgba(255,255,255,0.05); flex-shrink: 0; }
        .brand-container { display: flex; align-items: center; gap: 14px; }
        .logo-img { width: 38px; height: 38px; border-radius: 10px; }
        .brand-text { display: flex; flex-direction: column; line-height: 1.15; }
        .brand-title { font-size: 1em; font-weight: 700; letter-spacing: -0.02em;}
        .meena { color: var(--meena-red); }
        .marketing { color: var(--marketing-white); }
        .goorac { font-size: 0.75em; color: var(--accent-color); font-weight: 600; }

        /* Mode Switcher */
        .mode-switcher { display: flex; background: var(--surface-color); padding: 6px; border-radius: 12px; margin: 15px 20px; border: 1px solid var(--input-border); flex-shrink: 0; }
        .mode-btn { flex: 1; padding: 10px; text-align: center; font-weight: 600; font-size: 0.9em; color: var(--text-secondary); border-radius: 8px; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; border: none; background: transparent; font-family: inherit;}
        .mode-btn.active { background: var(--accent-color); color: white; box-shadow: var(--shadow-sm); }
        .mode-btn .material-symbols-outlined { font-size: 20px; }

        /* View Containers */
        .view-container { flex-grow: 1; display: none; flex-direction: column; overflow: hidden; position: relative; }
        .view-container.active { display: flex; }

        /* --- CHAT VIEW --- */
        .chat-history { flex-grow: 1; overflow-y: auto; padding: 0 20px 20px 20px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
        .msg-bubble { max-width: 85%; padding: 12px 16px; border-radius: 16px; font-size: 0.95em; line-height: 1.5; word-wrap: break-word; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .msg-user { align-self: flex-end; background: var(--accent-color); color: white; border-bottom-right-radius: 4px; box-shadow: 0 4px 10px rgba(13, 148, 136, 0.2); }
        .msg-ai { align-self: flex-start; background: var(--surface-color); border: 1px solid var(--input-border); color: var(--text-color); border-bottom-left-radius: 4px; }
        
        .chat-input-area { background: var(--surface-color); padding: 15px 20px 25px 20px; border-top: 1px solid var(--input-border); display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0; }
        .chat-input-wrapper { flex-grow: 1; background: var(--input-bg); border: 1px solid var(--input-border); border-radius: 20px; padding: 2px 15px; display: flex; align-items: center; transition: 0.3s; }
        .chat-input-wrapper:focus-within { border-color: var(--accent-color); box-shadow: var(--shadow-glow); }
        .chat-input-wrapper textarea { width: 100%; background: transparent; border: none; color: white; font-family: 'Inter', sans-serif; font-size: 0.95em; outline: none; resize: none; max-height: 100px; padding: 12px 0; }
        .chat-input-wrapper textarea::placeholder { color: var(--text-secondary); }
        
        .btn-send { background: var(--accent-color); color: white; width: 44px; height: 44px; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: none; cursor: pointer; transition: 0.2s; flex-shrink: 0; }
        .btn-send:hover { transform: scale(1.05); }
        .btn-send:active { transform: scale(0.95); }
        .btn-send:disabled { background: var(--input-border); color: var(--text-secondary); cursor: not-allowed; transform: none; }

        /* --- LIVE CALL VIEW --- */
        .call-wrapper { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center; position: relative; }
        .webcam-container { width: 160px; height: 220px; border-radius: 20px; overflow: hidden; border: 2px solid var(--input-border); position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5); background: var(--surface-color); margin-bottom: 30px; transition: 0.3s; }
        .webcam-container.active { border-color: var(--success-color); box-shadow: 0 0 30px rgba(16, 185, 129, 0.2); }
        #webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        
        .ai-avatar { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--surface-color); z-index: 2; transition: 0.3s opacity; }
        .ai-avatar .material-symbols-outlined { font-size: 64px; color: var(--accent-color); }
        
        .call-status { font-size: 1.1em; font-weight: 600; margin-bottom: 8px; color: white; }
        .call-sub-status { font-size: 0.85em; color: var(--text-secondary); margin-bottom: 40px; }

        .orb { width: 12px; height: 12px; border-radius: 50%; background: var(--success-color); display: inline-block; margin-right: 8px; box-shadow: 0 0 10px var(--success-color); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }

        .call-controls { display: flex; gap: 20px; justify-content: center; }
        .btn-call { width: 64px; height: 64px; border-radius: 50%; display: flex; justify-content: center; align-items: center; border: none; cursor: pointer; transition: 0.3s; color: white; box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
        .btn-call:active { transform: scale(0.9); }
        .btn-call.start { background: linear-gradient(135deg, var(--success-color), #059669); }
        .btn-call.end { background: linear-gradient(135deg, var(--meena-red), #b91c1c); display: none; }
        .btn-call .material-symbols-outlined { font-size: 28px; }

        /* Floating Nav Override */
        .bottom-nav { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(19, 27, 38, 0.7); backdrop-filter: blur(24px); border: 1px solid rgba(255, 255, 255, 0.12); display: flex; justify-content: space-evenly; align-items: center; padding: 6px 14px; z-index: 1000; border-radius: 50px; width: auto; min-width: 260px; }
        .nav-item { display: flex; justify-content: center; align-items: center; color: var(--text-secondary); width: 44px; height: 44px; cursor: pointer; border-radius: 50%; transition: 0.2s;}
        .nav-item.active { color: var(--accent-color); background: rgba(13, 148, 136, 0.15); }
        .nav-item:hover { color: white; }

        /* Hide elements dynamically */
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <header>
        <div class="brand-container" onclick="window.location.href='inventory_2.html'" style="cursor: pointer;">
            <img src="icon.png" alt="Icon" class="logo-img" onerror="this.style.display='none'">
            <div class="brand-text">
                <span class="brand-title"><span class="meena">Meena</span> <span class="marketing">Marketing</span></span>
                <span class="goorac">AI Store Assistant</span>
            </div>
        </div>
        <span class="material-symbols-outlined" style="color: var(--text-secondary); cursor: pointer;" onclick="clearHistory()">delete_sweep</span>
    </header>

    <div class="mode-switcher">
        <button class="mode-btn active" id="btnModeChat" onclick="switchMode('chat')">
            <span class="material-symbols-outlined">forum</span> Text Chat
        </button>
        <button class="mode-btn" id="btnModeCall" onclick="switchMode('call')">
            <span class="material-symbols-outlined">videocam</span> Live Call
        </button>
    </div>

    <!-- CHAT INTERFACE -->
    <div class="view-container active" id="viewChat">
        <div class="chat-history" id="chatHistory">
            <div class="msg-bubble msg-ai">வணக்கம்! நான் மீனா மார்க்கெட்டிங் AI. கடையில என்ன ஸ்டாக் இருக்குன்னு பாக்கணுமா?</div>
        </div>
        <div class="chat-input-area">
            <div class="chat-input-wrapper">
                <textarea id="chatInput" rows="1" placeholder="Ask about inventory..." oninput="autoResize(this)"></textarea>
            </div>
            <button class="btn-send" id="btnSend" onclick="sendChatMessage()">
                <span class="material-symbols-outlined">send</span>
            </button>
        </div>
    </div>

    <!-- LIVE CALL INTERFACE -->
    <div class="view-container" id="viewCall">
        <div class="call-wrapper">
            <div class="webcam-container" id="webcamContainer">
                <div class="ai-avatar" id="aiAvatar"><span class="material-symbols-outlined">graphic_eq</span></div>
                <video id="webcam" autoplay playsinline muted></video>
            </div>
            
            <div class="call-status" id="callStatus">Ready to Connect</div>
            <div class="call-sub-status" id="callSubStatus">Tap the green button to start a live video call.</div>

            <div class="call-controls">
                <button class="btn-call start" id="btnStartCall" onclick="startCall()">
                    <span class="material-symbols-outlined">call</span>
                </button>
                <button class="btn-call end" id="btnEndCall" onclick="stopCall()">
                    <span class="material-symbols-outlined">call_end</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // CONFIGURATION
        const BACKEND_URL = 'https://shiva757-meenaai.hf.space';
        const WS_URL = 'wss://shiva757-meenaai.hf.space/voice';
        
        // SHARED STATE (In-Memory Context)
        let conversationHistory = [];
        const MAX_HISTORY = 100;

        // UI ELEMENTS
        const viewChat = document.getElementById('viewChat');
        const viewCall = document.getElementById('viewCall');
        const btnModeChat = document.getElementById('btnModeChat');
        const btnModeCall = document.getElementById('btnModeCall');
        
        // CHAT ELEMENTS
        const chatHistoryEl = document.getElementById('chatHistory');
        const chatInput = document.getElementById('chatInput');
        const btnSend = document.getElementById('btnSend');

        // CALL ELEMENTS
        const webcam = document.getElementById('webcam');
        const aiAvatar = document.getElementById('aiAvatar');
        const webcamContainer = document.getElementById('webcamContainer');
        const callStatus = document.getElementById('callStatus');
        const callSubStatus = document.getElementById('callSubStatus');
        const btnStartCall = document.getElementById('btnStartCall');
        const btnEndCall = document.getElementById('btnEndCall');

        // CALL STATE
        let ws;
        let localStream;
        let audioContext;
        let playbackContext;
        let processor;
        let videoInterval;
        let nextPlaybackTime = 0;

        // ==========================================
        // 1. UI & SHARED LOGIC
        // ==========================================

        function switchMode(mode) {
            if (mode === 'chat') {
                btnModeChat.classList.add('active');
                btnModeCall.classList.remove('active');
                viewChat.classList.add('active');
                viewCall.classList.remove('active');
                if(ws && ws.readyState === WebSocket.OPEN) stopCall();
            } else {
                btnModeCall.classList.add('active');
                btnModeChat.classList.remove('active');
                viewCall.classList.add('active');
                viewChat.classList.remove('active');
            }
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = (textarea.scrollHeight < 100 ? textarea.scrollHeight : 100) + 'px';
        }

        function appendMessageToUI(role, text) {
            if(!text) return;
            const div = document.createElement('div');
            div.className = `msg-bubble ${role === 'user' ? 'msg-user' : 'msg-ai'}`;
            div.innerText = text;
            chatHistoryEl.appendChild(div);
            chatHistoryEl.scrollTop = chatHistoryEl.scrollHeight;
        }

        function saveToHistory(role, text) {
            if(!text) return;
            conversationHistory.push({ role, parts: [{ text }] });
            if (conversationHistory.length > MAX_HISTORY) {
                conversationHistory.shift();
            }
        }

        function clearHistory() {
            if(confirm("Clear conversation history?")) {
                conversationHistory = [];
                chatHistoryEl.innerHTML = '<div class="msg-bubble msg-ai">வணக்கம்! நான் மீனா மார்க்கெட்டிங் AI. கடையில என்ன ஸ்டாக் இருக்குன்னு பாக்கணுமா?</div>';
            }
        }

        // ==========================================
        // 2. TEXT CHAT MODE (REST API)
        // ==========================================

        async function sendChatMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            // Update UI & State
            appendMessageToUI('user', text);
            saveToHistory('user', text);
            
            chatInput.value = '';
            chatInput.style.height = 'auto';
            btnSend.disabled = true;

            try {
                // Send payload matching the Node.js backend structure
                const payload = {
                    message: text,
                    // Send up to last 15 context turns
                    history: conversationHistory.slice(0, -1) 
                };

                const response = await fetch(`${BACKEND_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                // Parse Gemini REST response structure
                let aiText = "Error parsing response.";
                if (data && data.candidates && data.candidates[0].content.parts[0].text) {
                    aiText = data.candidates[0].content.parts[0].text;
                }

                appendMessageToUI('model', aiText);
                saveToHistory('model', aiText);

            } catch (err) {
                console.error("Chat Error:", err);
                appendMessageToUI('model', '⚠️ Server connection failed. Check your network.');
            } finally {
                btnSend.disabled = false;
            }
        }

        // Enter key to send
        chatInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendChatMessage();
            }
        });

        // ==========================================
        // 3. LIVE CALL MODE (WEBSOCKETS + WEBRTC)
        // ==========================================

        async function startCall() {
            try {
                callStatus.innerText = "Requesting permissions...";
                callSubStatus.innerText = "Please allow camera and microphone access.";
                
                // 1. Get Hardware Access
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
                webcam.srcObject = localStream;
                aiAvatar.style.opacity = '0'; // Reveal webcam
                
                callStatus.innerText = "Connecting to Gateway...";
                
                // 2. Open Proxy WebSocket
                ws = new WebSocket(WS_URL);

                ws.onopen = () => {
                    callStatus.innerHTML = "<span class='orb'></span> Connection Live";
                    callSubStatus.innerText = "AI is listening. Speak naturally.";
                    webcamContainer.classList.add('active');
                    
                    btnStartCall.style.display = 'none';
                    btnEndCall.style.display = 'flex';

                    // 3. Send Init Payload to Backend (Injects RAM history)
                    ws.send(JSON.stringify({
                        type: 'init',
                        history: conversationHistory.slice(-15) // Bridge context
                    }));

                    startAudioCapture();
                    startVideoCapture();
                };

                ws.onmessage = (event) => {
                    // Expecting stringified JSON from backend (bridged from Gemini)
                    try {
                        const data = JSON.parse(event.data);
                        
                        if (data.serverContent?.modelTurn?.parts) {
                            for (const part of data.serverContent.modelTurn.parts) {
                                // Handle Audio Playback
                                if (part.inlineData && part.inlineData.mimeType.startsWith("audio/pcm")) {
                                    playAudio(part.inlineData.data);
                                }
                                // Handle Text Transcript (Sync back to chat history)
                                if (part.text) {
                                    saveToHistory('model', part.text);
                                    appendMessageToUI('model', part.text); // Silently sync UI
                                }
                            }
                        }
                    } catch(e) { /* Ignore non-JSON or formatting errors */ }
                };

                ws.onclose = () => stopCall();
                ws.onerror = () => {
                    callStatus.innerText = "Connection Error";
                    callSubStatus.innerText = "Failed to connect to backend.";
                    stopCall();
                };

            } catch (err) {
                console.error("Call init failed", err);
                callStatus.innerText = "Hardware Error";
                callSubStatus.innerText = err.message;
            }
        }

        function startAudioCapture() {
            audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
            const source = audioContext.createMediaStreamSource(localStream);
            processor = audioContext.createScriptProcessor(4096, 1, 1);

            processor.onaudioprocess = (e) => {
                if (!ws || ws.readyState !== WebSocket.OPEN) return;

                const inputData = e.inputBuffer.getChannelData(0);
                const pcm16 = new Int16Array(inputData.length);
                for (let i = 0; i < inputData.length; i++) {
                    let s = Math.max(-1, Math.min(1, inputData[i]));
                    pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                }
                
                // Convert to Base64
                const bytes = new Uint8Array(pcm16.buffer);
                let binary = '';
                for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
                const base64 = btoa(binary);

                ws.send(JSON.stringify({
                    realtimeInput: { mediaChunks: [{ mimeType: "audio/pcm;rate=16000", data: base64 }] }
                }));
            };

            source.connect(processor);
            processor.connect(audioContext.destination);
        }

        function startVideoCapture() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');

            videoInterval = setInterval(() => {
                if (!ws || ws.readyState !== WebSocket.OPEN) return;
                
                canvas.width = webcam.videoWidth;
                canvas.height = webcam.videoHeight;
                ctx.drawImage(webcam, 0, 0);
                
                // Extremely compressed JPEG to save backend bandwidth
                const base64Image = canvas.toDataURL('image/jpeg', 0.4).split(',')[1];
                
                ws.send(JSON.stringify({
                    realtimeInput: { mediaChunks: [{ mimeType: "image/jpeg", data: base64Image }] }
                }));
            }, 1000); // 1 frame per second is sufficient for multimodal
        }

        function playAudio(base64Data) {
            if (!playbackContext) {
                playbackContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
            }

            const binaryString = atob(base64Data);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) bytes[i] = binaryString.charCodeAt(i);
            
            const int16Array = new Int16Array(bytes.buffer);
            const float32Array = new Float32Array(int16Array.length);
            for (let i = 0; i < int16Array.length; i++) {
                float32Array[i] = int16Array[i] / 32768.0;
            }

            const buffer = playbackContext.createBuffer(1, float32Array.length, 24000);
            buffer.getChannelData(0).set(float32Array);

            const source = playbackContext.createBufferSource();
            source.buffer = buffer;
            source.connect(playbackContext.destination);

            if (nextPlaybackTime < playbackContext.currentTime) {
                nextPlaybackTime = playbackContext.currentTime;
            }
            
            source.start(nextPlaybackTime);
            nextPlaybackTime += buffer.duration;
        }

        function stopCall() {
            if (ws) {
                // Send client turn complete before severing
                if(ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ clientContent: { turnComplete: true } }));
                    ws.close();
                }
            }
            if (processor) processor.disconnect();
            if (audioContext) audioContext.close();
            if (videoInterval) clearInterval(videoInterval);
            if (localStream) localStream.getTracks().forEach(track => track.stop());
            
            // Reset UI
            btnStartCall.style.display = 'flex';
            btnEndCall.style.display = 'none';
            callStatus.innerText = "Call Ended";
            callSubStatus.innerText = "Tap the green button to reconnect.";
            webcamContainer.classList.remove('active');
            aiAvatar.style.opacity = '1';
            webcam.srcObject = null;
        }

    </script>
</body>
</html>
