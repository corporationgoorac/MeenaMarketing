<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Meena AI Assistant - Meena Marketing</title>
    
    <meta name="theme-color" content="#0b111a">
    
    <!-- External Markdown Parser for beautiful text rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #070b11; 
            --surface-color: rgba(15, 23, 36, 0.6); 
            --surface-card: #141f30;
            --surface-hover: #1c2b42;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
            --meena-red: #ef4444; 
            --marketing-white: #ffffff;
            --accent-color: #0d9488; 
            --accent-glow: rgba(13, 148, 136, 0.35);
            --success-color: #10b981; 
            --success-glow: rgba(16, 185, 129, 0.4);
            --warning-color: #f59e0b;
            --input-bg: #121c2c;
            --input-border: rgba(255, 255, 255, 0.1);
            --shadow-glow: 0 0 20px rgba(13, 148, 136, 0.25);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        /* Fixed height using dvh to prevent mobile keyboard from pushing header out of view */
        html, body { height: 100dvh; min-height: 100dvh; max-height: 100dvh; margin: 0; padding: 0; width: 100%; overflow: hidden; background-color: var(--bg-color); }
        body { 
            font-family: 'Inter', sans-serif; 
            color: var(--text-color); 
            display: flex; 
            flex-direction: column; 
            user-select: none;
        }

        /* --- GLU 3D ANIMATED BACKGROUND --- */
        .ambient-bg { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            z-index: -1; 
            overflow: hidden; 
            background: #04070b; 
        }
        .bg-orb { 
            position: absolute; 
            border-radius: 50%; 
            filter: blur(90px); 
            opacity: 0.55; 
            animation: floatOrb 22s infinite alternate ease-in-out; 
            pointer-events: none;
        }
        .bg-orb-1 { width: 55vw; height: 55vw; background: rgba(13, 148, 136, 0.3); top: -15%; left: -10%; } /* Teal */
        .bg-orb-2 { width: 65vw; height: 65vw; background: rgba(79, 70, 229, 0.25); bottom: -25%; right: -15%; animation-delay: -7s; } /* Indigo */
        .bg-orb-3 { width: 45vw; height: 45vw; background: rgba(6, 182, 212, 0.25); top: 35%; left: 35%; animation-delay: -12s; } /* Cyan */
        
        @keyframes floatOrb { 
            0% { transform: translate(0, 0) scale(1); } 
            50% { transform: translate(3vw, 5vh) scale(1.05); }
            100% { transform: translate(-2vw, 8vh) scale(1.1); } 
        }

        /* Top Header */
        header { 
            background: rgba(11, 15, 20, 0.7); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            padding: 14px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            position: relative; 
            z-index: 500; 
            border-bottom: 1px solid var(--input-border); 
            flex-shrink: 0; 
        }
        .brand-container { display: flex; align-items: center; gap: 14px; cursor: pointer; }
        .logo-img { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--input-border); }
        .brand-text { display: flex; flex-direction: column; line-height: 1.15; }
        .brand-title { font-size: 1.05em; font-weight: 800; letter-spacing: -0.02em; }
        .meena { color: var(--meena-red); }
        .marketing { color: var(--marketing-white); }
        .goorac { font-size: 0.72em; color: var(--accent-color); font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }

        /* Dynamic Header Action Button (Headphones / Close) */
        .header-action-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--input-border);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .header-action-btn:active { transform: scale(0.9); }
        .header-action-btn .material-symbols-outlined { font-size: 24px; transition: color 0.3s; }

        /* View Containers */
        .view-container { flex-grow: 1; display: none; flex-direction: column; overflow: hidden; position: relative; }
        .view-container.active { display: flex; }

        /* --- CHAT VIEW --- */
        .chat-history { 
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 14px 18px; 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
            scroll-behavior: smooth; 
            user-select: text;
        }
        .msg-bubble { 
            max-width: 88%; 
            padding: 14px 18px; 
            border-radius: 20px; 
            font-size: 0.96em; 
            line-height: 1.55; 
            word-wrap: break-word; 
            animation: fadeIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); 
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
            position: relative;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        
        .msg-user { 
            align-self: flex-end; 
            background: linear-gradient(135deg, var(--accent-color), #0f766e); 
            color: #ffffff; 
            border-bottom-right-radius: 6px; 
        }
        .msg-ai { 
            align-self: flex-start; 
            background: rgba(20, 31, 48, 0.8); 
            backdrop-filter: blur(10px);
            border: 1px solid var(--input-border); 
            color: var(--text-color); 
            border-bottom-left-radius: 6px; 
        }
        .msg-error { 
            align-self: flex-start; 
            background: rgba(239, 68, 68, 0.15); 
            border: 1px solid rgba(239, 68, 68, 0.4); 
            color: #fca5a5; 
            border-bottom-left-radius: 6px; 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 0.85em; 
        }

        /* --- ADVANCED MARKDOWN & ACTIONS STYLING --- */
        .msg-content { width: 100%; overflow-x: auto; }
        .msg-content p { margin: 0 0 10px 0; }
        .msg-content p:last-child { margin: 0; }
        .msg-content strong { color: var(--accent-color); font-weight: 700; text-shadow: 0 0 10px rgba(13, 148, 136, 0.3); }
        .msg-content ul, .msg-content ol { margin: 10px 0; padding-left: 24px; }
        .msg-content li { margin-bottom: 6px; }
        
        /* Inline Code Styling */
        .msg-content code { 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 0.85em; 
            background: rgba(0, 0, 0, 0.3); 
            color: #fbbf24; /* Amber colored inline code */
            padding: 3px 6px; 
            border-radius: 6px; 
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        /* PROFESSIONAL CODE BOX (Fixed Scroll Issue) */
        .code-wrapper {
            background: #0a0e14; /* Deep terminal background */
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 12px; 
            margin: 16px 0; 
            overflow: hidden; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }
        .code-header {
            background: rgba(255, 255, 255, 0.04);
            padding: 8px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .code-lang {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75em;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .code-wrapper pre { 
            margin: 0;
            padding: 16px; 
            background: transparent; 
            border: none; 
            overflow-x: auto; 
        }
        .code-wrapper pre code { 
            background: transparent; 
            padding: 0; 
            color: #e2e8f0; 
            font-size: 0.85em; 
            border: none;
            box-shadow: none;
        }
        
        /* Modern Copy Button inside Code Block */
        .copy-code-btn { 
            background: transparent; 
            border: 1px solid rgba(255,255,255,0.1); 
            color: var(--text-secondary); 
            padding: 4px 10px; 
            border-radius: 6px; 
            font-size: 0.75em; 
            cursor: pointer; 
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1); 
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .copy-code-btn:hover { color: white; background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); }
        .copy-code-btn .material-symbols-outlined { font-size: 14px; }

        /* Blockquotes */
        .msg-content blockquote {
            border-left: 4px solid var(--accent-color);
            margin: 12px 0;
            padding: 8px 16px;
            background: rgba(13, 148, 136, 0.05);
            border-radius: 0 8px 8px 0;
            color: var(--text-secondary);
            font-style: italic;
        }

        /* Tables */
        .msg-content table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 0.9em; border-radius: 8px; overflow: hidden; }
        .msg-content th, .msg-content td { border: 1px solid rgba(255,255,255,0.1); padding: 10px 12px; text-align: left; }
        .msg-content th { background: rgba(255,255,255,0.05); font-weight: 600; color: var(--marketing-white); }
        .msg-content tr:nth-child(even) { background: rgba(255,255,255,0.02); }

        /* Gemini-style Bottom Action Buttons */
        .msg-actions { 
            display: flex; 
            gap: 16px; 
            margin-top: 12px; 
            padding-top: 12px; 
            border-top: 1px solid rgba(255,255,255,0.05); 
        }
        .action-icon { 
            font-size: 20px; 
            color: var(--text-secondary); 
            cursor: pointer; 
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1); 
            display: flex;
            align-items: center;
            padding: 4px;
            border-radius: 50%;
        }
        .action-icon:hover { color: var(--marketing-white); transform: scale(1.1); background: rgba(255,255,255,0.05);}

        /* Thinking Animation Indicator */
        .thinking-bubble {
            display: flex;
            align-items: center;
            gap: 10px;
            background: transparent !important;
            border: 1px solid var(--input-border) !important;
            color: var(--text-secondary) !important;
            font-style: italic;
            box-shadow: none !important;
        }
        .sparkle-icon {
            color: var(--accent-color);
            animation: pulseGlow 1.5s infinite alternate;
        }
        @keyframes pulseGlow {
            0% { transform: scale(0.9); opacity: 0.7; }
            100% { transform: scale(1.1); opacity: 1; text-shadow: 0 0 10px var(--accent-color); }
        }
        
        /* Typing Cursor */
        .typing-cursor::after {
            content: '▌';
            display: inline-block;
            color: var(--accent-color);
            animation: blink 1s step-start infinite;
            margin-left: 2px;
            text-shadow: 0 0 8px var(--accent-color);
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* --- CHATGPT STYLE INPUT AREA --- */
        .chat-input-area { 
            background: transparent; 
            padding: 10px 20px 24px 20px; 
            display: flex; 
            align-items: flex-end; 
            position: relative;
            z-index: 100;
        }
        .chat-input-wrapper { 
            flex-grow: 1; 
            background: rgba(30, 41, 59, 0.85); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.12); 
            border-radius: 26px; 
            padding: 6px 6px 6px 20px; 
            display: flex; 
            align-items: flex-end; 
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            transition: border-color 0.25s, box-shadow 0.25s; 
        }
        .chat-input-wrapper:focus-within { 
            border-color: rgba(255,255,255,0.25); 
            box-shadow: 0 8px 30px rgba(0,0,0,0.6), 0 0 20px rgba(255,255,255,0.05); 
        }
        .chat-input-wrapper textarea { 
            width: 100%; 
            background: transparent; 
            border: none; 
            color: #ffffff; 
            font-family: 'Inter', sans-serif; 
            font-size: 1em; 
            outline: none; 
            resize: none; 
            max-height: 120px; 
            padding: 12px 0; 
            line-height: 1.4;
            user-select: text;
            margin-right: 10px;
        }
        .chat-input-wrapper textarea::placeholder { color: var(--text-secondary); }
        
        .btn-send { 
            background: var(--marketing-white); 
            color: var(--bg-color); 
            width: 38px; 
            height: 38px; 
            border-radius: 50%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            border: none; 
            cursor: pointer; 
            transition: transform 0.15s, background 0.2s; 
            flex-shrink: 0; 
            box-shadow: 0 4px 12px rgba(255,255,255,0.15);
            margin-bottom: 4px;
        }
        .btn-send:active { transform: scale(0.92); }
        .btn-send:disabled { background: var(--input-border); color: var(--text-secondary); cursor: not-allowed; box-shadow: none; }
        .btn-send .material-symbols-outlined { font-size: 20px; font-weight: 600; margin-left: 2px;}

        /* --- PURE VOICE CALL VIEW --- */
        .call-wrapper { 
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: space-between; 
            padding: 40px 24px 34px 24px; 
            text-align: center; 
            position: relative; 
        }
        
        .voice-top-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            width: 100%;
        }

        .voice-container { 
            width: 220px; 
            height: 220px; 
            border-radius: 50%; 
            position: relative; 
            margin-bottom: 34px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        
        /* Upgraded Premium Voice Rings */
        .ring { 
            position: absolute; 
            border-radius: 50%; 
            border: 2px solid var(--success-color); 
            opacity: 0; 
            pointer-events: none;
            box-shadow: inset 0 0 20px transparent, 0 0 20px transparent;
        }
        /* Active (Listening) Animation */
        .voice-container.active .ring:nth-child(1) { width: 100%; height: 100%; animation: ripplePremium 2.2s infinite cubic-bezier(0.1, 0.8, 0.3, 1); border-color: var(--success-color); }
        .voice-container.active .ring:nth-child(2) { width: 100%; height: 100%; animation: ripplePremium 2.2s infinite cubic-bezier(0.1, 0.8, 0.3, 1) 0.7s; border-color: var(--success-color); }
        .voice-container.active .ring:nth-child(3) { width: 100%; height: 100%; animation: ripplePremium 2.2s infinite cubic-bezier(0.1, 0.8, 0.3, 1) 1.4s; border-color: var(--success-color); }
        
        /* Processing Animation */
        .voice-container.processing .ring:nth-child(1) { width: 100%; height: 100%; animation: pulseRing 1.5s infinite alternate; border-color: var(--accent-color); }
        
        /* Speaking Animation */
        .voice-container.speaking .ring:nth-child(1) { width: 100%; height: 100%; animation: ripplePremium 1.2s infinite ease-out; border-color: var(--cyan); }
        .voice-container.speaking .ring:nth-child(2) { width: 100%; height: 100%; animation: ripplePremium 1.2s infinite ease-out 0.4s; border-color: var(--cyan); }

        @keyframes ripplePremium { 
            0% { transform: scale(0.75); opacity: 0.9; box-shadow: inset 0 0 20px currentColor, 0 0 20px currentColor; } 
            100% { transform: scale(1.85); opacity: 0; box-shadow: inset 0 0 0px transparent, 0 0 0px transparent; } 
        }
        @keyframes pulseRing {
            0% { transform: scale(0.85); opacity: 0.5; box-shadow: inset 0 0 20px currentColor, 0 0 20px currentColor;}
            100% { transform: scale(1.15); opacity: 0.9; box-shadow: inset 0 0 40px currentColor, 0 0 40px currentColor;}
        }

        .ai-avatar { 
            width: 140px; 
            height: 140px; 
            border-radius: 50%; 
            background: rgba(20, 31, 48, 0.8); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 2px solid rgba(255,255,255,0.1); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            z-index: 10; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.6), inset 0 2px 10px rgba(255,255,255,0.1); 
            transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1); 
        }
        .voice-container.active .ai-avatar { 
            border-color: rgba(16, 185, 129, 0.5); 
            box-shadow: 0 0 40px var(--success-glow), inset 0 0 20px rgba(16, 185, 129, 0.2); 
            transform: scale(1.04);
        }
        .voice-container.processing .ai-avatar {
            border-color: rgba(13, 148, 136, 0.5); 
            box-shadow: 0 0 40px var(--accent-glow), inset 0 0 20px rgba(13, 148, 136, 0.2); 
        }
        .voice-container.speaking .ai-avatar {
            border-color: rgba(6, 182, 212, 0.5); 
            box-shadow: 0 0 40px rgba(6, 182, 212, 0.4), inset 0 0 20px rgba(6, 182, 212, 0.2); 
            transform: scale(1.08);
        }

        .ai-avatar .material-symbols-outlined { 
            font-size: 64px; 
            color: var(--text-secondary); 
            transition: color 0.3s; 
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .voice-container.active .ai-avatar .material-symbols-outlined { color: var(--success-color); text-shadow: 0 0 20px var(--success-color); }
        .voice-container.processing .ai-avatar .material-symbols-outlined { color: var(--accent-color); text-shadow: 0 0 20px var(--accent-color); }
        .voice-container.speaking .ai-avatar .material-symbols-outlined { color: var(--cyan); text-shadow: 0 0 20px var(--cyan); }
        
        .call-status { 
            font-size: 1.3em; 
            font-weight: 700; 
            margin-bottom: 8px; 
            color: #ffffff; 
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .call-sub-status { 
            font-size: 0.9em; 
            color: var(--text-secondary); 
            min-height: 24px;
            max-width: 320px;
            line-height: 1.4;
            margin-bottom: 24px;
        }

        /* Live Caption Box */
        .live-caption-box { 
            background: rgba(15, 23, 36, 0.7); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1); 
            padding: 16px 24px; 
            border-radius: 20px; 
            width: 100%; 
            max-width: 400px; 
            min-height: 80px; 
            max-height: 120px; 
            overflow-y: auto; 
            font-size: 0.95em; 
            line-height: 1.6; 
            color: var(--text-main); 
            text-align: left; 
            display: none; 
            flex-direction: column; 
            gap: 8px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 2px 10px rgba(0,0,0,0.2);
        }
        .live-caption-box.active { display: flex; }
        .caption-ai { color: var(--success-color); font-weight: 500; }
        .caption-user { color: #ffffff; opacity: 0.9; }
        .caption-interim { color: var(--text-secondary); font-style: italic; }

        .orb { 
            width: 12px; 
            height: 12px; 
            border-radius: 50%; 
            background: var(--success-color); 
            display: inline-block; 
            box-shadow: 0 0 12px var(--success-color); 
            animation: pulseOrb 1.6s infinite ease-in-out; 
        }
        @keyframes pulseOrb { 
            0% { transform: scale(0.9); opacity: 0.8; } 
            50% { transform: scale(1.2); opacity: 1; } 
            100% { transform: scale(0.9); opacity: 0.8; } 
        }
        .orb.processing { background: var(--accent-color); box-shadow: 0 0 12px var(--accent-color); }
        .orb.speaking { background: var(--cyan); box-shadow: 0 0 12px var(--cyan); animation: pulseOrb 0.8s infinite ease-in-out; }
        .orb.error { background: var(--meena-red); box-shadow: 0 0 12px var(--meena-red); animation: none; }

        .call-controls { 
            display: flex; 
            gap: 24px; 
            justify-content: center; 
            width: 100%; 
            padding-bottom: 10px;
        }
        .btn-call { 
            width: 72px; 
            height: 72px; 
            border-radius: 50%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            border: none; 
            cursor: pointer; 
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.2s; 
            color: #ffffff; 
            box-shadow: 0 8px 30px rgba(0,0,0,0.5); 
        }
        .btn-call:active { transform: scale(0.9); }
        .btn-call.start { 
            background: linear-gradient(135deg, var(--success-color), #059669); 
            box-shadow: 0 8px 30px var(--success-glow); 
            display: none; 
        }
        .btn-call.end { 
            background: linear-gradient(135deg, var(--meena-red), #b91c1c); 
            box-shadow: 0 8px 30px rgba(239, 68, 68, 0.4); 
        }
        .btn-call .material-symbols-outlined { font-size: 36px; }

    </style>
</head>
<body>

    <!-- GLU 3D Animated Background -->
    <div class="ambient-bg">
        <div class="bg-orb bg-orb-1"></div>
        <div class="bg-orb bg-orb-2"></div>
        <div class="bg-orb bg-orb-3"></div>
    </div>

    <header>
        <div class="brand-container" onclick="triggerHaptic([20]); window.location.href='inventory_2.html'">
            <img src="icon.png" alt="Icon" class="logo-img" onerror="this.style.display='none'">
            <div class="brand-text">
                <span class="brand-title"><span class="meena">Meena</span> <span class="marketing">Marketing</span></span>
                <span class="goorac">AI Voice & Stock Engine</span>
            </div>
        </div>
        
        <!-- Dynamic Header Button: Headphone to call, Cross to close -->
        <div class="header-action-btn" id="headerBtn" onclick="toggleMode()">
            <span class="material-symbols-outlined" id="headerIcon" style="color: var(--accent-color);">headphones</span>
        </div>
    </header>

    <!-- CHAT INTERFACE -->
    <div class="view-container active" id="viewChat">
        <div class="chat-history" id="chatHistory">
            <!-- Initial content generated by JS -->
        </div>
        <div class="chat-input-area">
            <div class="chat-input-wrapper">
                <textarea id="chatInput" rows="1" placeholder="Message Meena AI..." oninput="autoResize(this)"></textarea>
                <button class="btn-send" id="btnSend" onclick="sendChatMessage()">
                    <span class="material-symbols-outlined">arrow_upward</span>
                </button>
            </div>
        </div>
    </div>

    <!-- PURE VOICE CALL INTERFACE -->
    <div class="view-container" id="viewCall">
        <div class="call-wrapper">
            <div class="voice-top-stage">
                <div class="voice-container" id="voiceContainer">
                    <div class="ring"></div>
                    <div class="ring"></div>
                    <div class="ring"></div>
                    <div class="ai-avatar" id="aiAvatar">
                        <span class="material-symbols-outlined" id="avatarIcon">graphic_eq</span>
                    </div>
                </div>
                
                <div class="call-status" id="callStatus">Ready to Connect</div>
                <div class="call-sub-status" id="callSubStatus">Initializing secure line...</div>

                <div class="live-caption-box" id="liveCaptionBox">
                    <div id="liveCaptionContent"></div>
                </div>
            </div>

            <div class="call-controls">
                <button class="btn-call start" id="btnStartCall" onclick="startCall()">
                    <span class="material-symbols-outlined">call</span>
                </button>
                <button class="btn-call end" id="btnEndCall" onclick="exitVoiceMode()">
                    <span class="material-symbols-outlined">call_end</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        // BACKEND CONFIGURATION
        const BACKEND_URL = 'https://shiva757-meenaai.hf.space';
        
        // CONVERSATION MEMORY: Retain 100 max, but send only 20 to the backend
        let conversationHistory = [];
        const MAX_HISTORY = 100;

        // UI ELEMENTS
        const viewChat = document.getElementById('viewChat');
        const viewCall = document.getElementById('viewCall');
        
        const chatHistoryEl = document.getElementById('chatHistory');
        const chatInput = document.getElementById('chatInput');
        const btnSend = document.getElementById('btnSend');

        const voiceContainer = document.getElementById('voiceContainer');
        const callStatus = document.getElementById('callStatus');
        const callSubStatus = document.getElementById('callSubStatus');
        const liveCaptionBox = document.getElementById('liveCaptionBox');
        const liveCaptionContent = document.getElementById('liveCaptionContent');
        const avatarIcon = document.getElementById('avatarIcon');
        const btnStartCall = document.getElementById('btnStartCall');
        const btnEndCall = document.getElementById('btnEndCall');
        const headerIcon = document.getElementById('headerIcon');

        let currentMode = 'chat';

        // ==========================================
        // WEB SPEECH API (STT & TTS) STATE
        // ==========================================
        let recognition = null;
        let synth = window.speechSynthesis;
        let voiceState = 'idle'; // idle, listening, processing, speaking
        let isVoiceModeActive = false;

        // THINKING ANIMATION: 20 Array Texts
        let thinkingInterval;
        const thinkingPhrases = [
            "Thinking...", 
            "Analyzing query...", 
            "Checking inventory...", 
            "Scanning database...", 
            "Crunching numbers...", 
            "Reviewing stock levels...", 
            "Verifying prices...", 
            "Formulating response...", 
            "Fetching details...", 
            "Looking up models...", 
            "Calculating totals...", 
            "Processing request...", 
            "Consulting knowledge base...", 
            "Gathering data...", 
            "Evaluating options...", 
            "Synthesizing answer...", 
            "Retrieving records...", 
            "Cross-referencing items...", 
            "Preparing output...", 
            "Almost ready..."
        ];

        // ==========================================
        // HAPTIC FEEDBACK (VIBRATE ENGINE)
        // ==========================================
        function triggerHaptic(pattern = [30]) {
            if (navigator.vibrate) {
                try { navigator.vibrate(pattern); } catch(e) {}
            }
        }

        // ==========================================
        // 1. UI & NAVIGATION MANAGEMENT
        // ==========================================
        function toggleMode() {
            if (currentMode === 'chat') {
                triggerHaptic([40, 50, 40, 50, 40]); // Vibrate 3 times
                enterVoiceMode();
            } else {
                exitVoiceMode();
            }
        }

        function enterVoiceMode() {
            currentMode = 'voice';
            viewChat.classList.remove('active');
            viewCall.classList.add('active');
            
            headerIcon.innerText = 'close';
            headerIcon.style.color = 'var(--meena-red)';
            history.pushState({ view: 'voice' }, '', '#voice');

            // Prime TTS Engine on user interaction to bypass mobile restrictions
            let primer = new SpeechSynthesisUtterance('');
            primer.volume = 0;
            synth.speak(primer);

            startCall();
        }

        function exitVoiceMode() {
            triggerHaptic([30, 40]);
            currentMode = 'chat';
            
            stopCall();
            
            viewCall.classList.remove('active');
            viewChat.classList.add('active');
            
            headerIcon.innerText = 'headphones';
            headerIcon.style.color = 'var(--accent-color)';
            
            if (window.location.hash === '#voice') {
                history.back();
            }
        }

        window.addEventListener('popstate', (e) => {
            if (currentMode === 'voice') exitVoiceMode();
        });

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = (textarea.scrollHeight < 100 ? textarea.scrollHeight : 100) + 'px';
        }

        // Markdown Stripper for TTS (Removes *, #, _, ` but keeps ₹ and text)
        function stripMarkdownForTTS(rawText) {
            let cleanText = rawText;
            cleanText = cleanText.replace(/[*_#`~>|-]/g, '');
            return cleanText;
        }

        // Professional Typing Engine that preserves HTML structure
        async function typeWriterHTML(element, htmlContent) {
            element.innerHTML = '';
            element.classList.add('typing-cursor');
            
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = htmlContent;
            
            async function processNode(node, parent) {
                if (node.nodeType === Node.TEXT_NODE) {
                    const text = node.textContent;
                    const textNode = document.createTextNode('');
                    parent.appendChild(textNode);
                    
                    for (let i = 0; i < text.length; i++) {
                        textNode.textContent += text[i];
                        chatHistoryEl.scrollTop = chatHistoryEl.scrollHeight;
                        // Ultra fast typing speed for professional feel
                        await new Promise(r => setTimeout(r, 8)); 
                    }
                } else if (node.nodeType === Node.ELEMENT_NODE) {
                    const newEl = document.createElement(node.tagName);
                    for (let attr of node.attributes) {
                        newEl.setAttribute(attr.name, attr.value);
                    }
                    parent.appendChild(newEl);
                    for (let child of Array.from(node.childNodes)) {
                        await processNode(child, newEl);
                    }
                }
            }
            
            for (let child of Array.from(tempDiv.childNodes)) {
                await processNode(child, element);
            }
            
            element.classList.remove('typing-cursor');
        }

        // Advanced Chat Rendering with Markdown & Gemini Actions
        async function appendMessageToUI(role, text, isError = false, animate = false) {
            if(!text) return;
            const div = document.createElement('div');
            
            if (isError) {
                div.className = 'msg-bubble msg-error';
                div.innerText = text;
                chatHistoryEl.appendChild(div);
                chatHistoryEl.scrollTop = chatHistoryEl.scrollHeight;
            } else if (role === 'user') {
                div.className = 'msg-bubble msg-user';
                div.innerText = text; // Raw text for user
                chatHistoryEl.appendChild(div);
                chatHistoryEl.scrollTop = chatHistoryEl.scrollHeight;
            } else {
                div.className = 'msg-bubble msg-ai';
                
                // Content Wrapper for Markdown
                const contentDiv = document.createElement('div');
                contentDiv.className = 'msg-content';
                
                // Parse markdown to HTML
                let parsedHTML = marked.parse(text);
                
                // If not animating, insert HTML directly so we can attach buttons instantly
                contentDiv.innerHTML = parsedHTML;
                
                // Fix Code Blocks by wrapping them safely to prevent horizontal scroll bleeding
                contentDiv.querySelectorAll('pre').forEach(pre => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'code-wrapper';
                    
                    const header = document.createElement('div');
                    header.className = 'code-header';
                    
                    // Detect language if possible, else default to CODE
                    let lang = "CODE";
                    const codeEl = pre.querySelector('code');
                    if (codeEl && codeEl.className) {
                        const match = codeEl.className.match(/language-(\w+)/);
                        if (match) lang = match[1];
                    }
                    header.innerHTML = `<span class="code-lang"><span class="material-symbols-outlined" style="font-size: 16px;">code</span> ${lang}</span>`;
                    
                    const copyBtn = document.createElement('button');
                    copyBtn.className = 'copy-code-btn';
                    copyBtn.innerHTML = '<span class="material-symbols-outlined">content_copy</span> Copy';
                    copyBtn.onclick = () => {
                        triggerHaptic([20]);
                        const codeText = pre.querySelector('code').innerText;
                        navigator.clipboard.writeText(codeText);
                        copyBtn.innerHTML = '<span class="material-symbols-outlined">check</span> Copied!';
                        setTimeout(() => copyBtn.innerHTML = '<span class="material-symbols-outlined">content_copy</span> Copy', 2000);
                    };
                    
                    header.appendChild(copyBtn);
                    pre.parentNode.insertBefore(wrapper, pre);
                    wrapper.appendChild(header);
                    wrapper.appendChild(pre);
                });

                // Bottom Actions (Gemini-Style: Copy & Speak)
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'msg-actions';
                
                const speakBtn = document.createElement('span');
                speakBtn.className = 'material-symbols-outlined action-icon';
                speakBtn.innerText = 'volume_up';
                speakBtn.title = 'Speak text';
                speakBtn.onclick = () => {
                    triggerHaptic([20]);
                    playTTSResponse(text, true); // Play manually
                };

                const copyBtn = document.createElement('span');
                copyBtn.className = 'material-symbols-outlined action-icon';
                copyBtn.innerText = 'content_copy';
                copyBtn.title = 'Copy text';
                copyBtn.onclick = () => {
                    triggerHaptic([20]);
                    navigator.clipboard.writeText(text);
                    copyBtn.style.color = 'var(--success-color)';
                    setTimeout(() => copyBtn.style.color = 'var(--text-secondary)', 2000);
                };

                actionsDiv.appendChild(speakBtn);
                actionsDiv.appendChild(copyBtn);
                
                div.appendChild(contentDiv);
                div.appendChild(actionsDiv);
                chatHistoryEl.appendChild(div);
                chatHistoryEl.scrollTop = chatHistoryEl.scrollHeight;

                if (animate) {
                    // Cache the fully structured HTML (including our injected code wrappers)
                    const fullHTML = contentDiv.innerHTML;
                    // Run typewriter over it
                    await typeWriterHTML(contentDiv, fullHTML);
                }
            }
        }

        function saveToHistory(role, text) {
            if(!text) return;
            conversationHistory.push({ role, parts: [{ text }] });
            if (conversationHistory.length > MAX_HISTORY) {
                conversationHistory.shift();
            }
        }

        // Initialize first message dynamically
        function initChat() {
            chatHistoryEl.innerHTML = '';
            appendMessageToUI('model', 'வணக்கம்! நான் **மீனா மார்க்கெட்டிங் AI**. கடையில என்ன ஸ்டாக் இருக்குன்னு பாக்கணுமா?', false, false);
        }
        window.onload = initChat;

        // ==========================================
        // 2. TEXT CHAT MODE (REST API & LOADING UI)
        // ==========================================
        function showThinkingBubble() {
            const div = document.createElement('div');
            div.id = "activeThinkingBubble";
            div.className = "msg-bubble msg-ai thinking-bubble";
            div.innerHTML = `<span class="material-symbols-outlined sparkle-icon">auto_awesome</span> <span id="thinkText">Thinking...</span>`;
            chatHistoryEl.appendChild(div);
            chatHistoryEl.scrollTop = chatHistoryEl.scrollHeight;
            
            let i = 0;
            thinkingInterval = setInterval(() => {
                i = (i + 1) % thinkingPhrases.length;
                const txt = document.getElementById('thinkText');
                if (txt) txt.innerText = thinkingPhrases[i];
            }, 800);
        }

        function hideThinkingBubble() {
            clearInterval(thinkingInterval);
            const bubble = document.getElementById('activeThinkingBubble');
            if (bubble) bubble.remove();
        }

        async function sendChatMessage(overrideText = null) {
            const text = overrideText !== null ? overrideText : chatInput.value.trim();
            if (!text) return;

            if (overrideText === null) triggerHaptic([35]);

            appendMessageToUI('user', text);
            saveToHistory('user', text);
            
            chatInput.value = '';
            chatInput.style.height = 'auto';
            btnSend.disabled = true;

            showThinkingBubble();

            try {
                // Core Rule: Send ONLY the last 20 messages as context to backend
                const recentHistory = conversationHistory.slice(-21, -1);

                const payload = {
                    message: text,
                    history: recentHistory
                };

                const response = await fetch(`${BACKEND_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                hideThinkingBubble();

                if (!response.ok || data.error) {
                    let errMsg = data.error?.message || data.error || "API error occurred.";
                    appendMessageToUI('model', `Server Error: ${errMsg}`, true);
                    return null;
                }
                
                const aiText = data.candidates[0].content.parts[0].text;
                // Pass animate=true for the professional typing effect
                await appendMessageToUI('model', aiText, false, true);
                saveToHistory('model', aiText);
                return aiText;

            } catch (err) {
                hideThinkingBubble();
                appendMessageToUI('model', `Network Error: ${err.message}`, true);
                return null;
            } finally {
                btnSend.disabled = false;
            }
        }

        chatInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendChatMessage();
            }
        });

        // ==========================================
        // 3. VOICE CALL ENGINE (STT -> REST -> TTS Loop)
        // ==========================================
        function updateVoiceUI() {
            voiceContainer.className = 'voice-container';
            let statusHtml = '';
            let subStatusText = '';

            if (voiceState === 'listening') {
                voiceContainer.classList.add('active');
                avatarIcon.innerText = 'mic';
                statusHtml = "<span class='orb'></span> Listening...";
                subStatusText = "Speak naturally. I'm listening.";
            } else if (voiceState === 'processing') {
                voiceContainer.classList.add('processing');
                avatarIcon.innerText = 'auto_awesome';
                statusHtml = "<span class='orb processing'></span> Processing";
                subStatusText = "Working on your request...";
            } else if (voiceState === 'speaking') {
                voiceContainer.classList.add('speaking');
                avatarIcon.innerText = 'graphic_eq';
                statusHtml = "<span class='orb speaking'></span> Speaking";
                subStatusText = "AI is responding.";
            } else {
                avatarIcon.innerText = 'mic_off';
                statusHtml = "Call Ended";
                subStatusText = "Tap the cross to exit.";
            }

            callStatus.innerHTML = statusHtml;
            callSubStatus.innerText = subStatusText;
        }

        function updateCaption(role, text, isInterim = false) {
            if (role === "Meena") {
                // Strip markdown for clean captions
                const cleanCap = stripMarkdownForTTS(text);
                liveCaptionContent.innerHTML = `<span class="caption-ai">${cleanCap}</span>`;
            } else if (role === "User") {
                const colorClass = isInterim ? "caption-interim" : "caption-user";
                liveCaptionContent.innerHTML = `<span class="${colorClass}">${text}</span>`;
            }
            liveCaptionBox.scrollTop = liveCaptionBox.scrollHeight;
        }

        function startCall() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                callStatus.innerHTML = "<span class='orb error'></span> Not Supported";
                callSubStatus.innerText = "Voice chat is not supported on this browser.";
                return;
            }

            isVoiceModeActive = true;
            liveCaptionBox.classList.add('active');
            liveCaptionContent.innerHTML = "";
            btnStartCall.style.display = 'none';
            btnEndCall.style.display = 'flex';

            recognition = new SpeechRecognition();
            recognition.continuous = false; // Stop automatically when user pauses
            recognition.interimResults = true;
            recognition.lang = 'ta-IN'; // Tamil/Tanglish processing

            recognition.onstart = () => {
                if(!isVoiceModeActive) return;
                voiceState = 'listening';
                updateVoiceUI();
                updateCaption("User", "Listening...", true);
            };

            recognition.onresult = (event) => {
                if(!isVoiceModeActive) return;
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                if (interimTranscript) {
                    updateCaption("User", interimTranscript, true);
                }
                if (finalTranscript) {
                    updateCaption("User", finalTranscript, false);
                    recognition.stop();
                    processVoiceTurn(finalTranscript);
                }
            };

            recognition.onend = () => {
                // If it ended automatically (due to silence) and we aren't doing anything else, restart it
                if (isVoiceModeActive && voiceState === 'listening') {
                    try { recognition.start(); } catch(e) {}
                }
            };

            recognition.onerror = (event) => {
                if (event.error === 'no-speech') return; // Ignore silent timeouts
                console.error("Speech Recognition Error:", event.error);
                if (event.error === 'not-allowed') {
                    callStatus.innerHTML = "<span class='orb error'></span> Mic Denied";
                    callSubStatus.innerText = "Please grant microphone permissions.";
                    stopCall();
                }
            };

            try { recognition.start(); } catch(e) {}
        }

        async function processVoiceTurn(userText) {
            if(!isVoiceModeActive) return;
            voiceState = 'processing';
            updateVoiceUI();
            
            // Loop through 20 thinking phrases in the caption box
            let i = 0;
            liveCaptionContent.innerHTML = `<span style="color:var(--accent-color)">${thinkingPhrases[i]}</span>`;
            const thinkingCycle = setInterval(() => {
                i = (i + 1) % thinkingPhrases.length;
                liveCaptionContent.innerHTML = `<span style="color:var(--accent-color); font-style:italic;">${thinkingPhrases[i]}</span>`;
            }, 600);

            // Fetch the response using the exact same Chat logic
            const aiResponse = await sendChatMessage(userText);
            
            clearInterval(thinkingCycle);

            if (!aiResponse) {
                updateCaption("Meena", "Sorry, network error.", false);
                setTimeout(() => {
                    if (isVoiceModeActive) {
                        voiceState = 'listening';
                        try { recognition.start(); } catch(e) {}
                    }
                }, 2000);
                return;
            }

            playTTSResponse(aiResponse, false);
        }

        function playTTSResponse(text, isManual = false) {
            if(!isVoiceModeActive && !isManual) return;
            
            if(!isManual) {
                voiceState = 'speaking';
                updateVoiceUI();
                updateCaption("Meena", text, false);
            }

            synth.cancel(); // Clear any queued speech

            // Strip Markdown formatting (*, #, `) before speaking, keeping words and ₹
            const cleanText = stripMarkdownForTTS(text);
            const utterance = new SpeechSynthesisUtterance(cleanText);
            
            utterance.lang = 'ta-IN'; // Ensure Tamil/Tanglish pronunciation
            utterance.rate = 1.15; // Slightly faster for natural conversation

            if(!isManual) {
                utterance.onend = () => {
                    if (isVoiceModeActive) {
                        voiceState = 'listening';
                        try { recognition.start(); } catch(e) {}
                    }
                };

                utterance.onerror = () => {
                    if (isVoiceModeActive) {
                        voiceState = 'listening';
                        try { recognition.start(); } catch(e) {}
                    }
                };
            }

            synth.speak(utterance);
        }

        function stopCall() {
            isVoiceModeActive = false;
            voiceState = 'idle';
            
            if (recognition) {
                recognition.onend = null; // Prevent restart loops
                recognition.stop();
            }
            synth.cancel(); // Stop talking instantly
            
            voiceContainer.classList.remove('active', 'processing', 'speaking');
            liveCaptionBox.classList.remove('active');
            
            btnStartCall.style.display = 'flex';
            btnEndCall.style.display = 'none';
        }
    </script>
</body>
</html>
