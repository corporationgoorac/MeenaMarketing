<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Price - Meena Marketing</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b111a">
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* Shared Core Theme */
        :root {
            --bg-color: #0b111a; 
            --surface-color: #131b26; 
            --surface-hover: #1b2636;
            --text-color: #ffffff;
            --text-secondary: #94a3b8;
            --meena-red: #ef4444; 
            --marketing-white: #ffffff;
            --accent-color: #0d9488; 
            --success-color: #10b981; 
            --warning-color: #f59e0b;
            --nav-bg: rgba(19, 27, 38, 0.85); 
            --input-border: #334155;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -2px rgba(0, 0, 0, 0.25);
        }

        html, body { height: 100%; margin: 0; padding: 0; width: 100%; overflow-x: hidden; scroll-behavior: smooth; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
        
        *, *::before, *::after { box-sizing: border-box; }
        .no-select { user-select: none; -webkit-user-select: none; }

        /* Header */
        header { background-color: #212121; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding: 16px 18px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 500; border-bottom: 1px solid rgba(255,255,255,0.08); box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
        .back-btn { background: none; border: none; color: white; cursor: pointer; display: flex; padding: 8px; border-radius: 50%; transition: background 0.2s; margin-left: -8px;}
        .back-btn:hover { background: rgba(255,255,255,0.1); }
        header h1 { margin: 0; margin-right: auto; font-size: 1.25em; font-weight: 600; letter-spacing: -0.01em; }
        
        /* Sleek Top-Right Add Button */
        .action-btn { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1); color: white; cursor: pointer; display: flex; padding: 8px; border-radius: 50%; transition: all 0.2s ease; margin-left: 0; margin-right: 0; }
        .action-btn:hover { background: rgba(255, 255, 255, 0.15); transform: scale(1.05); border-color: rgba(255, 255, 255, 0.2); }
        .action-btn:active { transform: scale(0.95); }

        /* Added to gracefully handle multiple action buttons dynamically */
        header .action-btn:not(:last-child) { margin-right: 0; margin-left: 0; }
        header .action-btn:last-child { margin-left: 0; margin-right: -8px; }

        /* Main Container with Entrance Animation */
        .container { padding: 25px 20px; max-width: 600px; margin: 0 auto; width: 100%; animation: fadeInSlideUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; opacity: 0; transform: translateY(15px); }

        @keyframes fadeInSlideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Sleek Card - Enhanced with subtle gradient and better shadows */
        .ask-card { background: linear-gradient(145deg, var(--surface-color), #16202d); border: 1px solid var(--input-border); border-top: 1px solid rgba(255, 255, 255, 0.12); border-radius: 20px; padding: 25px; box-shadow: var(--shadow-lg), 0 20px 40px rgba(0,0,0,0.3); position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 20px; width: 100%; transition: transform 0.3s ease, box-shadow 0.3s ease; }
        .ask-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg), 0 25px 50px rgba(0,0,0,0.4); }
        
        /* Top Row: Name, Model, Qty */
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; flex-wrap: nowrap; }
        .prod-info { flex-grow: 1; min-width: 0; }
        /* Added dynamic resizing and forced wrap for extremely long names */
        .prod-name { font-size: clamp(1.1em, 5vw, 1.35em); font-weight: 700; color: var(--marketing-white); line-height: 1.3; margin-bottom: 8px; word-wrap: break-word; overflow-wrap: break-word; hyphens: auto; }
        /* Added max-width and normal whitespace for long models */
        .prod-model { font-size: 0.8em; font-weight: 600; color: var(--accent-color); background: rgba(13, 148, 136, 0.1); padding: 6px 12px; border-radius: 8px; display: inline-block; border: 1px solid rgba(13, 148, 136, 0.2); letter-spacing: 0.5px; max-width: 100%; white-space: normal; word-wrap: break-word; overflow-wrap: break-word; }
        
        /* Capped width on qty so it doesn't squish the name out of existence */
        .prod-qty { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); padding: 12px 18px; border-radius: 14px; text-align: center; flex-shrink: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; max-width: 35%; min-width: 70px; overflow: hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);}
        .qty-lbl { font-size: 0.65em; color: var(--text-secondary); text-transform: uppercase; font-weight: 700; letter-spacing: 1px; margin-bottom: 4px; }
        .qty-val { font-size: clamp(1em, 5vw, 1.4em); font-weight: 800; color: white; word-break: break-word; overflow-wrap: break-word; }

        /* Middle Row: MRP and Base Price */
        /* Added wrap to push elements to new line if numbers are millions */
        .price-row { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-top: 1px solid rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.05); flex-wrap: wrap; gap: 15px; }
        .price-col { display: flex; flex-direction: column; gap: 5px; min-width: 100px; max-width: 48%; }
        .price-lbl { font-size: 0.75em; color: var(--text-secondary); text-transform: uppercase; font-weight: 600; letter-spacing: 1px; }
        .price-mrp { font-size: clamp(0.9em, 4vw, 1.1em); color: var(--text-secondary); text-decoration: line-through; font-weight: 500; word-wrap: break-word; overflow-wrap: break-word; }
        .price-base { font-size: clamp(1.1em, 5vw, 1.4em); color: var(--success-color); font-weight: 700; text-align: right; word-wrap: break-word; overflow-wrap: break-word; }

        /* Bottom: My Rate (Huge) */
        .my-rate-container { text-align: center; padding-top: 10px; width: 100%; overflow: hidden; }
        .my-rate-lbl { font-size: 0.85em; color: #a855f7; text-transform: uppercase; font-weight: 700; letter-spacing: 2px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        /* Dynamic Clamp fixes the cut-off zero issue: it scales from 2.5em to 4.5em based on screen size, and word-breaks if absolutely necessary */
        .my-rate-val { font-size: clamp(2.5em, 12vw, 4.5em); font-weight: 800; background: linear-gradient(135deg, #a855f7, #e879f9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1.1; filter: drop-shadow(0 10px 20px rgba(168, 85, 247, 0.4)); letter-spacing: -2px; word-wrap: break-word; overflow-wrap: break-word; word-break: break-word; max-width: 100%; }

        /* Timestamp Footer */
        .time-footer { text-align: center; font-size: 0.75em; color: var(--text-secondary); margin-top: 20px; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 500;}

        /* Skeleton Animations */
        .skeleton { background: #1e293b; background-image: linear-gradient(90deg, rgba(255,255,255,0) 0px, rgba(255,255,255,0.06) 40px, rgba(255,255,255,0) 80px); background-size: 200% 100%; animation: shimmer 1.5s infinite linear; border-radius: 6px; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

        /* Expired / Empty State */
        .empty-state { display: none; flex-direction: column; align-items: center; text-align: center; padding: 40px 20px; background: linear-gradient(145deg, var(--surface-color), #16202d); border: 1px dashed var(--input-border); border-radius: 20px; margin-top: 20px; box-shadow: var(--shadow-md); }
        .empty-state .material-symbols-outlined { font-size: 4em; color: var(--text-secondary); opacity: 0.5; margin-bottom: 15px; }
        .empty-state h3 { margin: 0 0 10px 0; color: white; font-weight: 600; }
        .empty-state p { margin: 0; color: var(--text-secondary); font-size: 0.9em; line-height: 1.5; }

        /* Floating Attendance Button - Redesigned to signify "Attendance" */
        @keyframes pulse-soft {
            0% { box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4), 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4), 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4), 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .fab-attendance {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: linear-gradient(135deg, var(--success-color), #047857);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            -webkit-tap-highlight-color: transparent;
            animation: pulse-soft 2.5s infinite;
        }
        .fab-attendance:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.6);
            animation: none; /* Stops pulse on hover for cleaner interaction */
        }
        .fab-attendance:active {
            transform: translateY(0) scale(0.95);
        }
        .fab-attendance svg {
            width: 28px;
            height: 28px;
        }
    </style>
</head>
<body>

    <header class="no-select">
        <button class="back-btn" onclick="if(navigator.vibrate) navigator.vibrate(30); history.back();">
            <svg class="material-symbols-outlined" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 -960 960 960" fill="currentColor"><path d="m313-440 224 224-57 56-320-320 320-320 57 56-224 224h487v80H313Z"/></svg>
        </button>
        <h1>My Price</h1>
        
        <button class="action-btn" onclick="if(navigator.vibrate) navigator.vibrate(30); window.location.href='delete.html';">
            <svg class="material-symbols-outlined" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 -960 960 960" fill="currentColor"><path d="M320-240h320v-80H320v80Zm0-160h320v-80H320v80ZM240-80q-33 0-56.5-23.5T160-160v-640q0-33 23.5-56.5T240-880h320l80 80h160q33 0 56.5 23.5T880-720v560q0 33-23.5 56.5T800-80H240Zm280-400v-320H240v640h560v-560H520ZM240-800v640-640Z"/></svg>
        </button>

        <button class="action-btn" onclick="if(navigator.vibrate) navigator.vibrate(30); window.location.href='custombill.html';">
            <svg class="material-symbols-outlined" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 -960 960 960" fill="currentColor"><path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h357l-80 80H200v560h560v-278l80-80v358q0 33-23.5 56.5T760-120H200Zm280-360ZM360-360v-170l367-367q12-12 27-18t30-6q16 0 32 6t28 18l56 57q11 12 17 26.5t6 29.5q0 15-5.5 29.5T897-728L530-360H360Zm481-424-56-56 56 56ZM440-440h56l232-232-28-28-29-28-231 231v57Zm260-260-29-28 29 28 28 28-28-28Z"/></svg>
        </button>

        <button class="action-btn" onclick="if(navigator.vibrate) navigator.vibrate(30); window.location.href='abc.html';">
            <svg class="material-symbols-outlined" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 -960 960 960" fill="currentColor"><path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z"/></svg>
        </button>
    </header>

    <div class="container" id="mainContainer">
        
        <div class="ask-card" id="skeletonCard">
            <div class="card-header">
                <div class="prod-info" style="width: 100%;">
                    <div class="skeleton" style="height: 32px; width: 80%; margin-bottom: 12px;"></div>
                    <div class="skeleton" style="height: 24px; width: 40%; border-radius: 8px;"></div>
                </div>
                <div class="skeleton" style="height: 65px; width: 65px; border-radius: 14px;"></div>
            </div>
            
            <div class="price-row">
                <div class="price-col">
                    <div class="skeleton" style="height: 14px; width: 40px; margin-bottom: 8px;"></div>
                    <div class="skeleton" style="height: 22px; width: 80px;"></div>
                </div>
                <div class="price-col" style="align-items: flex-end;">
                    <div class="skeleton" style="height: 14px; width: 70px; margin-bottom: 8px;"></div>
                    <div class="skeleton" style="height: 28px; width: 100px;"></div>
                </div>
            </div>

            <div class="my-rate-container">
                <div class="skeleton" style="height: 16px; width: 120px; margin: 0 auto 15px;"></div>
                <div class="skeleton" style="height: 80px; width: 220px; margin: 0 auto; border-radius: 16px;"></div>
            </div>
        </div>

        <div class="ask-card" id="dataCard" style="display: none;">
            <div class="card-header">
                <div class="prod-info">
                    <div class="prod-name" id="uiName">--</div>
                    <div class="prod-model" id="uiModel">--</div>
                </div>
                <div class="prod-qty">
                    <span class="qty-lbl">Stock</span>
                    <span class="qty-val" id="uiQty">--</span>
                </div>
            </div>
            
            <div class="price-row">
                <div class="price-col" style="align-items: flex-start;">
                    <span class="price-lbl">MRP</span>
                    <span class="price-mrp" id="uiMrp">₹--</span>
                </div>
                <div class="price-col" style="align-items: flex-end; text-align: right;">
                    <span class="price-lbl">Base Price</span>
                    <span class="price-base" id="uiBase">₹--</span>
                </div>
            </div>

            <div class="my-rate-container">
                <div class="my-rate-lbl">
                    <svg class="material-symbols-outlined" style="font-size: 18px;" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 -960 960 960" fill="currentColor"><path d="M480-120q-112-32-181-121.5T230-440v-240l250-94 250 94v240q0 108-69 197.5T480-120Zm0-86q79-28 131.5-98.5T672-440v-184l-192-72-192 72v184q0 81 52.5 151.5T480-206Z"/></svg>
                    Confidential Rate
                </div>
                <div class="my-rate-val" id="uiRate">₹--</div>
            </div>
            
            <div class="time-footer">
                <svg class="material-symbols-outlined" style="font-size: 16px;" xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 -960 960 960" fill="currentColor"><path d="M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm110-150 56-56-126-126v-188h-80v222l150 150ZM480-480Z"/></svg>
                Requested: <span id="uiTime">Just now</span>
            </div>
        </div>

        <div class="empty-state" id="emptyState">
            <span class="material-symbols-outlined" id="emptyIcon" style="display:flex; justify-content:center; align-items:center;">
                <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 -960 960 960" fill="currentColor"><path d="M684-136 136-684l56-56 548 548-56 56Zm-83-201-58-58q-12 11-28 18.5T480-360q-50 0-85-35t-35-85q0-19 7.5-35t18.5-28l-58-58q-21 21-34.5 49T280-480q0 83 58.5 141.5T480-280q33 0 61-13.5t49-34.5ZM800-480q0 52-19 97t-53 81l-57-57q22-22 35.5-50.5T720-480q0-100-70-170t-170-170h-3l44 44-57 56-140-140 140-140 57 56-43 44h2q133 0 226.5 93.5T800-480ZM580-539l-42-42q11-12 18.5-28t7.5-35q0-35-24.5-59.5T480-728v-80q68 0 114 46.5T640-644q0 29-11.5 56T580-539Z"/></svg>
            </span>
            <h3 id="emptyTitle">Request Expired</h3>
            <p id="emptyDesc">This price request was made over an hour ago. Please request info again from the inventory screen.</p>
        </div>

    </div>

    <!-- Floating Attendance Button - Redesigned Icon & Color -->
    <a href="attandance.html" class="fab-attendance" onclick="if(navigator.vibrate) navigator.vibrate(30);" title="Attendance">
        <svg class="material-symbols-outlined" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" fill="currentColor">
            <path d="M684-136 492-328l56-56 136 136 292-292 56 56-348 348ZM160-160v-112q0-34 17.5-62.5T224-378q62-31 126-46.5T480-440q32 0 63 3.5t61 10.5l-44 63q-39-11-79-17h-41v112H160Zm160-400q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47Z"/>
        </svg>
    </a>

    <script type="module">
        import { db } from './config.js';
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

        // Vibrate helper
        const vibrate = () => { if(navigator.vibrate) navigator.vibrate(20); };

        async function fetchAskData() {
            const skeleton = document.getElementById('skeletonCard');
            const dataCard = document.getElementById('dataCard');
            const emptyState = document.getElementById('emptyState');

            try {
                // Exactly 1 DB Read
                const askRef = doc(db, "ask", "ask");
                const docSnap = await getDoc(askRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    
                    // 1-Hour Time Validation Logic
                    if (data.clickedTime) {
                        const clickedDate = new Date(data.clickedTime);
                        const now = new Date();
                        const diffInMs = now - clickedDate;
                        const ONE_HOUR = 60 * 60 * 1000;

                        if (diffInMs > ONE_HOUR) {
                            // Expired
                            skeleton.style.display = 'none';
                            emptyState.style.display = 'flex';
                            return;
                        }

                        // Format Time for UI
                        const options = { hour: '2-digit', minute: '2-digit', hour12: true };
                        document.getElementById('uiTime').innerText = clickedDate.toLocaleTimeString('en-US', options);
                    } else {
                        // If no timestamp exists, treat as expired to be safe
                        skeleton.style.display = 'none';
                        emptyState.style.display = 'flex';
                        return;
                    }

                    // Populate UI
                    document.getElementById('uiName').innerText = data.name || 'Unnamed Product';
                    document.getElementById('uiModel').innerText = data.model || 'No Model ID';
                    document.getElementById('uiQty').innerText = data.qty !== undefined ? data.qty : '0';
                    document.getElementById('uiMrp').innerText = `₹${(data.mrp || 0).toLocaleString()}`;
                    document.getElementById('uiBase').innerText = `₹${(data.price || 0).toLocaleString()}`;
                    
                    // Populate Huge Rate
                    document.getElementById('uiRate').innerText = `₹${(data.myRate || 0).toLocaleString()}`;

                    // Switch view
                    skeleton.style.display = 'none';
                    dataCard.style.display = 'flex';
                    vibrate();

                } else {
                    // Document doesn't exist yet
                    skeleton.style.display = 'none';
                    document.getElementById('emptyTitle').innerText = 'No Data Found';
                    document.getElementById('emptyDesc').innerText = 'No price request has been sent to the database yet.';
                    document.getElementById('emptyIcon').innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 -960 960 960" fill="currentColor"><path d="M840-176 176-840l56-56 664 664-56 56ZM264-240q-76 0-130-54t-54-130q0-68 44.5-119T236-606l66 66q-26 13-43 38t-17 58q0 42 29 71t71 29h84v42q0 26 18.5 44.5T490-240v-80h60v80h166l60 60H264Zm458-196-56-56h62q42 0 71-29t29-71q0-42-29-71t-71-29h-60v-80q0-54-32.5-94.5T554-706l-58-58q30-10 60.5-13t61.5 6q70 20 116 76.5T780-560v20q55 8 91.5 49.5T908-400q0 58-37 101.5T770-244l-48-48q22-10 38-29.5t16-42.5h-54Z"/></svg>';
                    emptyState.style.display = 'flex';
                }
            } catch (error) {
                console.error("Error fetching request:", error);
                skeleton.style.display = 'none';
                document.getElementById('emptyTitle').innerText = 'Connection Error';
                document.getElementById('emptyDesc').innerText = 'Failed to load data. Please check your internet connection.';
                document.getElementById('emptyIcon').innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 -960 960 960" fill="currentColor"><path d="M840-176 176-840l56-56 664 664-56 56Zm-254-474L476-760q64 0 123 20t111 58l-58 58q-39-25-82-38t-84-13Zm168 168-58-58q40-34 70-76t46-88l74 24q-21 60-57 111t-75 87Zm104-206-74-24q24-42 36-87t12-91h80q0 56-15 109t-39 93ZM616-240 480-376l-136 136-56-56 192-192 192 192-56 56Zm-300-98L192-462q-28 35-48 74t-32 82H32q15-56 39-108t59-96l62 62q-27 34-47 72t-33 80h84q10-23 23-45t30-41Zm-82-82L98-556q35-40 76-74t86-60l62 62q-38 22-72 50t-60 64l-56-56Zm146-146-62-62q49-33 103-55t113-27v80q-47 4-91 21t-81 43Z"/></svg>';
                emptyState.style.display = 'flex';
            }
        }

        // Initialize Fetch on load
        fetchAskData();
    </script>
</body>
</html>
