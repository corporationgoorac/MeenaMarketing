<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Customer Rewards - Meena Marketing</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b111a">
    
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">

    <style>
        * { scrollbar-width: none; } *::-webkit-scrollbar { display: none; }
        
        /* Shared Core Theme matched to Inventory */
        :root {
            --bg-color: #0b111a; 
            --surface-color: #131b26; 
            --surface-hover: #1b2636;
            --text-color: #ffffff;
            --text-secondary: #94a3b8;
            --meena-red: #ef4444; 
            --marketing-white: #ffffff;
            --accent-color: #0d9488; 
            --success-color: #10b981; 
            --warning-color: #f59e0b;
            --input-border: #334155;
            --nav-bg: rgba(19, 27, 38, 0.85);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -2px rgba(0, 0, 0, 0.25);
            
            /* Enhanced Tier Colors to pop against Midnight Blue */
            --tier-silver: #94a3b8;
            --tier-gold: #fbbf24;
            --tier-platinum: #e2e8f0;
            --tier-diamond: #06b6d4;
        }

        *, *::before, *::after { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; padding: 0; width: 100%; overflow-x: hidden; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            display: flex; 
            flex-direction: column; 
            -webkit-font-smoothing: antialiased;
            /* ANTI-COPY & SELECT PROTECTIONS */
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            -webkit-touch-callout: none;
        }

        /* Glassmorphism Header */
        header { 
            background-color: #212121; 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px); 
            padding: 14px 20px; 
            display: flex; justify-content: space-between; align-items: center; 
            position: sticky; top: 0; z-index: 500; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
            box-shadow: var(--shadow-md);
            width: 100%;
        }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .back-btn { color: var(--text-color); cursor: pointer; display: flex; align-items: center; text-decoration: none; transition: color 0.2s;}
        .back-btn:hover { color: var(--accent-color); }
        .brand-container { display: flex; align-items: center; gap: 10px; }
        .brand-text { display: flex; flex-direction: column; line-height: 1.15; }
        .brand-title { font-size: 1.25em; font-weight: 700; letter-spacing: -0.02em;}
        .meena { color: var(--meena-red); }
        .marketing { color: var(--marketing-white); }
        .page-title { font-size: 0.75em; color: var(--success-color); font-weight: 600; text-transform: uppercase; letter-spacing: 1px;}
        .header-right { display: flex; align-items: center; gap: 15px; }

        /* Main Center Container */
        .container { padding: 20px; max-width: 500px; margin: 10px auto; width: 100%; }

        /* --- SKELETON REDESIGN --- */
        .skeleton-wrapper { display: block; }
        .skeleton {
            background: #1e293b; 
            background-image: linear-gradient(90deg, rgba(255,255,255,0) 0px, rgba(255,255,255,0.06) 40px, rgba(255,255,255,0) 80px); 
            background-size: 200% 100%; 
            animation: shimmer 1.5s infinite linear;
            border-radius: 12px;
        }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        
        .sk-hero { height: 160px; width: 100%; margin-bottom: 25px; border-radius: 16px; border: 1px solid var(--input-border); }
        .sk-alert { height: 50px; width: 100%; margin-bottom: 20px; border-radius: 8px; }
        .sk-card { height: 85px; width: 100%; margin-bottom: 15px; border-radius: 12px; }

        /* Actual Content Styles */
        .content-wrapper { display: none; }

        /* --- TIERED CUSTOMER BILL SUMMARY --- */
        .bill-summary {
            background: var(--surface-color);
            border-radius: 16px;
            padding: 25px 20px;
            margin-bottom: 25px;
            text-align: center;
            position: relative;
            transition: all 0.4s ease;
        }

        /* Tier Dynamic Borders & Glows tuned for dark background */
        .bill-summary.tier-none {
            border: 1px solid var(--input-border);
            box-shadow: var(--shadow-md);
        }
        .bill-summary.tier-silver {
            border: 2px dashed var(--tier-silver);
            background: linear-gradient(180deg, rgba(148, 163, 184, 0.05) 0%, transparent 100%);
            box-shadow: 0 0 20px rgba(148, 163, 184, 0.15);
        }
        .bill-summary.tier-gold {
            border: 3px dotted var(--tier-gold);
            background: linear-gradient(180deg, rgba(251, 191, 36, 0.05) 0%, transparent 100%);
            box-shadow: 0 0 25px rgba(251, 191, 36, 0.15);
        }
        .bill-summary.tier-platinum {
            border: 4px double var(--tier-platinum);
            background: linear-gradient(180deg, rgba(226, 232, 240, 0.1) 0%, transparent 100%);
            box-shadow: 0 0 30px rgba(226, 232, 240, 0.2);
        }
        .bill-summary.tier-diamond {
            border: 2px solid var(--tier-diamond);
            background: linear-gradient(180deg, rgba(6, 182, 212, 0.1) 0%, transparent 100%);
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.25);
            animation: diamondPulse 2s infinite alternate;
        }

        @keyframes diamondPulse {
            0% { box-shadow: 0 0 25px rgba(6, 182, 212, 0.2); }
            100% { box-shadow: 0 0 45px rgba(6, 182, 212, 0.4); }
        }

        /* Customer Profile Typography */
        .tier-badge {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-color);
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 0.75em;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: none;
        }
        .bill-summary.tier-silver .tier-badge { display: inline-block; color: var(--tier-silver); border: 1px dashed var(--tier-silver); }
        .bill-summary.tier-gold .tier-badge { display: inline-block; color: var(--tier-gold); border: 1px dotted var(--tier-gold); }
        .bill-summary.tier-platinum .tier-badge { display: inline-block; color: #1e293b; background: var(--tier-platinum); }
        .bill-summary.tier-diamond .tier-badge { display: inline-block; color: #000; background: var(--tier-diamond); text-shadow: none; box-shadow: 0 0 15px rgba(6, 182, 212, 0.5); }

        .bill-summary h2 { margin: 10px 0 5px 0; font-size: 1.5em; color: var(--marketing-white); font-weight: 700; letter-spacing: -0.02em; }
        .bill-summary p.invoice-meta { margin: 0; color: var(--text-secondary); font-size: 0.85em; text-transform: uppercase; letter-spacing: 1px; font-weight: 600;}
        .bill-summary .total { font-size: 2.2em; font-weight: 900; color: var(--success-color); margin-top: 15px; letter-spacing: -0.5px; text-shadow: 0 0 15px rgba(16, 185, 129, 0.3);}
        .bill-summary .discount-warning { color: var(--warning-color); font-size: 0.85em; margin-top: 8px; font-weight: 700; background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.2); display: inline-block; padding: 4px 12px; border-radius: 8px;}

        /* AI Alert Box */
        .ai-alert {
            padding: 16px;
            border-radius: 12px;
            font-size: 0.9em;
            margin-bottom: 25px;
            display: none;
            align-items: flex-start;
            gap: 12px;
            text-align: left;
            line-height: 1.5;
            box-shadow: var(--shadow-sm);
        }
        .ai-alert.bad { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; }
        .ai-alert.warn { background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.4); color: #fcd34d; }
        .ai-alert.good { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.4); color: #6ee7b7; }
        .ai-alert strong { color: white; font-weight: 700; }

        /* Voucher Cards Grid */
        .cards-container { display: flex; flex-direction: column; gap: 15px; }

        .voucher-card {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 1px solid var(--input-border);
            border-radius: 14px;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-md);
            animation: slideUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: translateY(30px);
            position: relative;
            overflow: hidden;
            transition: transform 0.2s;
        }
        .voucher-card:hover { transform: translateY(-3px) scale(1.02); }

        /* Subtle shine effect over cards */
        .voucher-card::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.03) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            animation: shine 5s infinite;
        }

        @keyframes shine { 0% { left: -100%; } 20% { left: 200%; } 100% { left: 200%; } }

        .card-left { text-align: left; z-index: 1; }
        .card-name { font-size: 1.15em; font-weight: 800; color: var(--marketing-white); margin-bottom: 5px; display: flex; align-items: center; gap: 8px; letter-spacing: -0.01em;}
        .card-rules { font-size: 0.75em; color: var(--text-secondary); line-height: 1.5; font-weight: 500;}
        
        .card-right { text-align: right; z-index: 1; }
        .card-value { font-size: 1.9em; font-weight: 900; color: var(--success-color); text-shadow: 0 2px 10px rgba(0,0,0,0.5); }

        .no-voucher {
            text-align: center; padding: 40px 20px; background: var(--surface-color);
            border-radius: 16px; border: 1px solid var(--input-border); color: var(--text-secondary);
            box-shadow: var(--shadow-md);
        }

        @keyframes slideUp { to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body oncontextmenu="return false;" onselectstart="return false;" ondragstart="return false;">

    <header>
        <div class="header-left">
        <a href="javascript:history.back()" class="back-btn" onclick="if(navigator.vibrate) navigator.vibrate(50);">
        <span class="material-symbols-outlined">arrow_back</span>
         </a>
            <div class="brand-container">
                <div class="brand-text">
                    <span class="brand-title"><span class="meena">Meena</span> <span class="marketing">Marketing</span></span>
                    <span class="page-title">Smart Rewards</span>
                </div>
            </div>
        </div>
        <div class="header-right">
            <span class="material-symbols-outlined" style="color: var(--tier-gold); cursor: pointer;" onclick="if(navigator.vibrate) navigator.vibrate(50); window.location.href='dailyCheck.html'" title="Daily Check">assignment_turned_in</span>
            <span class="material-symbols-outlined" style="color: var(--tier-gold); display: none;" onclick="if(navigator.vibrate) navigator.vibrate(50);">workspace_premium</span>
        </div>
    </header>

    <div class="container">
        
        <div class="skeleton-wrapper" id="skeletonLoader">
            <div class="skeleton sk-hero"></div>
            <div class="skeleton sk-alert"></div>
            <div class="skeleton sk-card"></div>
            <div class="skeleton sk-card"></div>
        </div>

        <div class="content-wrapper" id="mainContent">
            
            <div class="bill-summary tier-none" id="customerHeroBox">
                <div class="tier-badge" id="uiTierBadge">Tier</div>
                <p class="invoice-meta" id="uiInvoice">Inv: ---</p>
                <h2 id="uiCustomerName">Fetching Name...</h2>
                <div class="total" id="uiTotal">₹0.00</div>
                <div class="discount-warning" id="uiDiscountInfo" style="display:none;"></div>
            </div>

            <div class="ai-alert" id="aiAlertBox">
                <span class="material-symbols-outlined" style="font-size: 1.8em; margin-top: 2px;" id="aiIcon">smart_toy</span>
                <span id="aiAlertText"></span>
            </div>

            <h3 id="rewardTitle" style="display:none; font-size:0.85em; margin-bottom: 15px; text-align: left; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; font-weight: 700;">Unlocked Rewards</h3>
            
            <div class="cards-container" id="cardsContainer"></div>

            <div class="no-voucher" id="noVoucherBox" style="display:none;">
                <span class="material-symbols-outlined" style="font-size: 3.5em; color: rgba(255,255,255,0.1); margin-bottom: 12px;">remove_shopping_cart</span>
                <br><span style="font-size: 1.1em; font-weight: 700; color: var(--marketing-white);">No Eligible Rewards</span>
                <p style="font-size: 0.85em; margin-top: 8px; font-weight: 500;">Criteria not met for this specific transaction.</p>
            </div>

        </div>
    </div>

    <script type="module">
        import { db } from './config.js';
        import { collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

        // Anti-Inspect script fallbacks
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && e.key === 'I')) { e.preventDefault(); }
        });

        const VOUCHER_CARDS = [
            { name: "Silver Voucher", amount: 150, color: "var(--tier-silver)", icon: "military_tech" },
            { name: "Gold Voucher", amount: 200, color: "var(--tier-gold)", icon: "workspace_premium" },
            { name: "Platinum Voucher", amount: 250, color: "var(--tier-platinum)", icon: "diamond" },
            { name: "Diamond Voucher", amount: 300, color: "var(--tier-diamond)", icon: "stars" }
        ];

        async function fetchLastBillAndProcess() {
            try {
                // BUG FIX: Changed orderBy("date", "desc") to orderBy("createdAt", "desc")
                // Because 'date' can be overridden by the user to a future date, 'createdAt' represents the exact millisecond the server received the bill.
                const q = query(collection(db, "sellings"), orderBy("createdAt", "desc"), limit(1));
                const snapshot = await getDocs(q);

                if (snapshot.empty) {
                    showError("No recent sales found.");
                    return;
                }

                const lastSale = snapshot.docs[0].data(); 
                processRewards(lastSale);

            } catch (error) {
                console.error("Firestore Error:", error);
                showError("Database connection failed. Check console for details.");
            }
        }

        function processRewards(saleData) {
            const customerName = saleData.customer?.name || "Walk-in Customer";
            const invoiceNo = saleData.invoiceNo || "N/A";
            
            const grandTotal = parseFloat(saleData.totals?.grand || 0);
            const billDiscount = parseFloat(saleData.totals?.discount || 0);
            const grossTotal = grandTotal + billDiscount; // Total before counter discount

            // Edge Case Failsafe: Handle returns or zero-total bills
            if (grandTotal <= 0 || grossTotal <= 0) {
                updateUIForError(customerName, invoiceNo, "Invalid transaction amount. Rewards voided.");
                return;
            }

            // Update Basic UI
            document.getElementById('uiCustomerName').innerText = customerName;
            document.getElementById('uiInvoice').innerText = `Invoice Number: ${invoiceNo}`;
            document.getElementById('uiTotal').innerText = `₹${grandTotal.toLocaleString('en-IN', {minimumFractionDigits: 2})}`;
            
            const discountInfoBox = document.getElementById('uiDiscountInfo');
            if (billDiscount > 0) {
                discountInfoBox.style.display = 'inline-block';
                discountInfoBox.innerText = `Counter Discount: -₹${billDiscount.toLocaleString('en-IN')}`;
            }

            // --- HIGHLY ADVANCED LOGIC (GRADUAL DOWNGRADE + FLAT CAP) ---
            
            // 1. Determine Initial Base Level based on grandTotal
            // 4 = Diamond, 3 = Platinum, 2 = Gold, 1 = Silver, 0 = None
            let rawLevel = 0;
            if (grandTotal >= 20000) rawLevel = 4;
            else if (grandTotal >= 10000) rawLevel = 3;
            else if (grandTotal >= 5000) rawLevel = 2;
            else if (grandTotal >= 2000) rawLevel = 1;

            let finalLevel = rawLevel;
            let alertType = 'none';
            let alertMsg = '';

            // 2. Margin Protection Cross-Referencing
            if (billDiscount > 0 && rawLevel > 0) {
                const discountRatio = (billDiscount / grossTotal);
                const discountPercent = (discountRatio * 100).toFixed(1);
                
                let penaltySteps = 0;

                // Rule A: Flat Maximum Cap (Prevents edge case of massive flat loss on huge bills)
                if (billDiscount >= 1500) {
                    penaltySteps = rawLevel; // Instant wipe regardless of percentage
                    alertType = 'bad';
                    alertMsg = `<strong>Critical Margin Alert:</strong> A massive flat discount (₹${billDiscount.toFixed(0)}) exceeded system limits. All tier rewards voided to protect profitability.`;
                }
                // Rule B: Step-by-step percentage calculation
                else {
                    if (discountRatio > 0.10) {
                        penaltySteps = rawLevel; // >10% discount: Wipe all rewards (Level 0)
                    } else if (discountRatio > 0.07) {
                        penaltySteps = 3;        // 7%-10% discount: Downgrade 3 tiers
                    } else if (discountRatio > 0.04) {
                        penaltySteps = 2;        // 4%-7% discount: Downgrade 2 tiers
                    } else if (discountRatio > 0.02) {
                        penaltySteps = 1;        // 2%-4% discount: Downgrade 1 tier
                    } // 0 - 2% discount: 0 Penalty (Safe rounding)

                    // Apply penalty, keeping it from dropping below 0
                    finalLevel = Math.max(0, rawLevel - penaltySteps);
                    const tierNames = ["None", "Silver", "Gold", "Platinum", "Diamond"];

                    if (finalLevel === 0 && rawLevel > 0) {
                        alertType = 'bad';
                        alertMsg = `<strong>Margin Critical Alert:</strong> A high discount of ${discountPercent}% (₹${billDiscount.toFixed(0)}) voided all tier rewards to protect overall store profitability.`;
                    } else if (penaltySteps > 0) {
                        alertType = 'warn';
                        alertMsg = `<strong>Reward Scaled Down:</strong> A ${discountPercent}% discount (₹${billDiscount.toFixed(0)}) was applied at the counter. System dynamically downgraded rewards from ${tierNames[rawLevel]} to ${tierNames[finalLevel]} Tier to balance margins.`;
                    } else {
                        alertType = 'good';
                        alertMsg = `<strong>Margin Check Passed:</strong> Minor rounding discount detected (${discountPercent}%). Full ${tierNames[rawLevel]} tier rewards have been securely processed.`;
                    }
                }
            } else if (rawLevel > 0) {
                // No discount given, perfect margin.
                const tierNames = ["None", "Silver", "Gold", "Platinum", "Diamond"];
                alertType = 'good';
                alertMsg = `<strong>Perfect Margin:</strong> Full price sale detected. Maximum authorized ${tierNames[rawLevel]} rewards processed.`;
            }

            // 3. Assign Final Tier Strings & Cards
            let activeTier = "none";
            let earnedCards = [];

            if (finalLevel === 4) {
                activeTier = "diamond";
                earnedCards = [VOUCHER_CARDS[0], VOUCHER_CARDS[1], VOUCHER_CARDS[2], VOUCHER_CARDS[3]];
            } else if (finalLevel === 3) {
                activeTier = "platinum";
                earnedCards = [VOUCHER_CARDS[0], VOUCHER_CARDS[1], VOUCHER_CARDS[2]];
            } else if (finalLevel === 2) {
                activeTier = "gold";
                earnedCards = [VOUCHER_CARDS[0], VOUCHER_CARDS[1]];
            } else if (finalLevel === 1) {
                activeTier = "silver";
                earnedCards = [VOUCHER_CARDS[0]];
            }

            // 4. Apply calculated styling to UI
            const heroBox = document.getElementById('customerHeroBox');
            const tierBadge = document.getElementById('uiTierBadge');
            
            heroBox.className = `bill-summary tier-${activeTier}`;
            if (activeTier !== "none") {
                tierBadge.innerText = `${activeTier.toUpperCase()} TIER`;
                tierBadge.style.display = 'inline-block';
            } else {
                tierBadge.style.display = 'none';
            }

            // Handle Alert Box
            const aiAlertBox = document.getElementById('aiAlertBox');
            const aiAlertText = document.getElementById('aiAlertText');
            const aiIcon = document.getElementById('aiIcon');

            if (alertType !== 'none') {
                aiAlertBox.style.display = 'flex';
                aiAlertBox.className = `ai-alert ${alertType}`;
                aiAlertText.innerHTML = alertMsg;
                
                if (alertType === 'bad') aiIcon.innerText = 'gpp_bad';
                if (alertType === 'warn') aiIcon.innerText = 'warning';
                if (alertType === 'good') aiIcon.innerText = 'gpp_good';
            }

            renderCards(earnedCards);
            
            // Switch UI states
            document.getElementById('skeletonLoader').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
        }

        function renderCards(cardsArray) {
            const container = document.getElementById('cardsContainer');
            const noVoucherBox = document.getElementById('noVoucherBox');
            const rewardTitle = document.getElementById('rewardTitle');
            
            container.innerHTML = ''; 

            if (cardsArray.length === 0) {
                noVoucherBox.style.display = 'block';
                rewardTitle.style.display = 'none';
                return;
            }

            noVoucherBox.style.display = 'none';
            rewardTitle.style.display = 'block';

            cardsArray.forEach((card, index) => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'voucher-card';
                cardDiv.style.animationDelay = `${index * 0.15}s`; 
                cardDiv.style.borderLeft = `4px solid ${card.color}`;
                
                cardDiv.innerHTML = `
                    <div class="card-left">
                        <div class="card-name" style="color: ${card.color};">
                            <span class="material-symbols-outlined" style="font-size: 1.2em;">${card.icon}</span> 
                            ${card.name}
                        </div>
                        <div class="card-rules">
                            • Valid for 2 Months<br>
                            • One coupon per future purchase
                        </div>
                    </div>
                    <div class="card-right">
                        <div class="card-value">₹${card.amount}</div>
                    </div>
                `;
                container.appendChild(cardDiv);
            });
        }

        function updateUIForError(name, invoice, msg) {
            document.getElementById('uiCustomerName').innerText = name;
            document.getElementById('uiInvoice').innerText = `Invoice Number: ${invoice}`;
            document.getElementById('uiTotal').style.display = 'none';
            
            const aiAlertBox = document.getElementById('aiAlertBox');
            aiAlertBox.style.display = 'flex';
            aiAlertBox.className = `ai-alert bad`;
            document.getElementById('aiAlertText').innerHTML = `<strong>Error:</strong> ${msg}`;
            document.getElementById('aiIcon').innerText = 'gpp_bad';
            
            document.getElementById('noVoucherBox').style.display = 'block';
            
            document.getElementById('skeletonLoader').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
        }

        function showError(msg) {
            document.getElementById('skeletonLoader').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            document.getElementById('uiCustomerName').innerText = "System Notice";
            document.getElementById('uiCustomerName').style.color = "var(--meena-red)";
            document.getElementById('uiInvoice').innerText = msg;
            document.getElementById('uiTotal').style.display = 'none';
        }

        // Network delay to simulate AI processing/Skeleton loading
        window.onload = () => {
            setTimeout(fetchLastBillAndProcess, 1000); 
        };
    </script>
</body>
</html>
