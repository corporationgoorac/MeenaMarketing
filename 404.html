<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>404 - Page Not Found | Meena Marketing</title>
    <style>
        :root {
            --bg: #0D1117;
            --surface: #161B22;
            --brand-red: #FF4F5A;
            --mint: #20C997;
            --amber: #F5A623;
            --blue: #3B82F6;
            --text-main: #FFFFFF;
            --text-muted: #7E8494;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Ambient Background Glow */
        .ambient-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vw;
            max-width: 800px;
            max-height: 800px;
            background: radial-gradient(circle, rgba(255, 79, 90, 0.03) 0%, transparent 70%);
            z-index: 0;
            pointer-events: none;
        }

        /* Content Container */
        .content-wrapper {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 500px;
            padding: 0 24px;
            animation: fadeUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Branding */
        .brand-logo {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 24px;
            color: var(--text-muted);
        }
        .brand-logo span {
            color: var(--brand-red);
        }

        /* Typography */
        .error-code {
            font-size: 120px;
            font-weight: 900;
            line-height: 1;
            letter-spacing: -2px;
            margin-bottom: 16px;
            background: linear-gradient(180deg, #FFFFFF 0%, rgba(255, 255, 255, 0.2) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .error-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-main);
        }

        .error-description {
            font-size: 15px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* CSS Animated SVG Icons (Screen Animations) */
        .icon-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .floating-icon {
            position: absolute;
            opacity: 0;
            animation-fill-mode: forwards;
        }

        .floating-icon svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.4));
        }

        /* Specific Icon Positions & Animations */
        
        /* 1. Broken Link (Red) - Top Left */
        .icon-link {
            top: 20%;
            left: 15%;
            width: 48px;
            height: 48px;
            animation: float-1 12s ease-in-out infinite, fadeIn 1s ease-out 0.2s forwards;
        }

        /* 2. Search Glass (Mint) - Top Right */
        .icon-search {
            top: 25%;
            right: 18%;
            width: 56px;
            height: 56px;
            animation: float-2 14s ease-in-out infinite, fadeIn 1s ease-out 0.4s forwards;
        }

        /* 3. Settings Gear (Amber) - Bottom Left */
        .icon-gear {
            bottom: 25%;
            left: 20%;
            width: 64px;
            height: 64px;
            animation: float-3 15s ease-in-out infinite, fadeIn 1s ease-out 0.6s forwards;
        }

        /* 4. Missing File (Blue) - Bottom Right */
        .icon-file {
            bottom: 20%;
            right: 15%;
            width: 52px;
            height: 52px;
            animation: float-4 13s ease-in-out infinite, fadeIn 1s ease-out 0.8s forwards;
        }

        /* Keyframes for Ambient Floating */
        @keyframes fadeIn {
            to { opacity: 0.6; }
        }

        @keyframes float-1 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(15px, -20px) rotate(5deg); }
            66% { transform: translate(-10px, 15px) rotate(-5deg); }
        }

        @keyframes float-2 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(-20px, -15px) rotate(-10deg); }
            66% { transform: translate(15px, -10px) rotate(5deg); }
        }

        @keyframes float-3 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(20px, 20px) rotate(15deg); }
            66% { transform: translate(-15px, -15px) rotate(-5deg); }
        }

        @keyframes float-4 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(-15px, 20px) rotate(-5deg); }
            66% { transform: translate(20px, -15px) rotate(10deg); }
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .error-code { font-size: 96px; }
            .error-title { font-size: 20px; }
            .icon-link { top: 10%; left: 10%; width: 36px; height: 36px; }
            .icon-search { top: 12%; right: 10%; width: 42px; height: 42px; }
            .icon-gear { bottom: 15%; left: 12%; width: 48px; height: 48px; }
            .icon-file { bottom: 12%; right: 10%; width: 40px; height: 40px; }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <!-- Animated SVG Layer -->
    <div class="icon-layer">
        
        <!-- Broken Link -->
        <div class="floating-icon icon-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--brand-red)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                <line x1="8" y1="8" x2="16" y2="16" stroke="#FFFFFF"></line>
            </svg>
        </div>

        <!-- Analytics/Search -->
        <div class="floating-icon icon-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--mint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
        </div>

        <!-- Settings Gear -->
        <div class="floating-icon icon-gear">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-2.82.33 1.65 1.65 0 0 0-.1 1.5 2 2 0 0 1-1.6 2.74h-.84a2 2 0 0 1-1.6-2.74 1.65 1.65 0 0 0-.1-1.5 1.65 1.65 0 0 0-2.82-.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.5-.1 2 2 0 0 1-2.74-1.6v-.84a2 2 0 0 1 2.74-1.6 1.65 1.65 0 0 0 1.5-.1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 2.82.33 1.65 1.65 0 0 0 .1-1.5 2 2 0 0 1 1.6-2.74h.84a2 2 0 0 1 1.6 2.74 1.65 1.65 0 0 0 .1 1.5 1.65 1.65 0 0 0 2.82.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82 1.65 1.65 0 0 0 1.5.1 2 2 0 0 1 2.74 1.6v.84a2 2 0 0 1-2.74 1.6 1.65 1.65 0 0 0-1.5.1z"></path>
            </svg>
        </div>

        <!-- Missing File -->
        <div class="floating-icon icon-file">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                <polyline points="13 2 13 9 20 9"></polyline>
                <line x1="9" y1="15" x2="15" y2="15"></line>
            </svg>
        </div>
    </div>

    <!-- Main Typography Content -->
    <main class="content-wrapper">
        <div class="brand-logo">
            <span>Meena</span> Marketing
        </div>
        
        <h1 class="error-code">404</h1>
        <h2 class="error-title">Page Not Found</h2>
        
        <p class="error-description">
            The requested resource could not be located on this server. Please verify the URL or return to your previous console view.
        </p>
    </main>

</body>
</html>
